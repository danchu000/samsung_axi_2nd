<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 계정정보 변경</title>
    <style>
        .form-section { flex: 1; padding: 20px; overflow-y: auto; }
        .info-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px;
            padding: 24px; margin-bottom: 20px; max-width: 720px; }
        .form-row { display: flex; align-items: flex-start; margin-bottom: 14px; }
        .form-row > label { width: 130px; padding-top: 8px; font-weight: 600; font-size: 14px;
            color: var(--color-font-gray); }
        .form-row .field { flex: 1; }
        .form-row input[type=text], .form-row input[type=email], .form-row input[type=password] {
            width: 100%; max-width: 340px; padding: 8px 10px; border: 1px solid var(--gray-300);
            border-radius: 4px; font-size: 14px; color: var(--color-font-gray); box-sizing: border-box; }
        .form-row input[readonly] { background: var(--gray-100); }
        .field-hint { display: block; font-size: 12px; color: var(--color-font-gray-light); margin-top: 4px; }
        .field-error { color: var(--color-danger); font-size: 12px; margin-top: 4px; display: block; }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        .target-summary { font-size: 14px; color: var(--color-font-gray); margin: 8px 0 16px; }
        .notice { padding: 12px 16px; border-radius: 6px; font-size: 13px; line-height: 1.6;
            background: var(--color-light-gray); color: var(--color-font-gray); margin-bottom: 20px;
            max-width: 720px; }
        .divider { border: 0; border-top: 1px solid var(--gray-200); margin: 22px 0 18px; }
        .divider-label { font-weight: 600; font-size: 14px; color: var(--color-font-gray); margin-bottom: 12px; }
    </style>
</head>
<body>
    <th:block th:with="active=${target.role.name() == 'ADMIN'} ? 'user-admin'
                              : (${target.role.name() == 'INSTRUCTOR'} ? 'user-instructor' : 'user-trainee')">
        <header th:replace="~{fragments/admin :: header('사용자 관리 > 계정정보 변경')}"></header>
        <th:block th:replace="~{fragments/admin :: sidebar(${active})}"/>
    </th:block>

    <main class="main-content">
        <section class="form-section">
            <div class="section-header"><h2>계정정보 변경</h2></div>

            <p class="target-summary">
                대상: <strong th:text="${target.name}">이름</strong>
                (<span th:text="${target.role.label}">역할</span> ·
                아이디 <span th:text="${target.loginId}">loginId</span>)
            </p>

            <div class="notice">
                최고 관리자만 사용할 수 있는 기능입니다. 비밀번호는 대상자의 현재 비밀번호 없이 즉시 재설정되며,
                변경 사실은 해당 계정의 <strong>접속 이력</strong>에 기록됩니다.
                바뀐 아이디·비밀번호는 대상자가 <strong>다음에 로그인할 때</strong>부터 적용됩니다.
            </div>

            <form class="info-card" th:action="@{/admin/accounts/{id}/credentials(id=${target.id})}"
                  th:object="${form}" method="post" autocomplete="off">
                <div class="form-row">
                    <label>아이디</label>
                    <div class="field">
                        <input type="text" th:field="*{loginId}" th:readonly="${loginIdLocked}">
                        <span class="field-hint" th:if="${loginIdLocked}">
                            최고 관리자 계정의 아이디는 변경할 수 없습니다 — 이 아이디가 최고 관리자 판별 기준입니다.
                        </span>
                        <span class="field-hint" th:unless="${loginIdLocked}">영문·숫자·밑줄 4~20자</span>
                        <span class="field-error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></span>
                    </div>
                </div>
                <div class="form-row">
                    <label>이메일</label>
                    <div class="field">
                        <input type="email" th:field="*{email}">
                        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>
                </div>

                <hr class="divider">
                <p class="divider-label">비밀번호 재설정</p>

                <div class="form-row">
                    <label>새 비밀번호</label>
                    <div class="field">
                        <input type="password" th:field="*{newPassword}" autocomplete="new-password">
                        <span class="field-hint">8자 이상. <strong>비워 두면 비밀번호를 변경하지 않습니다.</strong></span>
                        <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
                    </div>
                </div>
                <div class="form-row">
                    <label>새 비밀번호 확인</label>
                    <div class="field">
                        <input type="password" th:field="*{confirmPassword}" autocomplete="new-password">
                        <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="${backUrl}" class="btn btn-back">취소</a>
                    <button type="submit" class="btn btn-primary">저장하기</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
