<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/font/pretendard.css">
    <link rel="stylesheet" href="/static/css/i-common-style.css">
    <link rel="stylesheet" href="/static/css/i-sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/attendance.css">
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 강사 출결현황</title>
    <style>
        .toolbar { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px; }
        .toolbar label { display:block; font-size:13px; font-weight:600; color:#777; margin-bottom:4px; }
        .toolbar select { padding:8px 12px; border:1px solid #ddd; border-radius:8px; min-width:280px; }
        .readonly-hint { background:#eef3fb; color:#33466b; border:1px solid #cdd9ee; padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:13px; }
        .matrix-wrap { overflow-x:auto; }
        table.att-matrix { border-collapse:collapse; width:100%; font-size:13px; }
        table.att-matrix th, table.att-matrix td { border:1px solid #eee; padding:8px 10px; text-align:center; white-space:nowrap; }
        table.att-matrix th { background:#fafafa; color:#555; font-weight:600; }
        table.att-matrix td.name-cell, table.att-matrix th.name-cell { text-align:left; position:sticky; left:0; background:#fff; z-index:1; font-weight:600; }
        .att-badge { display:inline-block; min-width:44px; padding:3px 8px; border-radius:10px; font-size:12px; font-weight:600; }
        .att-PRESENT { background:#d4edda; color:#155724; }
        .att-LATE    { background:#fff3cd; color:#856404; }
        .att-ABSENT  { background:#f8d7da; color:#721c24; }
        .att-EXCUSED { background:#e2e3ff; color:#3730a3; }
        .att-NONE    { color:#bbb; }
        .rate-cell { font-weight:700; }
        .empty-hint { color:#999; font-size:14px; padding:24px 0; }
    </style>
</head>
<body data-user-role="instructor">
    <header th:replace="~{fragments/instructor :: header('출결/이수 관리 > 출결현황')}"></header>
    <th:block th:replace="~{fragments/instructor :: sidebar('att-status')}"/>

    <main class="main-content">
        <section class="main-content-inner">
            <div class="section-header">
                <h2>출결현황</h2>
            </div>

            <p class="readonly-hint">
                담당 과정의 출석부입니다. 조회 전용이며, 출결 정정(지각·공결 등 수동 보정)은 관리자에게 요청하세요.
            </p>

            <!-- 담당 과정 선택 -->
            <form class="toolbar" method="get" th:action="@{/instructor/attendance}">
                <div>
                    <label for="courseSelect">과정 선택</label>
                    <select id="courseSelect" name="courseId" onchange="this.form.submit()">
                        <option th:each="c : ${courses}" th:value="${c.id}"
                                th:selected="${selectedCourse != null and c.id == selectedCourse.id}"
                                th:text="|${c.courseName} (${c.courseCode}${c.cohort != null ? ' / ' + c.cohort : ''})|">과정</option>
                    </select>
                </div>
            </form>

            <!-- 출결 매트릭스 -->
            <div class="attendance-info-section" th:if="${selectedCourse != null}">
                <p class="empty-hint" th:if="${matrix == null or matrix.empty}">
                    산정된 출결이 없습니다. 일정이 지정된 차시와 승인된 수강생이 있는지 확인 후 관리자에게 재산정을 요청하세요.
                </p>
                <div class="matrix-wrap" th:unless="${matrix == null or matrix.empty}">
                    <table class="att-matrix">
                        <thead>
                            <tr>
                                <th class="name-cell">훈련생</th>
                                <th th:each="col : ${matrix.columns}"
                                    th:title="${col.date}"
                                    th:text="|${col.seq}차시|">차시</th>
                                <th>출석률</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${matrix.rows}">
                                <td class="name-cell" th:text="${row.traineeName}">훈련생</td>
                                <td th:each="cell : ${row.cells}">
                                    <span th:if="${!cell.recorded}" class="att-badge att-NONE">-</span>
                                    <span th:if="${cell.recorded}" class="att-badge"
                                          th:classappend="'att-' + ${cell.status}"
                                          th:text="${cell.label}">상태</span>
                                </td>
                                <td class="rate-cell" th:text="|${row.attendanceRate}%|">0%</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <p class="empty-hint" th:if="${selectedCourse == null}">담당하는 과정이 없습니다.</p>
        </section>
    </main>
</body>
</html>
