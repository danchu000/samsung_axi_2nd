<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <meta charset="UTF-8">
    <title>채점 상세 모달</title>
    <style>
        .grading-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .grading-modal {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px 0 rgba(0,0,0,0.13);
            width: 90%;
            max-width: 98vw;
            min-height: 540px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .grading-modal-half {
            flex: 1;
            padding: 32px 28px;
            overflow-y: auto;
            min-width: 0;
        }
        .grading-modal-divider {
            width: 1.5px;
            background: var(--gray-200);
            height: 100%;
        }
        .grading-modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 18px;
        }
        .grading-modal-close {
            position: absolute;
            top: 18px;
            right: 24px;
            font-size: 22px;
            color: var(--gray-500);
            background: none;
            border: none;
            cursor: pointer;
            z-index: 10;
        }

        .grading-container {
            display: flex;
            gap: 16px;
            /* flex-direction: column; */
        }
    </style>
</head>
<body>
    <div class="grading-modal-overlay" id="gradingModalOverlay">
        <div class="grading-modal">
            <button class="grading-modal-close" id="gradingModalCloseBtn" title="닫기">&times;</button>
            <div class="grading-container">

                <div class="grading-modal-half">
                    <div class="grading-modal-title">과제</div>
                    <div style="margin-bottom:6px;color:var(--gray-800);">
                        <b th:text="${detail.assignmentTitle}">과제명</b>
                        <span style="color:var(--gray-500);" th:text="' · ' + ${detail.courseName}">과정</span>
                    </div>
                    <div style="background:#f5f7fa;padding:12px 14px;border-radius:8px;white-space:pre-wrap;"
                         th:text="${detail.description}">과제 설명</div>

                    <div class="grading-modal-title" th:if="${not #lists.isEmpty(detail.criteria)}">채점 기준</div>
                    <table style="width:100%;border-collapse:collapse;" th:if="${not #lists.isEmpty(detail.criteria)}">
                        <tr th:each="c : ${detail.criteria}">
                            <td style="padding:6px 4px;border-bottom:1px solid var(--gray-200);" th:text="${c.seq} + '. ' + ${c.content}">기준</td>
                            <td style="padding:6px 4px;border-bottom:1px solid var(--gray-200);text-align:right;width:70px;"
                                th:text="${c.score} + '점'">배점</td>
                        </tr>
                    </table>
                </div>
                <div class="grading-modal-divider"></div>
                <div class="grading-modal-half">
                    <div class="grading-modal-title">제출 정보</div>
                    <div style="background:var(--gray-50);padding:16px 14px;border-radius:8px;">
                        <div th:text="'학생: ' + ${detail.studentName}">학생</div>
                        <div th:text="'제출 유형: ' + ${detail.submitTypeLabel}">유형</div>
                        <div th:text="'제출일: ' + ${detail.submittedAt} + ' (' + ${detail.attemptNo} + '회차)'">제출일</div>
                        <!-- isLate 는 제출 시점에 확정 저장된 값이다. 감점 근거라 다시 계산하지 않는다. -->
                        <div th:if="${detail.late}" style="color:var(--color-danger);font-weight:600;">마감 이후 제출(지각)</div>
                    </div>

                    <div class="grading-modal-title">학생 답안</div>
                    <div style="background:var(--gray-50);padding:16px 14px;border-radius:8px;min-height:120px;">
                        <div th:if="${detail.contentText}" style="white-space:pre-wrap;" th:text="${detail.contentText}">텍스트</div>
                        <div th:if="${detail.linkUrl}">
                            <a th:href="${detail.linkUrl}" th:text="${detail.linkUrl}" target="_blank" rel="noopener noreferrer">링크</a>
                        </div>
                        <!-- 첨부는 웹 루트 밖에 저장돼 있어 이 다운로드 엔드포인트로만 받을 수 있다.
                             원본 파일명은 응답 헤더에서만 되살린다. -->
                        <ul th:if="${not #lists.isEmpty(detail.files)}" style="margin:8px 0 0 18px;">
                            <li th:each="f : ${detail.files}">
                                <a th:href="@{${f.downloadUrl}}" th:text="${f.originalName}">파일</a>
                                <span style="color:var(--gray-500);" th:text="' (' + ${f.sizeBytes} + ' bytes)'"></span>
                            </li>
                        </ul>
                        <div th:if="${detail.contentText == null and detail.linkUrl == null and #lists.isEmpty(detail.files)}"
                             style="color:var(--gray-500);">제출 내용이 없습니다.</div>
                    </div>
                </div>
            </div>

            <!-- 채점 입력. th:action 이라 CSRF 히든필드가 자동으로 들어간다. -->
            <form th:object="${form}" method="post"
                  th:action="@{${actionPrefix} + ${courseAssignmentId} + '/submissions/' + ${detail.submissionId} + '/grading'}">
            <div style="background:#fff; border-radius:12px; border:1.5px solid var(--gray-200); box-shadow:0 2px 8px 0 rgba(0,0,0,0.03); padding:28px 24px 20px 24px;">
                <div th:if="${#fields.hasGlobalErrors()}"
                     style="margin-bottom:12px;padding:10px 12px;border-radius:8px;background:var(--color-danger-bg);color:var(--color-danger);">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">오류</div>
                </div>
                <div th:if="${saved}"
                     style="margin-bottom:12px;padding:10px 12px;border-radius:8px;background:#e7f6ec;color:#1a7f37;">
                    채점을 저장했습니다.
                </div>

                <div style="display:flex; gap:24px; align-items:center; margin-bottom:18px; flex-wrap:wrap;">
                    <div style="font-size:15px; color:var(--color-primary); font-weight:600;">과제 배점</div>
                    <div style="font-size:15px; color:var(--gray-800);" th:text="${detail.maxScore} + '점'">20점</div>
                    <div style="font-size:15px; color:var(--color-primary); font-weight:600; margin-left:32px;">통과점수</div>
                    <div style="font-size:15px; color:var(--gray-800);" th:text="${detail.passScore} + '점'">14점</div>
                    <div style="font-size:15px; color:var(--color-primary); font-weight:600; margin-left:32px;">입력점수</div>
                    <input type="number" min="0" th:max="${detail.maxScore}" th:field="*{score}"
                           style="width:80px; font-size:15px; padding:4px 8px; border-radius:6px; border:1px solid var(--gray-200);">
                </div>
                <div style="margin-bottom:14px;">
                    <div style="font-size:14px; color:var(--color-primary); font-weight:600; margin-bottom:6px;">피드백 (학생에게 공개)</div>
                    <textarea th:field="*{feedback}"
                              style="width:100%; min-height:48px; border-radius:8px; border:1px solid var(--gray-200); padding:12px 14px; font-size:14px; color:var(--gray-800); resize:vertical; background:var(--gray-50);"></textarea>
                </div>
                <div style="margin-bottom:14px;">
                    <div style="font-size:14px; color:var(--color-primary); font-weight:600; margin-bottom:6px;">내부 메모 (관리자/강사용)</div>
                    <textarea th:field="*{memo}"
                              style="width:100%; min-height:48px; border-radius:8px; border:1px solid var(--gray-200); padding:12px 14px; font-size:14px; color:var(--gray-800); resize:vertical; background:var(--gray-50);"></textarea>
                </div>
                <!--
                  이미 점수가 있는 상태에서 점수를 바꾸면 성적 "정정" 이다.
                  내역서 증빙 요건상 사유 없이 바꿀 수 없고, 사유는 GradeHistory 에 남는다.
                -->
                <div th:if="${detail.regrade}" style="margin-bottom:14px;">
                    <div style="font-size:14px; color:var(--color-danger); font-weight:600; margin-bottom:6px;">
                        성적 정정 사유 (점수를 변경하는 경우 필수 — 변경 이력에 남습니다)
                    </div>
                    <input type="text" th:field="*{reason}" placeholder="예: 기준 미달 예외 승인"
                           style="width:100%; border-radius:8px; border:1px solid var(--gray-200); padding:10px 14px; font-size:14px;">
                </div>
                <div>
                    <label style="font-size:14px; color:var(--gray-800);">
                        <input type="checkbox" th:field="*{confirm}"> 성적 확정 (확정된 성적만 이수 판정에 반영됩니다)
                    </label>
                </div>
            </div>
            <button type="submit" class="btn btn-secondary" id="gradingSaveBtn">저장하기</button>
            </form>
        </div>
    </div>
    <script th:inline="javascript">
        /*<![CDATA[*/
        // 저장이 끝나면 부모(채점 화면)를 새로고침하고 팝업을 닫는다.
        // 예전에는 저장 없이 닫기만 했다 — 지금은 서버 저장 후 이 플래그로 판단한다.
        var GRADING_SAVED = /*[[${saved}]]*/ false;
        document.addEventListener('DOMContentLoaded', function() {
            var overlay = document.getElementById('gradingModalOverlay');
            var closeBtn = document.getElementById('gradingModalCloseBtn');
            closeBtn.addEventListener('click', function() { window.close(); });
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) window.close();
            });
            if (GRADING_SAVED) {
                if (window.opener && !window.opener.closed) {
                    window.opener.location.reload();
                }
                setTimeout(function() { window.close(); }, 600);
            }
        });
        /*]]>*/
    </script>
</body>
</html>
