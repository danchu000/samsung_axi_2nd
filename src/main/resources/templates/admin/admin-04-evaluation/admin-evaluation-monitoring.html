<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/pagination.css">
    <link rel="stylesheet" href="/static/css/exams.css">
    
    <script src="/static/js/exams.js" defer></script>
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <script src="/static/js/pagination.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>

</head>
<body data-user-role="admin">
    <!-- 상단 헤더 / 사이드바 / 토글 버튼 — 공통 fragment 로 교체 (fragments/admin.html) -->
    <header th:replace="~{fragments/admin :: header('평가 관리 > 평가 모니터링')}"></header>
    <th:block th:replace="~{fragments/admin :: sidebar('eval-monitoring')}"/>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <!-- 평가 모니터링 -->
        <section class="main-content-inner">
            <!-- 필터 영역 -->
            <div class="filter-section">
                <div class="filter-row">
                    <div>
                        <label>과정명</label>
                        <select id="courseFilter">
                            <option value="">전체</option>
                            <option value="course1">풀스택 웹 개발 (React & Node.js)</option>
                            <option value="course2">데이터 사이언스 기초</option>
                            <option value="course3">클라우드 아키텍처</option>
                        </select>
                    </div>
                    <div>
                        <label>응시현황</label>
                        <select id="statusFilter">
                            <option value="">전체</option>
                            <option value="in-progress">응시중</option>
                            <option value="completed">완료</option>
                            <option value="not-started">미응시</option>
                        </select>
                    </div>
                    <div>
                        <label>강사명</label>
                        <select id="instructorFilter">
                            <option value="">전체</option>
                            <option value="김민수">김민수</option>
                            <option value="이영희">이영희</option>
                            <option value="박철수">박철수</option>
                        </select>
                    </div>
                    <div>
                        <label>등록일</label>
                        <select id="registrationDateFilter">
                            <option value="">전체</option>
                            <option value="today">오늘</option>
                            <option value="this-week">이번 주</option>
                            <option value="this-month">이번 달</option>
                            <option value="custom">직접 선택</option>
                        </select>
                    </div>
                    <div id="customRegistrationDateRange" style="display: none;">
                        <input type="date" id="registrationStartDate">
                        <span style="margin: 0 4px;">~</span>
                        <input type="date" id="registrationEndDate">
                    </div>
                    <div>
                        <label>시험 기간</label>
                        <select id="dateFilter">
                            <option value="">전체</option>
                            <option value="today">오늘</option>
                            <option value="this-week">이번 주</option>
                            <option value="this-month">이번 달</option>
                            <option value="custom">직접 선택</option>
                        </select>
                    </div>
                    <div id="customDateRange" style="display: none;">
                        <input type="date" id="startDate">
                        <span style="margin: 0 4px;">~</span>
                        <input type="date" id="endDate">
                    </div>
                    <div class="filter-item">
                        <label>검색</label>
                        <input type="text" id="searchInput" placeholder="수업명, 강사명, 시험명으로 검색">
                    </div>
                    <button class="btn btn-secondary">
                        검색하기
                    </button>
                    <!-- <button class="btn btn-primary">실시간 새로고침</button> -->
                </div>
            </div>

            <!-- 시험 목록 -->
            <div class="test-list">
                <div class="test-header">
                    <div>번호</div>
                    <div>수업명</div>
                    <div>시험명</div>
                    <div>강사명</div>
                    <div>시험응시기간</div>
                    <div>시험시간</div>
                    <div>응시현황</div>
                </div>
                <div id="testListContainer"></div>
            </div>
            <!-- 페이지네이션 -->
            <div class="pagination" style="margin-top: 25px;">
                <div class="page-info">
                    <span id="currentPageInfo">1</span> / <span id="totalPagesInfo">1</span> 페이지
                </div>
                <div class="pagination-controls">
                    <button id="prevPage" onclick="changePage(-1)" disabled>이전</button>
                    <div id="pageNumbers"></div>
                    <button id="nextPage" onclick="changePage(1)">다음</button>
                </div>
            </div>
        </section>
    </main>

    <!--
      서버 데이터 주입 — 기존 exams.js 의 더미 testList 를 그대로 대체한다.
      exams.js 는 defer 라 이 인라인 스크립트가 먼저 실행된다.
      값이 없으면(정적 미리보기) exams.js 가 기존 더미로 폴백한다.
    -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        window._serverTestRows = /*[[${rows}]]*/ null;
        /*]]>*/
    </script>
</body>
</html>
