<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/i-common-style.css">
    <link rel="stylesheet" href="/static/css/i-sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/graduate.css">
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 강사 이수 관리</title>
    <style>
        .toolbar { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px; }
        .toolbar label { display:block; font-size:13px; font-weight:600; color:var(--gray-500); margin-bottom:4px; }
        .toolbar select { padding:8px 12px; border:1px solid var(--gray-300); border-radius:8px; min-width:280px; }
        .readonly-hint { background:#eef3fb; color:#33466b; border:1px solid #cdd9ee; padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:13px; }
        table.grad-table { border-collapse:collapse; width:100%; font-size:13px; }
        table.grad-table th, table.grad-table td { border-bottom:1px solid var(--gray-200); padding:10px 12px; text-align:center; }
        table.grad-table th { background:var(--gray-50); color:var(--gray-600); font-weight:600; }
        .badge { display:inline-block; padding:3px 10px; border-radius:10px; font-size:12px; font-weight:600; }
        .res-PASS { background:var(--color-success-bg); color:var(--color-success); }
        .res-FAIL { background:var(--color-danger-bg); color:var(--color-danger); }
        .res-PENDING { background:#e2e3e5; color:#383d41; }
        .cs-CONFIRMED { background:#cfe2ff; color:#084298; }
        .cs-EXPECTED { background:var(--color-warning-bg); color:var(--color-warning); }
        .cs-PENDING { background:#e2e3e5; color:#383d41; }
        .empty-hint { color:var(--gray-500); font-size:14px; padding:24px 0; }
    </style>
</head>
<body data-user-role="instructor">
    <header th:replace="~{fragments/instructor :: header('출결/이수 관리 > 이수 관리')}"></header>
    <th:block th:replace="~{fragments/instructor :: sidebar('att-graduate')}"/>

    <main class="main-content">
        <section class="main-content-inner">
            <div class="section-header">
                <h2>이수 관리</h2>
            </div>

            <div th:replace="${sampleData} ? ~{fragments/instructor :: sampleNotice} : ~{}"></div>

            <p class="readonly-hint">
                담당 과정의 이수 현황입니다. 조회 전용이며, 이수 기준 설정·자동 판정·확정·이수증 발급은 관리자 화면에서 진행됩니다.
            </p>

            <!-- 담당 과정 선택 -->
            <form class="toolbar" method="get" th:action="@{/instructor/graduate}">
                <div>
                    <label for="courseSelect">과정 선택</label>
                    <select id="courseSelect" name="courseId" onchange="this.form.submit()">
                        <option th:each="c : ${courses}" th:value="${c.id}"
                                th:selected="${selectedCourse != null and c.id == selectedCourse.id}"
                                th:text="|${c.courseName} (${c.courseCode}${c.cohort != null ? ' / ' + c.cohort : ''})|">과정</option>
                    </select>
                </div>
            </form>

            <!-- 이수 현황 -->
            <div class="attendance-info-section" th:if="${selectedCourse != null}">
                <p class="empty-hint" th:if="${completions == null or completions.isEmpty()}">
                    판정된 이수 정보가 없습니다. 관리자에게 이수 자동 판정을 요청하세요.
                </p>
                <table class="grad-table" th:unless="${completions == null or completions.isEmpty()}">
                    <thead>
                        <tr>
                            <th>번호</th>
                            <th>훈련생명</th>
                            <th>생년월일</th>
                            <th>과정명/기수</th>
                            <th>진도율(%)</th>
                            <th>출석률(%)</th>
                            <th>이수상태</th>
                            <th>이수확정상태</th>
                            <th>확정일자</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="row, i : ${completions}">
                            <td th:text="${i.count}">1</td>
                            <td th:text="${row.traineeName}">훈련생</td>
                            <td th:text="${row.birthDate} ?: '-'">-</td>
                            <td th:text="${row.courseLabel}">과정</td>
                            <td th:text="${row.progressRate}">0</td>
                            <td th:text="${row.attendanceRate}">0</td>
                            <td><span class="badge" th:classappend="'res-' + ${row.result}" th:text="${row.resultLabel}">상태</span></td>
                            <td><span class="badge" th:classappend="'cs-' + ${row.confirmStatus}" th:text="${row.confirmStatusLabel}">확정</span></td>
                            <td th:text="${row.confirmedAt != null ? #temporals.format(row.confirmedAt, 'yyyy-MM-dd') : '-'}">-</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p class="empty-hint" th:if="${selectedCourse == null}">담당하는 과정이 없습니다.</p>
        </section>
    </main>
</body>
</html>
