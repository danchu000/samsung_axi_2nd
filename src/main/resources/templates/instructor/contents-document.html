<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/font/pretendard.css">
    <link rel="stylesheet" href="/static/css/i-common-style.css">
    <link rel="stylesheet" href="/static/css/i-sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/contents-video.css">
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 문서 등록</title>
</head>
<body data-user-role="instructor">
    <header th:replace="~{fragments/instructor :: header(${mode == 'edit'} ? '콘텐츠 관리 > 문서 수정' : '콘텐츠 관리 > 문서 등록')}"></header>
    <th:block th:replace="~{fragments/instructor :: sidebar('contents')}"/>

    <main class="main-content">
        <div class="form-wrap">
            <form th:action="${mode == 'edit'} ? @{/instructor/contents/{id}(id=${contentId})} : @{/instructor/contents}"
                  method="post" enctype="multipart/form-data" th:object="${contentForm}">
                <input type="hidden" th:field="*{type}">

                <div class="form-section">
                    <h3 class="section-title" th:text="${mode == 'edit'} ? '문서 정보 수정' : '문서 등록'">문서 등록</h3>

                    <div th:if="${#fields.hasErrors('*')}" class="form-help" style="color:#d33; margin-bottom:12px;">
                        <p th:each="err : ${#fields.errors('*')}" th:text="${err}">오류</p>
                    </div>

                    <div class="form-row-triple">
                        <div class="form-group">
                            <label class="form-label required" for="courseId">과정</label>
                            <select class="form-select" id="courseId" th:field="*{courseId}" onchange="filterSessions()">
                                <option value="">과정 선택</option>
                                <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.courseName}">과정</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="sessionId">차시(선택)</label>
                            <select class="form-select" id="sessionId" th:field="*{sessionId}">
                                <option value="">과정 공용(차시 미지정)</option>
                                <option th:each="s : ${sessionOptions}" th:value="${s.id}" th:text="${s.label}"
                                        th:attr="data-course=${s.courseId}">차시</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="status">상태</label>
                            <select class="form-select" id="status" th:field="*{status}">
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.label}">상태</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label required" for="title">제목</label>
                        <input type="text" class="form-input" id="title" th:field="*{title}" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="description">문서 설명</label>
                        <textarea class="form-textarea" id="description" th:field="*{description}"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" th:classappend="${mode == 'edit'} ? '' : 'required'" for="docFile">문서 업로드</label>
                            <input type="file" class="form-input" id="docFile" name="file" accept=".pdf,image/*"
                                   th:required="${mode != 'edit'}">
                            <div class="form-help">PDF/이미지 파일. 수정 시 비워두면 기존 파일이 유지됩니다.</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="pageCount">총 페이지 수</label>
                            <input type="number" min="1" class="form-input" id="pageCount" th:field="*{pageCount}"
                                   placeholder="예: 10">
                            <div class="form-help">진도율 계산 기준. 미입력 시 열람 중 자동 감지 값을 사용합니다.</div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="orderNo">정렬 순서</label>
                            <input type="number" min="1" class="form-input" id="orderNo" th:field="*{orderNo}" placeholder="1">
                        </div>
                        <div class="form-group">
                            <label class="form-label">이수 필수 여부</label>
                            <label style="display:inline-flex; align-items:center; gap:6px; margin-top:8px;">
                                <input type="checkbox" th:field="*{required}"> 이수 필수 콘텐츠
                            </label>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <a class="btn btn-back" th:href="@{/instructor/contents}">취소</a>
                    <button type="submit" class="btn btn-save" th:text="${mode == 'edit'} ? '수정하기' : '등록하기'">등록하기</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        function filterSessions() {
            var courseId = document.getElementById('courseId').value;
            var sessionSelect = document.getElementById('sessionId');
            Array.prototype.forEach.call(sessionSelect.options, function (opt) {
                if (!opt.value) return;
                var match = opt.getAttribute('data-course') === courseId;
                opt.hidden = !match;
                if (!match && opt.selected) sessionSelect.value = '';
            });
        }
        document.addEventListener('DOMContentLoaded', filterSessions);
    </script>
</body>
</html>
