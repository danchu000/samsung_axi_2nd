<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>튜터링</title></head><body><main><h1>튜터링</h1><p th:if="${message}" th:text="${message}"></p><form method="post" th:action="@{/trainee/qna/tutoring}" th:object="${form}"><label>제목 <input th:field="*{title}"></label><label>첫 메시지 <textarea th:field="*{firstMessage}"></textarea></label><button>요청하기</button></form><ul><li th:each="room : ${rooms}"><a th:href="@{/trainee/qna/tutoring/{id}(id=${room.id})}" th:text="${room.title}"></a> <span th:text="${room.statusLabel}"></span></li><li th:if="${#lists.isEmpty(rooms)}">튜터링 요청이 없습니다.</li></ul><a th:href="@{/trainee/qna}">Q&A로 이동</a></main></body></html>
