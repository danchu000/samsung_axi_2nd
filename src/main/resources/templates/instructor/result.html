<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/i-common-style.css">
    <link rel="stylesheet" href="/static/css/i-sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/assignments.css">
    <link rel="stylesheet" href="/static/css/pagination.css">
    
    <script src="/static/js/pagination.js" defer></script>
    <script src="/static/js/assignments.js" defer></script>
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 강사</title>
    <style>
        /* 추가적인 페이지별 스타일은 여기에 작성 */
    </style>
</head>
<body data-user-role="instructor">
    <header th:replace="~{fragments/instructor :: header('시험 채점')}"></header>

    <th:block th:replace="~{fragments/instructor :: sidebar('eval-exam')}"/>
    <!-- 메인 콘텐츠 영역 -->
    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <!-- 시험 채점 -->
        <section class="main-content-inner">
            <!-- 필터 영역 -->
            <div class="filter-section">
                <div class="filter-row">
                    <div>
                        <label>과정명</label>
                        <select id="courseFilter">
                            <option value="">전체</option>
                        </select>
                    </div>
                    <div>
                        <label>상태</label>
                        <select id="statusFilter">
                            <option value="">전체</option>
                            <option value="waiting">평가예정</option>
                            <option value="completed">채점완료</option>
                            <option value="pending">채점예정</option>
                        </select>
                    </div>
                    <div>
                        <label>강사명</label>
                        <select id="instructorFilter">
                            <option value="">전체</option>
                        </select>
                    </div>
                    <div>
                        <label>등록일</label>
                        <select id="dateFilter">
                            <option value="">전체</option>
                            <option value="today">오늘</option>
                            <option value="this-week">이번 주</option>
                            <option value="this-month">이번 달</option>
                            <option value="custom">직접 선택</option>
                        </select>
                    </div>
                    <div id="customDateRange" style="display: none;">
                        <input type="date" id="startDate">
                        <span style="margin: 0 4px;">~</span>
                        <input type="date" id="endDate">
                    </div>
                    <div class="filter-item">
                        <label>검색</label>
                        <input type="text" id="searchInput" placeholder="과정명, 평가명, 강사명으로 검색">
                    </div>
                    <button class="btn btn-secondary" onclick="filterGrading()">
                        검색하기
                    </button>
                </div>
            </div>

            <!-- 채점 목록 -->
            <div class="grading-list">
                <div class="grading-header">
                    <div><input type="checkbox"></div>
                    <div>번호</div>
                    <div>과정명</div>
                    <div>시험명</div>
                    <div>강사명</div>
                    <div>과제/시험</div>
                    <div>제출 시작일</div>
                    <div>제출 마감일</div>
                    <div>제출 현황</div>
                    <div>상태</div>
                    <div></div>
                </div>

                <div id="gradingListItems">
                    <!-- 채점 항목들이 여기에 동적으로 추가됩니다 -->
                </div>
            </div>
            
            <!-- Bulk action buttons -->
            <div class="bulk-action-area" style="display:flex; gap:10px; margin:16px 0 0 0;">
                <button class="btn btn-gray btn-sm" id="bulkDeleteBtn" data-user-role="admin">선택 삭제</button>
                <button class="btn btn-gray btn-sm" id="bulkDisableBtn">선택한 시험 비활성화</button>
            </div>

            <!-- 페이지네이션 -->
            <div class="pagination">
                <div class="page-info">
                    <span id="currentPageInfo">1</span> / <span id="totalPagesInfo">1</span> 페이지
                </div>
                <div class="pagination-controls">
                    <button id="prevPage" onclick="changePage(-1)" disabled>이전</button>
                    <div id="pageNumbers"></div>
                    <button id="nextPage" onclick="changePage(1)">다음</button>
                </div>
            </div>
        </section>
    </main>  

    <!-- ===== 서버 데이터 주입 =====
         assignments.js 는 defer 라 문서 파싱이 끝난 뒤 실행된다. 그래서 인라인 스크립트가
         먼저 돌고, assignments.js 의 `window._serverGradingRows || [더미]` 가 이 값을 집는다.
         (기존 렌더 함수 initEvaluationList 는 손대지 않는다) -->
    <script th:inline="javascript">
        window._serverGradingRows = /*[[${rows}]]*/ [];

        document.addEventListener('DOMContentLoaded', function () {
            var rows = window._serverGradingRows || [];

            // 과정명/강사명 필터 항목을 실제 데이터에서 만든다 (하드코딩 옵션은 서버 데이터와 맞지 않는다).
            function fillOptions(id, values) {
                var el = document.getElementById(id);
                if (!el) return;
                el.innerHTML = '<option value="">전체</option>'
                    + values.map(function (v) { return '<option value="' + v + '">' + v + '</option>'; }).join('');
            }
            function distinct(key) {
                return rows.map(function (r) { return r[key]; })
                    .filter(function (v, i, a) { return v && v !== '-' && a.indexOf(v) === i; })
                    .sort();
            }
            fillOptions('courseFilter', distinct('courseName'));
            fillOptions('instructorFilter', distinct('instructor'));

            // 원본 화면의 onclick="filterGrading()" 은 정의된 적이 없어 클릭 시 에러가 났다.
            // assignments.js 가 #searchInput 의 input 이벤트로 이미 필터링하므로 그쪽으로 넘긴다.
            window.filterGrading = function () {
                var input = document.getElementById('searchInput');
                if (input) input.dispatchEvent(new Event('input'));
            };
        });
    </script>
</body>
</html>
