<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/assignments-grading.css">
    
    <script src="/static/js/assignments-grading.js" defer></script>
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>

</head>
<body>
    <!-- 상단 헤더 -->
    <header th:replace="~{fragments/admin :: header('평가 관리 > 과제 채점')}"></header>

    <!-- 왼쪽 사이드바 (+ 토글 버튼) -->
    <th:block th:replace="~{fragments/admin :: sidebar('eval-assignment')}"></th:block>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <!-- 훈련생 관리 -->
        <section class="main-content-inner">
            <!-- 상단 고정 요약 영역 -->
            <div class="grading-main-flex">
                <div style="flex:1;display:flex;flex-direction:column;gap:20px;min-width:420px;">
                    <div class="grading-summary-box">
                        <div class="grading-summary-title">과제 채점</div>
                        <div class="grading-summary-divider"></div>
                        <div class="grading-summary-main" th:text="${summary.courseName}">과정명 / 과목명</div>
                        <div class="grading-summary-main" th:text="${summary.assignmentTitle}">과제명</div>
                        <div class="grading-summary-sub" th:text="'제출 기간: ' + ${summary.period}">제출 기간</div>
                        <div class="grading-summary-sub" th:text="'평가 방식: ' + ${summary.gradingMethod} + ' / ' + ${summary.submissionTypeLabel}">평가 방식</div>
                        <div class="grading-summary-sub" th:text="'합격 기준: ' + ${summary.passCriteria} + ' (배점 ' + ${summary.score} + '점)'">합격 기준</div>
                        <div class="grading-summary-sub"
                             th:text="'수강 ' + ${summary.enrolledCount} + '명 · 제출 ' + ${summary.submittedCount} + '명 · 미제출 ' + (${summary.enrolledCount} - ${summary.submittedCount}) + '명 · 채점완료 ' + ${summary.gradedCount} + '명'">현황</div>
                    </div>

                    <!-- 미제출자 목록. 별도 화면이 아니라 여기서 확인한다.
                         수강생 명단은 A의 CourseQueryService.findUserIdsByCourseId 로만 가져온다. -->
                    <div class="grading-summary-box" th:if="${not #lists.isEmpty(notSubmitted)}">
                        <div class="grading-summary-title">미제출자 (<span th:text="${#lists.size(notSubmitted)}">0</span>명)</div>
                        <div class="grading-summary-divider"></div>
                        <div class="grading-summary-sub">
                            <span th:each="u, st : ${notSubmitted}"
                                  th:text="${u.name} + ' (' + ${u.loginId} + ')' + (${st.last} ? '' : ', ')">이름</span>
                        </div>
                    </div>
                    <div class="grading-student-list">
                        <table class="grading-student-table">
                            <thead>
                                <tr>
                                    <th>번호</th>
                                    <th>학생명</th>
                                    <th>제출상태</th>
                                    <th>채점상태</th>
                                    <th>점수</th>
                                    <th>재제출</th>
                                    <th>채점</th>
                                </tr>
                            </thead>
                            <tbody id="gradingStudentTbody">
                                <!-- JS로 동적 렌더링 -->
                            </tbody>
                             
                        </table>
                    </div>
                </div>
                <div class="grading-submission-box">
                    <!-- 학생신상 (JS로 동적 렌더링) -->
                    <table class="student-info-table" id="studentInfoTable"></table>

                    <div class="grading-feedback-box">
                        <div class="grading-feedback-title">피드백</div>
                        <div class="grading-feedback-label">학생 피드백 (학생에게 공개)</div>
                        <!-- 피드백 입력·조회는 "채점" 버튼이 여는 팝업(grading-modal)에서 한다.
                             여기 있던 하드코딩 예시 문구는 제거했다. -->
                        <div class="grading-feedback-textarea" id="feedbackPreview">채점 팝업에서 입력합니다.</div>
                        <div class="grading-feedback-label" style="margin-top:14px;">내부 메모 (관리자/강사용)</div>
                        <div class="grading-feedback-textarea" id="memoPreview">채점 팝업에서 입력합니다.</div>
                    </div>
                    <div class="grading-history-box">
                        <div class="grading-history-title">변경 이력</div>
                        <table class="grading-history-table" id="gradingHistoryTable">
                            <thead>
                                <tr>
                                    <th>날짜</th>
                                    <th>강사명</th>
                                    <th>점수</th>
                                    <th>변경결과</th>
                                    <th>사유</th>
                                </tr>
                            </thead>
                            <tbody id="gradingHistoryTbody">
                                <!-- JS로 동적 렌더링 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </section>
    </main>

    <!-- ===== 서버 연동 (개발자 B) =====
         assignments-grading.js 는 defer 라 파싱 이후에 실행된다.
         이 인라인 스크립트가 먼저 돌아 window._serverGradingStudents 를 채워둔다. -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        window._serverGradingStudents = /*[[${students}]]*/ [];
        /*]]>*/
    </script>
</body>
</html>
