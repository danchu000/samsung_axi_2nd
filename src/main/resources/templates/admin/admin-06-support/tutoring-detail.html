<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <!-- 관리자·강사 공용 화면이라 탭 제목도 역할에 맞춘다 (${isAdmin} 은 AdminSupportController.fillLayout 이 넣는다) -->
    <title th:text="${isAdmin} ? 'Samsung Academy LXP - 관리자' : 'Samsung Academy LXP - 강사'">Samsung Academy LXP - 관리자</title>
</head>
<style>
    /* ===== 우측 채팅(현재 페이지 구조에서 실제 사용) ===== */

    .tutor-right {
    background: #fff;
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    }

    /* 상단 바 */
    .chat-topbar {
    padding: 12px 14px;
    border-bottom: 1px solid var(--gray-200);
    background: var(--gray-50);
    }

    .chat-scope {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    }

    .chat-scope-text {
    color: var(--gray-600);
    }

    /* 채팅 로그 */
    .chat-window {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px;
    overflow-y: auto;
    background: #ffffff;
    }

    /* 메시지 */
    .msg-row {
    display: flex;
    flex-direction: column;
    max-width: 75%;
    }

    .msg-row.bot {
    align-self: flex-start;
    }

    .msg-row.user {
    align-self: flex-end;
    text-align: right;
    }

    .msg-row.bot .msg-bubble {
    background: var(--gray-200);
    color: var(--gray-800);
    padding: 12px 16px;
    border-radius: 14px 14px 14px 4px;
    font-size: 14px;
    line-height: 1.5;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .msg-row.user .msg-bubble {
    background: #d9f1ff;
    color: #1a1a1a;
    padding: 12px 16px;
    border-radius: 14px 14px 4px 14px;
    font-size: 14px;
    line-height: 1.5;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .msg-meta {
    font-size: 12px;
    color: var(--gray-500);
    margin-top: 6px;
    }

    /* 입력 영역 */
    .chat-inputbar {
    border-top: 1px solid var(--gray-200);
    padding: 12px;
    background: var(--gray-50);
    }

    .input-wrap {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    }

    .chat-input {
    flex: 1;
    resize: none;
    min-height: 40px;
    max-height: 140px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--gray-300);
    font-size: 13px;
    line-height: 1.4;
    }

    .chat-help {
    margin-top: 8px;
    font-size: 12px;
    color: var(--gray-500);
    }
</style>
<body data-user-role="admin" th:attr="data-user-role=${bodyRole}">
    <!-- 상단 헤더 / 왼쪽 사이드바 —
         관리자·강사 공용 화면이라 레이아웃 fragment 를 역할에 따라 갈아 끼운다(${layout}).
         강사에게 관리자 사이드바를 그리면 메뉴가 전부 /admin/** 이라 누르는 순간 403 이다. -->
    <header th:replace="~{${layout} :: header(${isAdmin} ? '학습 지원 &gt; 채팅 모니터링' : '튜터링/Q&amp;A &gt; 대화')}"></header>

    <th:block th:replace="~{${layout} :: sidebar(${sidebarActive})}"></th:block>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <section class="tutor-right" style="margin: 24px auto 0 auto;">
            <div class="chat-topbar">
              <div class="chat-scope" id="chatScope">
                <span class="badge status-badge" th:classappend="${detail.statusClass}" th:text="${detail.statusLabel}">진행중</span>
                <span class="chat-scope-text" th:text="|${detail.courseName} / ${detail.title}|">풀스택 웹 개발 (React &amp; Node.js) / 3차시</span>
                <a class="link" th:href="@{/admin/support/tutoring}">← 목록으로</a>
              </div>
            </div>

            <!-- 방 메타 + 운영 액션 -->
            <div class="chat-topbar" style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
              <span class="chat-help">훈련생 <b th:text="${detail.traineeName}">홍길동</b></span>
              <span class="chat-help">튜터 <b th:text="${detail.instructorName}">미배정</b></span>
              <span class="chat-help">최근 메시지 <b th:text="${detail.lastMessageAt}">-</b></span>

              <!-- 배정·종료는 운영 액션이라 관리자에게만 그린다.
                   서버측 AdminSupportController.assertAdmin() 이 2차 방어선(403). -->
              <form method="post" th:if="${isAdmin}" th:action="@{/admin/support/tutoring/{id}/assign(id=${detail.id})}" style="display:flex; gap:6px;">
                <select name="instructorId" class="form-input" style="height:32px;">
                  <option th:each="staff : ${staffOptions}" th:value="${staff.id}"
                          th:text="|${staff.name} (${staff.roleLabel})|">강사</option>
                </select>
                <button type="submit" class="btn btn-gray btn-sm">튜터 배정</button>
              </form>
              <form method="post" th:action="@{/admin/support/tutoring/{id}/close(id=${detail.id})}" th:if="${isAdmin and !detail.closed}">
                <button type="submit" class="btn btn-gray btn-sm">튜터링 종료</button>
              </form>
            </div>

            <!-- 대화 로그. content 는 DB 에 AES-256 암호문으로 저장되고 CryptoConverter 가 복호화한 평문이다. -->
            <div class="chat-window" id="chatWindow" aria-live="polite">
              <div class="msg-row" th:each="msg : ${detail.messages}"
                   th:classappend="${msg.mine} ? 'user' : 'bot'">
                <div class="msg-bubble" th:text="${msg.content}">
                  메시지 내용
                </div>
                <div class="msg-meta" th:text="|${msg.senderName} (${msg.senderRole}) · ${msg.sentTime}|">홍길동 학생 · 10:02</div>
              </div>
              <div class="chat-help" th:if="${#lists.isEmpty(detail.messages)}">아직 대화가 없습니다.</div>
            </div>

            <!--
              권한정의서(2) 18행: 채팅 메시지는 관리자 R / 강사 R / 훈련생 C·R.
              관리자는 열람만 하므로 입력창을 아예 렌더링하지 않는다.
              (서버측 TutoringService.sendMessage() 의 당사자 검사가 2차 방어선)
            -->
            <div class="chat-inputbar" th:if="${canSend and !detail.closed}">
              <form class="input-wrap" method="post" th:action="@{/admin/support/tutoring/{id}/messages(id=${detail.id})}">
                <textarea id="chatInput" class="chat-input" name="content" rows="1" required
                          placeholder="답변을 입력하세요"></textarea>
                <button type="submit" class="btn btn-primary" id="btnSend">전송</button>
              </form>
              <div class="chat-help" id="chatHelp">담당 튜터로 배정된 대화입니다.</div>
            </div>
            <div class="chat-inputbar" th:unless="${canSend and !detail.closed}">
              <div class="chat-help" id="chatHelp"
                   th:text="${detail.closed} ? '종료된 튜터링입니다. 열람만 가능합니다.'
                                             : '읽기 전용(모니터링) 화면입니다. 메시지 작성은 담당 튜터와 훈련생만 가능합니다.'">
                읽기 전용(모니터링) 화면입니다.
              </div>
            </div>
        </section>

    </main>
</body>
</html>
