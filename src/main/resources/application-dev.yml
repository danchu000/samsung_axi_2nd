# dev: 로컬 PostgreSQL 사용 시  --spring.profiles.active=dev 로 실행
# 사전 준비: CREATE DATABASE lms; (owner는 접속 계정으로)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lms
    driver-class-name: org.postgresql.Driver
    username: ${LMS_DB_USER:lms}
    password: ${LMS_DB_PASSWORD:lms1234}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # 아래 SQL 스크립트가 Hibernate 의 테이블 생성 이후에 실행되도록 미룬다
    defer-datasource-initialization: true

  # soft delete 와 공존하는 부분 유니크 인덱스 (PostgreSQL 전용).
  # local 프로필의 H2 는 부분 인덱스를 지원하지 않아 여기서만 건다 — 스크립트 상단 주석 참고.
  sql:
    init:
      mode: always
      schema-locations: classpath:db/postgresql/partial-unique-indexes.sql

# 빈 DB 첫 기동 시 초기 관리자(admin) 비밀번호 — 미지정이면 무작위 생성 후 로그에 1회 출력
# (AdminAccountInitializer, b-audit-reply.md §3-3(6))
lms:
  admin:
    init-password: ${LMS_ADMIN_INIT_PASSWORD:}
