<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나에게 맞는 과정 찾기 — {brand}</title><link rel="stylesheet" href="/v2/assets/tokens.css"><link rel="stylesheet" href="/v2/assets/base.css"><link rel="stylesheet" href="/v2/assets/components.css"></head><body class="class-site recommend-page"><main><section class="recommend-shell"><div class="container"><span>COURSE FINDER</span><h1>네 가지 질문으로<br><em>시작할 과정을 좁혀보세요.</em></h1><form id="course-recommender"><div class="recommend-questions"><fieldset><legend>01 · 관심 분야</legend><label><input type="radio" name="interest" value="data" required><span>데이터·예측</span></label><label><input type="radio" name="interest" value="robot"><span>로봇·자율주행</span></label><label><input type="radio" name="interest" value="factory"><span>제조·AIoT</span></label><label><input type="radio" name="interest" value="cloud"><span>웹·클라우드</span></label><label><input type="radio" name="interest" value="creative"><span>디자인·콘텐츠</span></label></fieldset><fieldset><legend>02 · 현재 수준</legend><label><input type="radio" name="level" value="beginner" required><span>처음 시작</span></label><label><input type="radio" name="level" value="basic"><span>기초 경험</span></label><label><input type="radio" name="level" value="project"><span>프로젝트 경험</span></label></fieldset><fieldset><legend>03 · 가능한 기간</legend><label><input type="radio" name="duration" value="short" required><span>3개월 이내</span></label><label><input type="radio" name="duration" value="long"><span>6개월 이상</span></label><label><input type="radio" name="duration" value="any"><span>상관없음</span></label></fieldset><fieldset><legend>04 · 현재 상태</legend><label><input type="radio" name="status" value="job" required><span>취업 준비</span></label><label><input type="radio" name="status" value="worker"><span>재직 중</span></label><label><input type="radio" name="status" value="student"><span>고등학생</span></label></fieldset></div><button class="btn btn--primary btn--lg" type="submit">추천 과정 확인하기</button></form><section class="recommend-result" id="recommend-result" hidden><span>RECOMMENDED COURSE</span><h2 id="recommend-title"></h2><p id="recommend-desc"></p><div><a class="btn btn--primary btn--lg" id="recommend-detail">상세 보기</a><a class="btn btn--outline btn--lg" id="recommend-counsel">이 과정 상담하기</a></div></section></div></section></main><script src="/v2/assets/brand.js"></script><script src="/v2/assets/shell.js"></script><script>Shell.site({service:'class'});document.getElementById('course-recommender').addEventListener('submit',function(e){e.preventDefault();var f=new FormData(this),interest=f.get('interest'),status=f.get('status'),key=status==='student'?(interest==='creative'?'design':interest==='robot'?'mobility':'system'):interest==='factory'?'factory':interest==='robot'?'robot':interest==='cloud'?'cloud':interest==='creative'?'uiux':'data';var map={data:['개인 맞춤형 예측 자동화','데이터 분석부터 예측 서비스 완성까지 경험합니다.'],factory:['스마트 환경공정 제어 자동화','AIoT와 공정 데이터를 연결하는 KDT 과정입니다.'],robot:['산업 자율주행·협동로봇','센서와 영상기법으로 현실에서 움직이는 AI를 구현합니다.'],cloud:['클라우드 기반 웹&앱 개발','Java 개발부터 Docker 배포와 보안까지 학습합니다.'],uiux:['AI 활용 UI/UX 실무 디자이너','생성형 AI를 활용해 실무 디자인 포트폴리오를 완성합니다.'],design:['디지털디자인&영상광고콘텐츠제작','일반고 위탁으로 디자인 실무와 자격증을 준비합니다.'],mobility:['AI 로봇 자율주행 스마트모빌리티','일반고 위탁으로 AI 로봇 응용SW를 개발합니다.'],system:['정보시스템 구축·운영 실무자','일반고 위탁으로 IT 운영 실무와 자격증을 준비합니다.']};var r=map[key];document.getElementById('recommend-title').textContent=r[0];document.getElementById('recommend-desc').textContent=r[1];document.getElementById('recommend-detail').href='/v2/site/class/course.html?course='+key;document.getElementById('recommend-counsel').href='/v2/site/campus/counsel.html?course='+key;document.getElementById('recommend-result').hidden=false;document.getElementById('recommend-result').scrollIntoView({behavior:'smooth'});});</script></body></html>
