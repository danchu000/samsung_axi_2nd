<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/static/font/pretendard.css">
    <link rel="stylesheet" href="/static/css/i-common-style.css">
    <link rel="stylesheet" href="/static/css/i-sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/result-grading.css">
    <link rel="stylesheet" href="/static/css/pagination.css">
    
    <script src="/static/js/pagination.js" defer></script>
    <script src="/static/js/result-grading.js" defer></script>
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 강사</title>
    <style>
        /* 추가적인 페이지별 스타일은 여기에 작성 */
    </style>
</head>
<body>
    <header th:replace="~{fragments/instructor :: header('시험 채점')}"></header>

    <th:block th:replace="~{fragments/instructor :: sidebar('eval-exam')}"/>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <!-- 훈련생 관리 -->
        <section class="main-content-inner">
            <!-- 상단 시험 정보 영역 -->
            <div id="examInfoCardContainer"></div>

            <!-- 필터 / 검색 영역 -->
            <div class="exam-filter-area">
                <input type="text" class="filter-input" id="filterNameInput" placeholder="이름 검색" style="width:140px;">
                <select class="filter-select" id="filterGradingStatus">
                    <option value="">채점상태 전체</option>
                    <option value="미채점">미채점</option>
                    <option value="채점중">채점중</option>
                    <option value="채점완료">채점완료</option>
                    <option value="확정">확정</option>
                </select>
                <select class="filter-select" id="filterScoreStatus">
                    <option value="">점수상태 전체</option>
                    <option value="합격">합격</option>
                    <option value="불합격">불합격</option>
                    <option value="미정">미정</option>
                </select>
                <select class="filter-select" id="filterSort">
                    <option value="time">응시시간순</option>
                    <option value="name">이름순</option>
                    <option value="score">점수순</option>
                </select>
                <button type="button" class="btn btn-secondary">검색하기</button>
            </div>
            <!-- 성적 목록 / 다운로드 -->
            <div class="exam-grade-actions" style="display:flex; gap:10px; justify-content:flex-end; margin:14px 0 6px 0;">
                <a class="btn btn-gray btn-sm" th:href="${summary.gradesUrl}" href="#">성적 목록 / 변경 이력</a>
                <a class="btn btn-secondary btn-sm" th:href="${summary.csvUrl}" href="#">성적 다운로드 (CSV)</a>
            </div>

            <!-- 학생 목록 (메인컨텐츠) -->
            <div class="student-table-wrap">
                <table class="student-table">
                    <thead>
                        <tr>
                            <th style="width: 30px;"><input type="checkbox" id="selectAllCheckbox" /></th>
                            <th style="width:48px;">No</th>
                            <th style="width:120px;">학생명</th>
                            <th style="width:120px;">학생ID</th>
                            <th style="width:120px;">응시시간</th>
                            <th style="width:80px;">점수</th>
                            <th style="width:100px;">상태</th>
                            <th style="width:90px;">채점</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <!-- JS로 동적 렌더링 -->
                    </tbody>
                </table>
            </div>

            <!-- 페이지네이션 -->
            <div class="pagination" style="margin-top: 25px;">
                <div class="page-info">
                    <span id="currentPageInfo">1</span> / <span id="totalPagesInfo">1</span> 페이지
                </div>
                <div class="pagination-controls">
                    <button id="prevPage" onclick="changePage(-1)" disabled>이전</button>
                    <div id="pageNumbers"></div>
                    <button id="nextPage" onclick="changePage(1)">다음</button>
                </div>
            </div>
        </section>
    </main> 

    <!-- ===== 서버 데이터 주입 =====
         result-grading.js 는 defer 라 이 인라인 스크립트가 먼저 돈다.
         `window._serverExamInfo || {더미}` / `window._serverStudentRows || [더미]` 가 이 값을 집는다. -->
    <script th:inline="javascript">
        window._serverExamInfo = /*[[${summary}]]*/ null;
        window._serverStudentRows = /*[[${rows}]]*/ [];
    </script>
</body>
</html>
