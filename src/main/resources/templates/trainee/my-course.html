<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/basic-form-trainee.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <title>Samsung Academy LXP - 나의 과정</title>
    <style>
        .mc-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
        .mc-section { margin-bottom: 36px; }
        .mc-section h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
        .mc-flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .mc-flash.ok { background: #d4edda; color: #155724; }
        .mc-flash.err { background: #f8d7da; color: #721c24; }
        .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .course-card { background:#fff; border:1px solid #e0e0e0; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .course-card h3 { font-size:17px; font-weight:700; margin-bottom:6px; }
        .course-meta { font-size:13px; color:#777; margin-bottom:12px; }
        .badge-status { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:600; }
        .badge-APPLIED { background:#fff3cd; color:#856404; }
        .badge-APPROVED { background:#d4edda; color:#155724; }
        .badge-REJECTED { background:#f8d7da; color:#721c24; }
        .badge-CANCELLED { background:#e2e3e5; color:#383d41; }
        .badge-COMPLETED { background:#cce5ff; color:#004085; }
        .empty-hint { color:#999; font-size:14px; padding:16px 0; }
        .card-actions { margin-top:12px; display:flex; gap:8px; align-items:center; }
        .inline-form { display:inline; }
    </style>
</head>
<body>
    <header th:replace="~{fragments/trainee :: header('my-course')}"></header>

    <main>
        <div class="mc-wrap">
            <div th:if="${enrollMessage}" class="mc-flash ok" th:text="${enrollMessage}"></div>
            <div th:if="${enrollError}" class="mc-flash err" th:text="${enrollError}"></div>

            <!-- 나의 수강 내역 -->
            <section class="mc-section">
                <h2>나의 과정 &gt; 수강 내역</h2>
                <p th:if="${enrollments.isEmpty()}" class="empty-hint">수강 내역이 없습니다. 아래 모집중 과정에서 신청해 보세요.</p>
                <div class="course-grid" th:unless="${enrollments.isEmpty()}">
                    <div class="course-card" th:each="en : ${enrollments}">
                        <span th:class="'badge-status badge-' + ${en.status}" th:text="${en.statusLabel}">상태</span>
                        <h3 th:text="${en.courseName}">과정명</h3>
                        <div class="course-meta">
                            <span th:if="${en.cohort}" th:text="${en.cohort} + ' · '"></span>
                            <span th:text="${en.category} ?: '미분류'">카테고리</span><br>
                            <span th:text="|${en.startDate} ~ ${en.endDate}|">기간</span>
                        </div>
                        <div class="card-actions">
                            <span style="font-size:13px; color:#555;" th:text="|진도율 ${#numbers.formatDecimal(en.progressRate,1,1)}%|">진도율</span>
                            <form class="inline-form"
                                  th:if="${en.status.name() == 'APPLIED' or en.status.name() == 'APPROVED'}"
                                  th:action="@{/trainee/enrollments/{eid}/cancel(eid=${en.enrollmentId})}" method="post"
                                  onsubmit="return confirm('수강신청을 취소하시겠습니까? 모집이 마감된 과정은 직접 재신청할 수 없습니다.');">
                                <button type="submit" class="btn btn-gray" style="padding:4px 12px;">신청 취소</button>
                            </form>
                        </div>
                        <p th:if="${en.status.name() == 'CANCELLED' or en.status.name() == 'REJECTED'}"
                           style="margin-top:8px; font-size:12px; color:#999;">
                            재신청은 과정이 모집중일 때만 가능합니다. 모집이 마감된 과정은 관리자에게 문의해 주세요.
                        </p>
                    </div>
                </div>
            </section>

            <!-- 신청 가능한 모집중 과정 -->
            <section class="mc-section">
                <h2>모집중 과정 신청</h2>
                <p th:if="${openCourses.isEmpty()}" class="empty-hint">현재 신청 가능한 모집중 과정이 없습니다.</p>
                <div class="course-grid" th:unless="${openCourses.isEmpty()}">
                    <div class="course-card" th:each="course : ${openCourses}">
                        <span class="badge-status badge-APPROVED">모집중</span>
                        <h3 th:text="${course.courseName}">과정명</h3>
                        <div class="course-meta">
                            <span th:if="${course.cohort}" th:text="${course.cohort} + ' · '"></span>
                            <span th:text="${course.category} ?: '미분류'">카테고리</span><br>
                            <span th:text="|${course.startDate} ~ ${course.endDate}|">기간</span> ·
                            <span th:text="|정원 ${course.capacity}명|">정원</span>
                        </div>
                        <div class="card-actions">
                            <form class="inline-form" th:action="@{/trainee/courses/{cid}/enroll(cid=${course.id})}" method="post">
                                <button type="submit" class="btn btn-primary" style="padding:6px 16px;">수강신청</button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer th:replace="~{fragments/trainee :: footer}"></footer>
</body>
</html>
