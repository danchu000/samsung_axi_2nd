<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/font/pretendard.css">
    <link rel="stylesheet" href="/static/css/i-common-style.css">
    <link rel="stylesheet" href="/static/css/i-sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/pagination.css">
    <link rel="stylesheet" href="/static/css/recordings.css">
    
    <script src="/static/js/recordings.js" defer></script>
    <script src="/static/js/pagination.js" defer></script>
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 강사</title>
    <style>
        /* 추가적인 페이지별 스타일은 여기에 작성 */
    </style>
    <meta name="_csrf" th:content="${_csrf.token}" content="">
    <meta name="_csrf_header" th:content="${_csrf.headerName}" content="">
</head>
<body data-user-role="instructor">
    <!-- 상단 헤더 / 사이드바 / 토글 버튼 — 공통 fragment 로 교체 -->
    <header th:replace="~{fragments/instructor :: header('평가 > 평가 모니터링 > 시험 녹화 조회')}"></header>
    <th:block th:replace="~{fragments/instructor :: sidebar('eval-monitoring')}"/>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <!-- 왼쪽 콘텐츠 영역 -->
        <section class="content-left">
            <p class="flash-message" th:if="${message}" th:text="${message}"
               style="margin:0 0 12px; padding:10px 14px; border-radius:6px; background:#E8F4FF; color:#0b4a7d; font-size:14px;"></p>

            <!-- 영상 컨트롤 박스 -->
            <div class="video-controls">
                <div class="video-controls-top">
                    <div class="control-option">
                        <label for="playbackSpeed">배속</label>
                        <select id="playbackSpeed">
                            <option value="0.5">0.5x</option>
                            <option value="0.75">0.75x</option>
                            <option value="1" selected>1.0x</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2.0x</option>
                        </select>
                    </div>
                    <div class="controls-main">
                        <button class="control-btn" id="prevBtn" title="이전">⏮</button>
                        <button class="control-btn play-btn" id="playPauseBtn" title="재생/일시정지">▶</button>
                        <button class="control-btn" id="nextBtn" title="다음">⏭</button>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="icon-btn" id="muteBtn" title="음소거 해제">🔇</button>
                    </div>
                </div>
                <div class="video-controls-bottom">
                    <div class="timeline-container">
                        <div class="timeline-info">
                            <span id="currentTime">00:00</span>
                            <span id="totalDuration">00:00</span>
                        </div>
                        <div class="timeline-bar" id="timelineBar">
                            <div class="timeline-progress" id="timelineProgress"></div>
                            <div class="timeline-handle" id="timelineHandle"></div>
                        </div>
                        <div class="timeline-time-markers" id="timelineMarkers"></div>
                    </div>
                </div>
            </div>

            <!--
              녹화 그리드. 타일은 서버가 내려준 ExamRecording 목록으로 recordings.js 가 만든다.
              재생 소스는 항상 인증된 스트리밍 엔드포인트(/.../recordings/{id}/stream)다 —
              저장소 경로(ExamRecording.filePath)는 화면으로 내려보내지 않는다.
            -->
            <div class="video-grid" id="videoGrid"></div>

            <!-- 전체화면 비디오 -->
            <div class="fullscreen-video" id="fullscreenVideo">
                <button class="close-btn" onclick="closeFullscreen()">×</button>
                <video id="fullscreenPlayer" controls>
                    <source src="" type="video/mp4">
                </video>
            </div>
        </section>

        <!-- 오른쪽 사이드바 -->
        <aside class="right-sidebar">
            <div class="sidebar-header">
                <h3 class="sidebar-title">녹화 상세</h3>
            </div>

            <div class="sidebar-content">
                <!-- 선택한 녹화 정보 (recordings.js 가 채운다) -->
                <div class="info-section">
                    <div class="info-row">
                        <div class="info-label">과정명</div>
                        <div class="info-value" id="detailCourse">-</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">시험명</div>
                        <div class="info-value" id="detailExam">-</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">응시자</div>
                        <div class="info-value" id="detailTrainee">-</div>
                    </div>
                </div>

                <div class="info-section">
                    <div class="info-row">
                        <div class="info-label">녹화 시각</div>
                        <div class="info-value" id="detailRecordedAt">-</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">총 녹화시간</div>
                        <div class="info-value" id="detailDuration">-</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">파일 크기 / 상태</div>
                        <div class="info-value" id="detailStatus">-</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">이상행위 (주의/심각)</div>
                        <div class="info-value" id="detailEvents">-</div>
                    </div>
                </div>

                <!-- 관리자 메모 = 경고 메시지 / 무효 사유로 그대로 전송된다 -->
                <div class="info-section">
                    <div class="info-label">메모 (경고 메시지 · 무효 사유로 전송)</div>
                    <textarea class="memo-textarea" id="adminMemo" placeholder="내용을 입력하세요..."></textarea>
                </div>

                <!-- 학생 선택 / 제재 처리 -->
                <div class="info-section">
                    <div class="info-label">학생 선택</div>
                    <select class="student-select" id="studentSelect">
                        <option value="">학생을 선택하세요</option>
                        <!--
                          th:each 는 th:if 보다 먼저 평가된다. 같은 태그에 두면 monitor 가 null 일 때도
                          monitor.rows 를 읽어 EL1007E 로 터진다 (실제로 밟았다). th:block 으로 감싼다.
                        -->
                        <th:block th:if="${monitor != null}">
                            <option th:each="a : ${monitor.rows}"
                                    th:value="${a.attemptId}"
                                    th:text="|${a.traineeName} (${a.statusLabel})|">응시자</option>
                        </th:block>
                        <th:block th:if="${monitor == null}">
                            <option th:each="r : ${rows}"
                                    th:value="${r.attemptId}"
                                    th:text="|${r.traineeName} · ${r.examName}|">응시자</option>
                        </th:block>
                    </select>
                    <div class="info-label">제재 처리</div>
                    <div class="sanction-options">
                        <div class="sanction-option">
                            <input type="radio" id="sanction-none" name="sanction" value="none" checked>
                            <label for="sanction-none">없음</label>
                        </div>
                        <div class="sanction-option">
                            <input type="radio" id="sanction-warning" name="sanction" value="warning">
                            <label for="sanction-warning">경고</label>
                        </div>
                        <div class="sanction-option">
                            <input type="radio" id="sanction-retest" name="sanction" value="retest">
                            <label for="sanction-retest">재시험</label>
                        </div>
                        <div class="sanction-option">
                            <input type="radio" id="sanction-invalid" name="sanction" value="invalid">
                            <label for="sanction-invalid">무효처리</label>
                        </div>
                    </div>
                    <button class="btn btn-primary save-btn" onclick="saveSanction()">저장</button>
                </div>
            </div>
        </aside>
    </main>

    <script th:inline="javascript">
        /*<![CDATA[*/
        // 서버 데이터 주입 — recordings.js 가 defer 라 이 스크립트가 먼저 실행된다.
        window._serverRecordingRows = /*[[${rows}]]*/ null;
        window._proctorAttemptPrefix = /*[[${attemptUrlPrefix}]]*/ '';
        window._proctorCanVoid = /*[[${canVoid}]]*/ false;
        window._proctorRedirect = /*[[${selfUrl}]]*/ '';
        /*]]>*/
    </script>
</body>
</html>
