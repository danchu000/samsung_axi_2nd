# dev: 로컬 MySQL 사용 시  --spring.profiles.active=dev 로 실행
# 사전 준비: CREATE DATABASE lms DEFAULT CHARACTER SET utf8mb4;
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lms?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${LMS_DB_USER:lms}
    password: ${LMS_DB_PASSWORD:lms1234}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
