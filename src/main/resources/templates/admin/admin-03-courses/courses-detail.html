<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 과정 상세</title>
    <style>
        .form-wrap { max-width: 900px; padding: 20px; }
        .form-section { background:#fff; margin-bottom:20px; border:1px solid var(--color-line-gray); padding:20px 24px 30px; border-radius:8px; display:flex; flex-direction:column; gap:16px; }
        .section-title { font-size:18px; font-weight:700; color:#333; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        .form-row-triple { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; }
        .form-label { display:block; font-size:13px; font-weight:600; color:#777; margin-bottom:4px; }
        .meta-value { font-size:14px; color:#333; }
        .status-badge { display:inline-block; padding:4px 12px; border-radius:12px; background:#e7f1ff; color:#1c6dd0; font-size:13px; font-weight:600; }
        .button-group { display:flex; justify-content:space-between; align-items:center; padding-bottom:30px; }
        .button-group-right { display:flex; gap:12px; }
        .inline-form { display:inline; }
        .status-select { padding:8px 12px; border:1px solid #ddd; border-radius:8px; }
        /* 과목/차시/강사/수강생 섹션 */
        .list-table { width:100%; border-collapse:collapse; }
        .list-table th, .list-table td { border-bottom:1px solid #eee; padding:10px 12px; font-size:14px; text-align:left; }
        .list-table th { color:#777; font-weight:600; background:#fafafa; }
        .subject-block { border:1px solid #eee; border-radius:8px; padding:12px 16px; }
        .subject-head { display:flex; justify-content:space-between; align-items:center; font-weight:700; }
        .session-row { font-size:13px; color:#555; padding:4px 0 4px 12px; }
        .mini-form { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-top:8px; }
        .mini-form input, .mini-form select { padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:13px; }
        .chip { display:inline-flex; align-items:center; gap:6px; background:#f1f5f9; border-radius:16px; padding:4px 10px; font-size:13px; margin:0 6px 6px 0; }
        .empty-hint { color:#999; font-size:13px; }
        .badge-status { padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; }
        .badge-APPLIED { background:#fff3cd; color:#856404; }
        .badge-APPROVED { background:#d4edda; color:#155724; }
        .badge-REJECTED { background:#f8d7da; color:#721c24; }
        .badge-CANCELLED { background:#e2e3e5; color:#383d41; }
        .badge-COMPLETED { background:#cce5ff; color:#004085; }
    </style>
</head>
<body data-user-role="admin">
    <header th:replace="~{fragments/admin :: header('과정/운영 관리 > 과정 관리 > 과정 상세')}"></header>
    <th:block th:replace="~{fragments/admin :: sidebar('courses')}"/>

    <main class="main-content">
        <div class="form-wrap">
            <div class="section-header"><h2 th:text="${course.courseName}">과정명</h2></div>

            <!-- 기본 정보 -->
            <div class="form-section">
                <h3 class="section-title">기본 정보</h3>
                <div class="form-row">
                    <div><label class="form-label">과정 코드</label><div class="meta-value" th:text="${course.courseCode}">-</div></div>
                    <div><label class="form-label">기수</label><div class="meta-value" th:text="${course.cohort} ?: '-'">-</div></div>
                </div>
                <div class="form-row">
                    <div><label class="form-label">카테고리</label><div class="meta-value" th:text="${course.category} ?: '-'">-</div></div>
                    <div><label class="form-label">운영 상태</label>
                        <div class="meta-value"><span class="status-badge" th:text="${course.status.label}">상태</span></div>
                    </div>
                </div>
                <div><label class="form-label">과정 설명</label><div class="meta-value" th:text="${course.description} ?: '-'">-</div></div>
            </div>

            <!-- 운영 기간 / 정원 -->
            <div class="form-section">
                <h3 class="section-title">운영 기간 / 정원</h3>
                <div class="form-row-triple">
                    <div><label class="form-label">시작일</label><div class="meta-value" th:text="${course.startDate}">-</div></div>
                    <div><label class="form-label">종료일</label><div class="meta-value" th:text="${course.endDate}">-</div></div>
                    <div><label class="form-label">정원</label><div class="meta-value" th:text="|${course.capacity}명|">-</div></div>
                </div>
                <div><label class="form-label">이수 기준 진도율</label><div class="meta-value" th:text="|${course.completionProgressRate}%|">-</div></div>
            </div>

            <!-- 상태 변경 -->
            <div class="form-section">
                <h3 class="section-title">상태 변경</h3>
                <form class="mini-form" th:action="@{/admin/courses/{id}/status(id=${course.id})}" method="post">
                    <select name="status" class="status-select">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"
                                th:selected="${s == course.status}">상태</option>
                    </select>
                    <button type="submit" class="btn btn-primary">상태 변경</button>
                </form>
            </div>

            <!-- 구성 과목 / 차시 -->
            <div class="form-section">
                <h3 class="section-title">구성 과목 / 차시</h3>
                <p th:if="${curriculumError}" class="field-error" th:text="${curriculumError}" style="color:#dc3545;"></p>

                <p th:if="${subjects.isEmpty()}" class="empty-hint">등록된 과목이 없습니다. 아래에서 과목을 추가하세요.</p>

                <div class="subject-block" th:each="subject : ${subjects}">
                    <div class="subject-head">
                        <span th:text="|${subject.orderNo}. ${subject.name}|">과목명</span>
                        <span>
                            <form class="inline-form" th:action="@{/admin/courses/{cid}/subjects/{sid}/delete(cid=${course.id},sid=${subject.id})}"
                                  method="post" onsubmit="return confirm('과목과 소속 차시를 모두 삭제하시겠습니까?');">
                                <button type="submit" class="btn btn-gray" style="padding:4px 10px;">과목 삭제</button>
                            </form>
                        </span>
                    </div>
                    <div th:if="${subject.description}" style="color:#777; font-size:13px; margin:4px 0 8px;" th:text="${subject.description}">설명</div>

                    <!-- 과목명 수정 -->
                    <form class="mini-form" th:action="@{/admin/courses/{cid}/subjects/{sid}(cid=${course.id},sid=${subject.id})}" method="post">
                        <input type="text" name="name" th:value="${subject.name}" placeholder="과목명" style="min-width:180px;">
                        <input type="text" name="description" th:value="${subject.description}" placeholder="설명(선택)" style="min-width:200px;">
                        <button type="submit" class="btn" style="padding:6px 12px;">과목 수정</button>
                    </form>

                    <!-- 차시 목록 -->
                    <div style="margin-top:8px;">
                        <p th:if="${subject.sessions.isEmpty()}" class="empty-hint" style="padding-left:12px;">차시가 없습니다.</p>
                        <div class="session-row" th:each="session : ${subject.sessions}">
                            <span th:text="|${session.seq}차시 · ${session.name}|">차시</span>
                            <span th:if="${session.lessonDate}" th:text="| · ${session.lessonDate}|"></span>
                            <span th:if="${session.learningMinutes}" th:text="| · ${session.learningMinutes}분|"></span>
                            <form class="inline-form" th:action="@{/admin/courses/{cid}/sessions/{sid}/delete(cid=${course.id},sid=${session.id})}" method="post">
                                <button type="submit" class="btn btn-gray" style="padding:2px 8px; font-size:12px;">삭제</button>
                            </form>
                        </div>
                    </div>

                    <!-- 차시 추가 -->
                    <form class="mini-form" th:action="@{/admin/courses/{cid}/subjects/{sid}/sessions(cid=${course.id},sid=${subject.id})}" method="post">
                        <input type="text" name="name" placeholder="차시명" required style="min-width:160px;">
                        <input type="date" name="lessonDate">
                        <input type="number" name="learningMinutes" placeholder="학습(분)" min="0" style="width:110px;">
                        <button type="submit" class="btn btn-primary" style="padding:6px 12px;">차시 추가</button>
                    </form>
                </div>

                <!-- 과목 추가 -->
                <form class="mini-form" th:action="@{/admin/courses/{cid}/subjects(cid=${course.id})}" method="post"
                      style="border-top:1px solid #eee; padding-top:12px;">
                    <input type="text" name="name" placeholder="새 과목명" required style="min-width:200px;">
                    <input type="text" name="description" placeholder="설명(선택)" style="min-width:220px;">
                    <button type="submit" class="btn btn-primary">+ 과목 추가</button>
                </form>
            </div>

            <!-- ▼ 담당 강사 · 수강신청 현황 섹션은 후속 슬라이스에서 삽입 -->

            <!-- 버튼 -->
            <div class="button-group">
                <form class="inline-form" th:action="@{/admin/courses/{id}/delete(id=${course.id})}" method="post"
                      onsubmit="return confirm('이 과정을 삭제하시겠습니까? (복구 불가)');">
                    <button type="submit" class="big-btn btn-gray">삭제하기</button>
                </form>
                <div class="button-group-right">
                    <button type="button" class="btn btn-back" onclick="location.href='/admin/courses'">목록으로</button>
                    <button type="button" class="btn btn-save" th:onclick="|location.href='/admin/courses/${course.id}/edit'|">수정하기</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
