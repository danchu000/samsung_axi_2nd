# 공통 설정 — 프로필별 설정은 application-local.yml(H2) / application-dev.yml(MySQL) 참고
spring:
  profiles:
    default: local

  # 프로젝트 루트 .env 를 있으면 읽는다(.gitignore 등록됨 — 커밋되지 않음).
  # 로컬에서 API 키를 셸 export 없이 파일로만 두기 위한 것. 없으면 그냥 건너뛴다(optional).
  # 도커 배포에서는 .env 가 컨테이너에 들어가지 않고 compose 가 환경변수로 주입한다.
  config:
    import: optional:file:./.env[.properties]

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 500MB   # VOD 업로드 대비
      max-request-size: 500MB

# 개인정보 컬럼 AES-256 암호화 키 (내역서 증빙 요건 — PLAN.md §2-1)
# 운영 환경에서는 반드시 환경변수 LMS_CRYPTO_SECRET 로 주입할 것. 키 변경 시 기존 데이터 복호화 불가.
lms:
  crypto:
    secret: ${LMS_CRYPTO_SECRET:samsung-lxp-local-dev-only-secret}

  # AI(Claude) 연동. 키는 여기 적지 말고 환경변수 또는 .env 로만 주입한다.
  # 키가 없으면 자동으로 꺼진 상태로 뜨고 AI 화면은 안내 문구를 보여준다(AiConfig).
  ai:
    enabled: ${LMS_AI_ENABLED:false}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${LMS_AI_MODEL:claude-sonnet-5}
    # 답변 길이 상한. 학습 도우미 답변은 5문장 이내로 지시하므로 이 이상 필요 없다.
    # 출력 토큰이 입력보다 비싸서, 여기를 줄이는 게 비용에 가장 크게 듣는다.
    max-output-tokens: ${LMS_AI_MAX_TOKENS:600}
    # 일반 호출(Q&A 등) 읽기 타임아웃. 앞단 Cloudflare 터널이 100초에서 먼저 끊으므로
    # 반드시 그보다 짧아야 한다 — 넘기면 원인 모를 "네트워크 오류" 로만 보인다.
    # 자료가 많은 과정에서 답변이 잘리면 .env 에서 올린다(재배포 불필요).
    timeout: ${LMS_AI_TIMEOUT:30s}
    # 비용 안전장치 — 무한 루프나 반복 호출로 요금이 터지는 것을 막는다.
    # 훈련생 7명 기준 하루 최대 140건이면 넉넉하다. 필요해지면 올리면 되지만,
    # 처음부터 크게 잡으면 사고가 났을 때 금액이 커진 뒤에야 알게 된다.
    # 커리큘럼·로드맵·진단 결과를 이 시간 동안 재사용한다.
    # 캐시가 없으면 화면 새로고침만으로 하루 한도를 소진해 Q&A 가 막힌다.
    # 웹 검색 호출은 모델이 공고 원문 페이지를 실제로 열어 읽어서 훨씬 오래 걸린다.
    # 짧게 잡으면 수집이 매번 끊기고, 없애면 스케줄러가 통째로 매달린다.
    search-timeout: ${LMS_AI_SEARCH_TIMEOUT:5m}
    advice-cache-hours: ${LMS_AI_ADVICE_CACHE_HOURS:12}
    daily-request-limit: ${LMS_AI_DAILY_LIMIT:200}
    daily-request-limit-per-user: ${LMS_AI_DAILY_LIMIT_PER_USER:20}

  # [기능 1] 채용공고 주 1회 수집 (사람인 오픈 API).
  # 액세스 키는 여기 적지 말고 환경변수 또는 .env 로만 주입한다.
  # 키가 없으면 수집기가 돌지 않고 화면은 "아직 수집 전"을 보여준다 — 앱은 정상 기동.
  job:
    enabled: ${LMS_JOB_ENABLED:false}
    # 수집처 2곳 — 키가 있는 곳만 실제로 부른다. 둘 다 넣으면 표본이 커진다.
    worknet-key: ${WORKNET_API_KEY:}
    saramin-key: ${SARAMIN_ACCESS_KEY:}
    # 3번째 수집처 — Claude 웹 검색. 별도 키가 없고 AI 기능의 ANTHROPIC_API_KEY 를 함께 쓴다.
    # 워크넷은 기술 키워드를 안 주고 사람인은 승인이 필요해, 그 사이를 메우는 용도다.
    # claude-groups 가 비어 있으면 켜도 아무 직무도 보지 않는다 — 비용이 직무 수에 비례하므로
    # "전체"를 기본값으로 두지 않는다. 처음에는 1개로 시험하고 늘리는 것을 권한다.
    claude-search: ${LMS_JOB_CLAUDE_SEARCH:false}
    claude-groups: ${LMS_JOB_CLAUDE_GROUPS:backend,frontend}
    claude-count: ${LMS_JOB_CLAUDE_COUNT:8}
    # 비우면 제한 없음. 좁히면 약관 부담이 줄지만 표본도 함께 줄어든다.
    claude-allowed-domains: ${LMS_JOB_CLAUDE_DOMAINS:}
    # 매주 월요일 03:00 — 훈련생이 거의 안 쓰는 시간대
    collect-cron: ${LMS_JOB_CRON:0 0 3 * * MON}
    count-per-group: 100
    # 이보다 오래된 공고는 집계에서 뺀다. 지난 시장을 근거로 삼으면 안 된다
    freshness-days: 90
    # 직무 그룹 — 개발 직군 중심.
    # 그룹 키(backend 등)는 화면 탭 id 이자 DB job_group 값이라, 바꾸면 이미 수집한
    # 공고와 연결이 끊긴다. 추가는 자유롭게, 이름 변경은 신중히.
    # 검색어가 너무 좁으면 표본(5건)이 안 모여 해당 탭이 통째로 안 나온다.
    groups:
      backend:
        name: 백엔드 개발자
        keywords: 백엔드 개발자 자바 스프링
      frontend:
        name: 프론트엔드 개발자
        keywords: 프론트엔드 개발자 리액트
      fullstack:
        name: 풀스택 개발자
        keywords: 풀스택 개발자
      mobile:
        name: 모바일 앱 개발자
        keywords: 안드로이드 iOS 앱개발
      devops:
        name: 데브옵스·인프라
        keywords: 데브옵스 인프라 쿠버네티스 AWS
      data:
        name: 데이터 엔지니어·분석가
        keywords: 데이터 엔지니어 분석 파이썬 SQL
      ai:
        name: AI·머신러닝 개발자
        keywords: 인공지능 머신러닝 딥러닝 개발자
      security:
        name: 정보보안 담당자
        keywords: 정보보안 보안관제 취약점진단
      qa:
        name: QA·테스트 엔지니어
        keywords: QA 테스트 엔지니어 품질관리
      game:
        name: 게임 개발자
        keywords: 게임 개발 유니티 언리얼

logging:
  level:
    org.hibernate.SQL: debug
