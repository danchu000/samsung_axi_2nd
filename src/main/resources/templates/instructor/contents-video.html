<!DOCTYPE html>
<!-- ADMIN 도 이 화면을 쓰므로(관리자 사이드바 '콘텐츠 관리' → /instructor/contents) 역할에 따라 레이아웃을 분기한다 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:with="isAdmin=${#authorization.expression('hasRole(''ADMIN'')')}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/i-common-style.css" th:href="${isAdmin} ? '/static/css/common-style.css' : '/static/css/i-common-style.css'">
    <link rel="stylesheet" href="/static/css/i-sidebar-style.css" th:href="${isAdmin} ? '/static/css/sidebar-style.css' : '/static/css/i-sidebar-style.css'">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/contents-video.css">
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 영상(VOD) 등록</title>
</head>
<body data-user-role="instructor" th:attr="data-user-role=${isAdmin} ? 'admin' : 'instructor'">
    <header th:replace="${isAdmin} ? ~{fragments/admin :: header(${mode == 'edit'} ? '콘텐츠 관리 > 영상(VOD) 수정' : '콘텐츠 관리 > 영상(VOD) 등록')} : ~{fragments/instructor :: header(${mode == 'edit'} ? '콘텐츠 관리 > 영상(VOD) 수정' : '콘텐츠 관리 > 영상(VOD) 등록')}"></header>
    <th:block th:replace="${isAdmin} ? ~{fragments/admin :: sidebar('contents')} : ~{fragments/instructor :: sidebar('contents')}"/>

    <main class="main-content">
        <div class="form-wrap">
            <form th:action="${mode == 'edit'} ? @{/instructor/contents/{id}(id=${contentId})} : @{/instructor/contents}"
                  method="post" enctype="multipart/form-data" th:object="${contentForm}">
                <input type="hidden" th:field="*{type}">

                <div class="form-section">
                    <h3 class="section-title" th:text="${mode == 'edit'} ? '영상 정보 수정' : '영상 등록'">영상 등록</h3>

                    <div th:if="${#fields.hasErrors('*')}" class="form-help" style="color:#d33; margin-bottom:12px;">
                        <p th:each="err : ${#fields.errors('*')}" th:text="${err}">오류</p>
                    </div>

                    <div class="form-row-triple">
                        <div class="form-group">
                            <label class="form-label required" for="courseId">과정</label>
                            <select class="form-select" id="courseId" th:field="*{courseId}" onchange="filterSessions()">
                                <option value="">과정 선택</option>
                                <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.courseName}">과정</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="sessionId">차시(선택)</label>
                            <select class="form-select" id="sessionId" th:field="*{sessionId}">
                                <option value="">과정 공용(차시 미지정)</option>
                                <option th:each="s : ${sessionOptions}" th:value="${s.id}" th:text="${s.label}"
                                        th:attr="data-course=${s.courseId}">차시</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="status">상태</label>
                            <select class="form-select" id="status" th:field="*{status}">
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.label}">상태</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label required" for="title">제목</label>
                        <input type="text" class="form-input" id="title" th:field="*{title}" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="description">영상 설명</label>
                        <textarea class="form-textarea" id="description" th:field="*{description}"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" th:classappend="${mode == 'edit'} ? '' : 'required'" for="videoFile">영상 업로드</label>
                            <input type="file" class="form-input" id="videoFile" name="file" accept="video/*"
                                   th:required="${mode != 'edit'}">
                            <div class="form-help">mp4 등 동영상 파일. 수정 시 비워두면 기존 파일이 유지됩니다.</div>
                            <div class="form-help" th:if="${mode == 'edit' and contentForm.title != null}">
                                현재 파일: <span th:text="${contentForm.title}">제목</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="durationSeconds">영상 길이(초)</label>
                            <input type="number" min="0" class="form-input" id="durationSeconds" th:field="*{durationSeconds}"
                                   placeholder="예: 2700 (=45분)">
                            <div class="form-help">진도율 계산 기준. 미입력 시 재생 중 자동 감지 값을 사용합니다.</div>
                        </div>
                    </div>

                    <div class="form-group" style="width:100%;">
                        <label class="form-label">영상 미리보기</label>
                        <div id="videoPreviewArea" style="width:100%;background:#f8f9fa; border-radius:8px; padding:16px; text-align:center; min-height:180px;">
                            <span style="color:#aaa;">업로드할 영상을 선택하면 미리보기가 표시됩니다.</span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="orderNo">정렬 순서</label>
                            <input type="number" min="1" class="form-input" id="orderNo" th:field="*{orderNo}" placeholder="1">
                        </div>
                        <div class="form-group">
                            <label class="form-label">이수 필수 여부</label>
                            <label style="display:inline-flex; align-items:center; gap:6px; margin-top:8px;">
                                <input type="checkbox" th:field="*{required}"> 이수 필수 콘텐츠
                            </label>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <a class="btn btn-back" th:href="@{/instructor/contents}">취소</a>
                    <button type="submit" class="btn btn-save" th:text="${mode == 'edit'} ? '수정하기' : '등록하기'">등록하기</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        // 선택한 과정의 차시만 노출
        function filterSessions() {
            var courseId = document.getElementById('courseId').value;
            var sessionSelect = document.getElementById('sessionId');
            Array.prototype.forEach.call(sessionSelect.options, function (opt) {
                if (!opt.value) return; // '과정 공용' 옵션은 항상 노출
                var match = opt.getAttribute('data-course') === courseId;
                opt.hidden = !match;
                if (!match && opt.selected) sessionSelect.value = '';
            });
        }
        // 업로드 파일 미리보기
        var fileInput = document.getElementById('videoFile');
        if (fileInput) {
            fileInput.addEventListener('change', function () {
                var area = document.getElementById('videoPreviewArea');
                var file = this.files[0];
                if (file) {
                    area.innerHTML = '<video src="' + URL.createObjectURL(file) + '" controls style="width:100%; aspect-ratio:16/9; border-radius:8px; background:#000;"></video>';
                } else {
                    area.innerHTML = '<span style="color:#aaa;">업로드할 영상을 선택하면 미리보기가 표시됩니다.</span>';
                }
            });
        }
        document.addEventListener('DOMContentLoaded', filterSessions);
    </script>
</body>
</html>
