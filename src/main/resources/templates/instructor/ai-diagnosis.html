<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!--
  강사 화면 공통 CSS. 예전에 존재하지 않는 basic-form.css 를 적었다가 레이아웃이
  통째로 빠져 화면이 깨졌다 — 강사 화면은 i-common-style + i-sidebar-style 조합이다.
-->
<link rel="stylesheet" href="/static/font/pretendard.css" />
<link rel="stylesheet" href="/static/css/i-common-style.css" />
<link rel="stylesheet" href="/static/css/i-sidebar-style.css" />
<link rel="stylesheet" href="/static/css/btn-style.css" />
<link rel="stylesheet" href="/static/css/ai-common.css" />
<script src="/static/js/sidebar-function.js" defer></script>
<script src="/static/js/instructor/ai-diagnosis.js" defer></script>

<title>Samsung Academy LXP</title>
</head>
<!-- ********************************************************************************************************* -->
<body>
    <header th:replace="~{fragments/instructor :: header('AI 학습진단')}"></header>
    <th:block th:replace="~{fragments/instructor :: sidebar('ai-diagnosis')}"></th:block>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <section class="main-content-inner">

            <p class="ai-page-desc">
                훈련생이 <b>AI 학습 도우미에 남긴 질문</b>과 <b>평가·과제 결과</b>를 분석해
                취약 영역을 정리하고, 보완에 도움이 될 과제를 추천해 드립니다.
            </p>

            <!-- AI 제안이지 확정이 아니라는 점을 명시 -->
            <div class="ai-disclaimer">
                <span>ⓘ</span>
                <span>
                    AI가 제안한 참고 자료입니다. <b>실제 과제 배부는 강사가 확인 후 결정</b>합니다.
                    <b class="js-analyzed-at">분석 기준: 2026-07-29</b>
                </span>
            </div>

            <!-- ===== 필터 ===== -->
            <div class="ai-card" style="padding:14px 18px;">
                <div style="display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap;">
                    <div>
                        <label for="courseFilter" style="display:block; font-size:13px; color:#374151; margin-bottom:5px;">담당 과정</label>
                        <select id="courseFilter" style="min-width:280px; padding:7px 10px; border:1px solid #d1d5db; border-radius:6px;">
                            <option value="">전체</option>
                            <option value="클라우드 기반 풀스택 개발자 양성과정">클라우드 기반 풀스택 개발자 양성과정</option>
                            <option value="데이터 분석 실무 과정">데이터 분석 실무 과정</option>
                        </select>
                    </div>
                    <div>
                        <label for="levelFilter" style="display:block; font-size:13px; color:#374151; margin-bottom:5px;">보완 시급도</label>
                        <select id="levelFilter" style="min-width:130px; padding:7px 10px; border:1px solid #d1d5db; border-radius:6px;">
                            <option value="">전체</option>
                            <option value="high">높음</option>
                            <option value="mid">보통</option>
                            <option value="low">낮음</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-secondary" id="btnFilter">조회</button>
                </div>
            </div>

            <!-- ===== 요약 ===== -->
            <div class="ai-grid ai-grid-3" id="summaryGrid"></div>

            <!-- ===== 자주 나온 질문 주제 ===== -->
            <div class="ai-card">
                <div class="ai-card-head">
                    <div>
                        <h3 class="ai-card-title">AI에게 많이 물어본 주제</h3>
                        <p class="ai-card-sub">질문이 몰린 주제는 수업에서 보완이 필요할 수 있습니다.</p>
                    </div>
                    <span class="ai-badge">AI 분석</span>
                </div>
                <div id="topicMeters"></div>
            </div>

            <!-- ===== 훈련생별 진단 ===== -->
            <div class="ai-card">
                <div class="ai-card-head">
                    <div>
                        <h3 class="ai-card-title">보완이 필요한 훈련생</h3>
                        <p class="ai-card-sub">체크한 훈련생에게 추천 과제를 한 번에 배부할 수 있습니다.</p>
                    </div>
                    <button type="button" class="btn btn-primary" id="btnAssign">선택한 훈련생에게 과제 배부</button>
                </div>

                <div style="overflow-x:auto;">
                    <table class="ai-table">
                        <thead>
                            <tr>
                                <th style="width:44px;"><input type="checkbox" id="checkAll" aria-label="전체 선택"></th>
                                <th style="width:100px;">훈련생</th>
                                <th style="width:96px;">시급도</th>
                                <th style="width:190px;">취약 영역</th>
                                <th>진단 근거</th>
                                <th style="width:240px;">추천 과제</th>
                            </tr>
                        </thead>
                        <tbody id="diagBody"></tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>
</body>
</html>
