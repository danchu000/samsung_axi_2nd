<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <title>오류 안내 - Samsung Academy LXP</title>
    <style>
        .err-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .err-card { max-width: 520px; width: 100%; background: #fff; border: 1px solid var(--gray-200);
                    border-radius: 12px; padding: 40px 36px; text-align: center; }
        .err-code { font-size: 40px; font-weight: 800; color: var(--gray-300); letter-spacing: -1px; margin-bottom: 8px; }
        .err-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; color: #111827; }
        .err-guide { font-size: 15px; color: #4B5563; line-height: 1.7; margin-bottom: 28px; }
        .err-actions { display: flex; gap: 10px; justify-content: center; }
    </style>
</head>
<body>
<div class="err-wrap">
    <div class="err-card">
        <div class="err-code" th:text="${status}">404</div>
        <h1 class="err-title" th:text="${title}">페이지를 찾을 수 없습니다</h1>
        <p class="err-guide" th:text="${guide}">주소가 바뀌었거나 삭제된 화면입니다.</p>

        <div class="err-actions">
            <button type="button" class="btn btn-gray" onclick="history.back()">이전으로</button>
            <a class="btn btn-primary" th:href="${homeUrl}" href="/login"
               th:text="${loggedIn} ? '내 홈으로' : '로그인 화면으로'">내 홈으로</a>
        </div>
    </div>
</div>
</body>
</html>
