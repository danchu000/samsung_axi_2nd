<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Q&A</title></head>
<body><main><h1>Q&A</h1><p th:if="${message}" th:text="${message}"></p>
<form method="post" th:action="@{/trainee/qna}" th:object="${form}"><label>제목 <input th:field="*{title}"></label><label>내용 <textarea th:field="*{content}"></textarea></label><label>분류 <select th:field="*{category}"><option value="LECTURE">수업</option><option value="PROGRESS">진도</option><option value="ETC">기타</option></select></label><label>공개 범위 <select th:field="*{visibility}"><option value="course">과정 공유</option><option value="private">나만 보기</option></select></label><button>질문 등록</button></form>
<table><thead><tr><th>상태</th><th>제목</th><th>분류</th><th>등록일</th><th>조회</th></tr></thead><tbody><tr th:each="row : ${rows}"><td th:text="${row.statusLabel}"></td><td><a th:href="@{/trainee/qna/{id}(id=${row.id})}" th:text="${row.title}"></a></td><td th:text="${row.categoryLabel}"></td><td th:text="${row.createdAt}"></td><td th:text="${row.viewCount}"></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="5">등록한 질문이 없습니다.</td></tr></tbody></table><p><a th:href="@{/trainee/qna/tutoring}">튜터링으로 이동</a></p></main></body></html>
