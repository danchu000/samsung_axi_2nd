<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/pagination.css">
    
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <script src="/static/js/pagination.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>
</head>
<style>
/* 폼 섹션 */
    .form-wrap {
        max-width: 50%;
        flex:1;
        padding: 20px;
        overflow-y: auto;
    }

    .form-section {
        background: white;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--color-line-gray);;
        border: 1px solid var(--color-line-gray);
        padding: 20px 24px 30px 24px;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .section-title {
        font-size: 18px;
        font-weight: 700;
        color: #333;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* 폼 그룹 */
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-row-triple {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 20px;
    }

    .form-label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #333;
        margin-bottom: 4px;
    }

    .form-label.required::after {
        content: "*";
        color: #dc3545;
        margin-left: 4px;
    }

    .form-textarea {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.2s;
        background: white;
        font-family: inherit;
        min-height: 150px;
        resize: none;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(28, 109, 208, 0.1);
    }

    .form-input:disabled,
    .form-select:disabled {
        background: #f5f5f5;
        color: #999;
        cursor: not-allowed;
    }



    .radio-item,
    .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-size: 14px;
        color: #555;
    }

    .radio-item input[type="radio"],
    .checkbox-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: var(--color-primary);
    }

    /* 입력 도움말 */
    .form-help {
        font-size: 12px;
        color: #999;
        margin-top: 6px;
    }

    /* 입력 단위 표시 */
    .input-with-unit {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .input-with-unit .form-input {
        flex: 1;
    }

    .input-unit {
        font-size: 14px;
        color: #666;
        font-weight: 600;
        min-width: 40px;
    }

    /* 날짜 범위 입력 */
    .date-range {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .date-range .form-input {
        flex: 1;
    }

    .date-separator {
        color: #999;
        font-weight: 600;
    }

    /* 메타 정보 (읽기 전용) */
    .meta-info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 16px;
        background: #f8f9fa;
        padding: 20px;
        border-radius: 8px;
    }

    .meta-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .meta-label {
        font-size: 12px;
        color: #666;
        font-weight: 600;
    }

    .meta-value {
        font-size: 14px;
        color: #333;
    }

    /* 버튼 그룹 */
    .button-group {
        display: flex;
        justify-content: center;
        gap: 16px;
        padding-bottom: 30px;
    }

    /* 변경 이력 테이블 */
    .history-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
    }

    .history-table th,
    .history-table td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid var(--color-line-gray);;
        font-size: 13px;
    }

    .history-table th {
        background: #f8f9fa;
        font-weight: 600;
        color: #333;
    }

    .history-table td {
        color: #666;
    }

    .history-empty {
        text-align: center;
        padding: 40px;
        color: #999;
        font-size: 14px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
        .form-row,
        .form-row-triple {
            grid-template-columns: 1fr;
        }

        .button-group {
            flex-direction: column;
        }

        .btn-large {
            width: 100%;
        }
    }
    </style>
<body>
    <!-- 상단 헤더 -->
    <header th:replace="~{fragments/admin :: header('콘텐츠 관리 > 문제 등록')}"></header>

    <!-- 왼쪽 사이드바 -->
    <th:block th:replace="~{fragments/admin :: sidebar('contents')}"></th:block>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <div class="form-wrap">
            <form id="questionForm" method="post"
                  th:action="${form.id == null} ? @{/admin/evaluation/questions}
                                                : @{/admin/evaluation/questions/{id}(id=${form.id})}"
                  th:object="${form}">
                <div class="form-section">
                    <h3 class="section-title">문제 정보</h3>
                    <div class="form-row-triple">
                        <div class="form-group">
                            <label class="form-label required" for="question_id">문제 ID</label>
                            <input type="text" class="form-input" id="question_id" name="questionCode" th:value="*{questionCode}" placeholder="비우면 자동 채번 (Q-0001)">
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="question_type">문제 유형</label>
                            <select class="form-select" id="question_type" name="questionType" required>
                                <option value="객관식" th:selected="*{questionType == '객관식'}">객관식</option>
                                <option value="주관식" th:selected="*{questionType == '주관식'}">주관식</option>
                                <option value="코딩" th:selected="*{questionType == '코딩'}">코딩</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="status">상태</label>
                            <select class="form-select" id="status" name="status">
                                <option value="사용중" th:selected="*{status == '사용중'}">사용중</option>
                                <option value="미사용" th:selected="*{status == '미사용'}">미사용</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label required" for="question_text">문제 내용</label>
                        <textarea class="form-textarea" id="question_text" name="questionText" required th:text="*{questionText}"></textarea>
                    </div>
                    <div class="form-row" id="choices-row">
                        <div class="form-group">
                            <label class="form-label" for="choice_1">선택지 1</label>
                            <input type="text" class="form-input" id="choice_1" name="choice1" th:value="*{choice1}">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="choice_2">선택지 2</label>
                            <input type="text" class="form-input" id="choice_2" name="choice2" th:value="*{choice2}">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="choice_3">선택지 3</label>
                            <input type="text" class="form-input" id="choice_3" name="choice3" th:value="*{choice3}">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="choice_4">선택지 4</label>
                            <input type="text" class="form-input" id="choice_4" name="choice4" th:value="*{choice4}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label required" for="correct_answer">정답</label>
                        <input type="text" class="form-input" id="correct_answer" name="correctAnswer" required th:value="*{correctAnswer}">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="explanation">해설</label>
                        <textarea class="form-textarea" id="explanation" name="explanation" th:text="*{explanation}"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="difficulty">난이도</label>
                            <select class="form-select" id="difficulty" name="difficulty">
                                <option value="">선택</option>
                                <option value="easy" th:selected="*{difficulty == 'easy'}">easy</option>
                                <option value="medium" th:selected="*{difficulty == 'medium'}">medium</option>
                                <option value="hard" th:selected="*{difficulty == 'hard'}">hard</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="score">배점</label>
                            <input type="number" class="form-input" id="score" name="score" min="0" th:value="*{score}">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="category">카테고리</label>
                            <input type="text" class="form-input" id="category" name="category" th:value="*{category}">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="time_limit">제한 시간(초)</label>
                            <input type="number" class="form-input" id="time_limit" name="timeLimit" min="0" th:value="*{timeLimit}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="case_sensitive">대소문자 구분</label>
                            <select class="form-select" id="case_sensitive" name="caseSensitive">
                                <option value="false" th:selected="*{!caseSensitive}">구분 안함</option>
                                <option value="true" th:selected="*{caseSensitive}">구분함</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="allow_partial">부분점수 허용</label>
                            <select class="form-select" id="allow_partial" name="allowPartial">
                                <option value="false" th:selected="*{!allowPartial}">허용 안함</option>
                                <option value="true" th:selected="*{allowPartial}">허용함</option>
                            </select>
                        </div>
                        
                    </div>
                </div>
                <ul th:if="${#fields.hasErrors('*')}" class="form-errors"
                    style="color:#D32F2F;margin:0 0 12px 4px;padding-left:18px;">
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
                <div class="button-group">
                    <button type="button" class="btn btn-back" onclick="window.history.back()">취소</button>
                    <button type="submit" class="btn btn-save" th:text="${form.id == null} ? '문제 등록' : '문제 수정'">문제 등록</button>
                </div>
            </form>
        </div>
    </main>

    <script>
    // 서버 연동 완료 — 폼은 컨트롤러(POST /admin/evaluation/questions)로 그대로 제출한다.
    // 문제유형에 따라 선택지 표시/숨김
    document.getElementById('question_type').addEventListener('change', function() {
        var type = this.value;
        var choicesRow = document.getElementById('choices-row');
        if (type === '객관식') {
            choicesRow.style.display = '';
        } else {
            choicesRow.style.display = 'none';
        }
    });
    // 최초 로드 시 반영
    document.addEventListener('DOMContentLoaded', function() {
        var type = document.getElementById('question_type').value;
        var choicesRow = document.getElementById('choices-row');
        if (type === '객관식') {
            choicesRow.style.display = '';
        } else {
            choicesRow.style.display = 'none';
        }
    });
    </script>
</body>
</html>
