<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Q&A 상세</title></head><body><main><a th:href="@{/trainee/qna}">목록</a><h1 th:text="${detail.title}"></h1><p th:text="${detail.createdAt}"></p><pre th:text="${detail.content}"></pre><section><h2>답변</h2><article th:each="answer : ${detail.answers}"><strong th:text="${answer.responderName}"></strong><time th:text="${answer.createdAt}"></time><pre th:text="${answer.content}"></pre></article><p th:if="${#lists.isEmpty(detail.answers)}">등록된 답변이 없습니다.</p></section></main></body></html>
