<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/i-common-style.css">
    <link rel="stylesheet" href="/static/css/i-sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/courses.css">

    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 담당 과정</title>
    <style>
        .list-table { width:100%; border-collapse:collapse; background:#fff; }
        .list-table th, .list-table td { border-bottom:1px solid var(--gray-200); padding:12px 14px; font-size:14px; text-align:left; }
        .list-table th { color:var(--gray-500); font-weight:600; background:var(--gray-50); }
        .list-table tr.clickable:hover { background:#f6f9ff; cursor:pointer; }
        .status-badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:600; background:#e7f1ff; color:#1c6dd0; }
        .empty-hint { color:var(--gray-500); font-size:14px; padding:24px; text-align:center; }
        .section-header { display:flex; justify-content:space-between; align-items:center; }
    </style>
</head>
<body>
    <header th:replace="~{fragments/instructor :: header('담당 과정 &gt; 과정 관리')}"></header>
    <th:block th:replace="~{fragments/instructor :: sidebar('courses')}"/>

    <main class="main-content">
        <section class="main-content-inner">
            <div th:replace="${sampleData} ? ~{fragments/instructor :: sampleNotice} : ~{}"></div>

            <div class="section-header">
                <h2>담당 과정</h2>
                <span class="empty-hint" style="padding:0;">총 <strong th:text="${#lists.size(courses)}">0</strong>개</span>
            </div>

            <div class="table-section" style="margin-top:16px;">
                <table class="list-table">
                    <thead>
                        <tr>
                            <th>과정 코드</th>
                            <th>과정명</th>
                            <th>기수</th>
                            <th>기간</th>
                            <th>과목 수</th>
                            <th>수강생</th>
                            <th>상태</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="clickable" th:each="c : ${courses}"
                            th:onclick="|location.href='/instructor/courses/${c.id}'|">
                            <td th:text="${c.courseCode}">CODE</td>
                            <td th:text="${c.courseName}">과정명</td>
                            <td th:text="${c.cohort} ?: '-'">1기</td>
                            <td th:text="|${c.startDate} ~ ${c.endDate}|">기간</td>
                            <td th:text="${c.subjectCount}">0</td>
                            <td th:text="|${c.traineeCount} / ${c.capacity}|">0 / 0</td>
                            <td><span class="status-badge" th:text="${c.statusLabel}">상태</span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(courses)}">
                            <td colspan="7" class="empty-hint">담당 중인 과정이 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
