<!-- 알림 상세/관리 모달 (첨부파일 제거 버전)
     - 리스트 TH 기반: 상태 / 번호 / 제목 / 내용 / 날짜 / 중요도 / 작성자
     - open/close 동작 포함
     - ✅ 버튼 type="button" 처리
-->


<!-- ✅ 알림 모달 -->
<div id="alarmModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="alarmModalTitle" data-user-role="instructor"
     xmlns:th="http://www.thymeleaf.org">
  <!-- window.open 으로 단독 페이지로 뜨는 화면이라 hidden 속성을 제거했다(원본은 모달 전제라 항상 안 보였다). -->
  <form class="modal" role="document" method="post"
        th:action="${row == null} ? @{/admin/notice/alarms} : @{/admin/notice/alarms/{id}(id=${form.id})}">

    <!-- Header -->
    <header class="modal-header">
      <div class="header-left">
        <h2 id="alarmModalTitle" class="modal-title" th:text="${row == null} ? '알림 등록' : '알림 상세'">알림 상세</h2>
      </div>
    </header>

    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <!-- Meta -->
    <section class="modal-meta">
      <div class="meta-row">
        <div class="meta-item">
          <span class="badge badge-unread" id="alarmStatusBadge" th:text="${row?.status} ?: '미확인'">미확인</span>
          <span class="pill" id="alarmPriorityPill" th:text="${row != null} ? '중요도: ' + ${row.importance} : '중요도: 높음'">중요도: 높음</span>
          <span class="pill" th:if="${row != null}" th:text="'수신 ' + ${row.recipientCount} + '명 / 읽음 ' + ${row.readCount} + '명'">수신 0명</span>
        </div>
        <div class="meta-item right">
          <span class="kv"><span class="k">번호</span><span class="v" id="alarmNo" th:text="${row?.id} ?: '-'">00124</span></span>
          <span class="kv"><span class="k">작성자</span><span class="v" id="alarmAuthor" th:text="${row?.author} ?: '-'">관리자A</span>
          <span class="kv"><span class="k">날짜</span><span class="v" id="alarmDate" th:text="${row?.date} ?: '-'">2026-01-24 14:10</span></span>
        </div>
      </div>
    </section>

    <!-- Body -->
    <main class="modal-body">
      <div class="field">
        <label class="label" for="alarmTitle">제목</label>
        <input id="alarmTitle" name="title" class="input" type="text" th:value="${form.title}" value="" />
      </div>

      <div class="field">
        <label class="label" for="alarmContent">내용</label>
        <textarea id="alarmContent" name="content" class="textarea" rows="8" th:text="${form.content}"></textarea>
        <p class="hint">※ 긴 내용은 스크롤되며 줄바꿈이 유지됩니다.</p>
      </div>
    </main>

    <!-- Footer (고정 액션바) -->
    <footer class="modal-footer">
      <div class="footer-left">

        <div class="select-row">
          <!-- 원본의 "카테고리"(안내/권장/주의)는 대응 필드가 없다. 실제로 필요한 발송 대상으로 바꿨다. -->
          <label class="label-inline" for="targetTypeSelect">대상</label>
          <select id="targetTypeSelect" name="targetType" class="select">
            <option value="ALL" th:selected="${form.targetType == 'ALL'}">전체</option>
            <option value="COURSE" th:selected="${form.targetType == 'COURSE'}">과정</option>
            <option value="USER" th:selected="${form.targetType == 'USER'}">개인</option>
          </select>
        </div>

        <div class="select-row">
          <label class="label-inline" for="targetRefIdInput">대상 ID</label>
          <input id="targetRefIdInput" name="targetRefId" class="input" type="number" style="width:110px;"
                 th:value="${form.targetRefId}" placeholder="과정/사용자 id">
        </div>

        <div class="select-row">
          <label class="label-inline" for="sendAtInput">발송 시각</label>
          <input id="sendAtInput" name="sendAt" class="input" type="datetime-local" style="width:210px;"
                 th:value="${form.sendAt != null} ? ${#temporals.format(form.sendAt, 'yyyy-MM-dd''T''HH:mm')} : ''">
        </div>

        <div class="select-row">
          <label class="label-inline" for="statusSelect">상태 변경</label>
          <select id="statusSelect" name="status" class="select">
            <option value="unread" th:selected="${form.status == 'unread'}">미확인</option>
            <option value="read" th:selected="${form.status == 'read'}">확인</option>
            <option value="scheduled" th:selected="${form.status == 'scheduled'}">예약</option>
            <option value="sent" th:selected="${form.status == 'sent'}">발송완료</option>
            <option value="hidden" th:selected="${form.status == 'canceled'}">숨김</option>
          </select>
        </div>

        <div class="select-row">
          <label class="label-inline" for="prioritySelect">중요도</label>
          <select id="prioritySelect" name="priority" class="select">
            <option value="urgent" th:selected="${form.priority == 'urgent'}">긴급</option>
            <option value="high" th:selected="${form.priority == 'high'}">높음</option>
            <option value="normal" th:selected="${form.priority == 'normal'}">보통</option>
            <option value="low" th:selected="${form.priority == 'low'}">낮음</option>
          </select>
        </div>
      </div>

      <div class="footer-right">
        <button type="submit" class="btn btn-ghost" id="editBtn" data-user-role="admin"
                th:text="${row == null} ? '등록' : '저장'">저장</button>
        <button type="submit" class="btn btn-ghost danger" id="deleteBtn" data-user-role="admin" th:if="${row != null}"
                th:formaction="@{/admin/notice/alarms/delete}" name="ids" th:value="${form.id}"
                onclick="return confirm('이 알림을 삭제할까요?');">삭제</button>
        <button type="submit" class="btn btn-primary" id="markReadBtn" th:if="${row != null}"
                th:formaction="@{/admin/notice/alarms/read}" name="ids" th:value="${form.id}">확인 처리</button>
      </div>
    </footer>

  </form>
</div>

<style>
  /* --- modal base --- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center;
    z-index:9999;
  }
  .modal{
    width:100%;
    height:100%;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 16px 60px rgba(0,0,0,0.22);
  }

  /* header */
  .modal-header{
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #eee;
    background:#fff;
  }
  .modal-title{ margin:0; font-size:16px; }
  .icon-btn{ border:0; background:transparent; font-size:18px; cursor:pointer; }

  /* meta */
  .modal-meta{
    padding:12px 16px;
    border-bottom:1px solid #f0f0f0;
    background:#fafafa;
  }
  .meta-row{
    display:flex; gap:12px; align-items:center; justify-content:space-between;
    flex-wrap:wrap;
  }
  .meta-item{ display:flex; gap:10px; align-items:center; }
  .meta-item.right{ margin-left:auto; gap:14px; flex-wrap:wrap; justify-content:flex-end; }
  .kv{ display:inline-flex; gap:8px; align-items:center; }
  .k{ font-size:12px; color:#666; font-weight:700; }
  .v{ font-size:12px; color:#222; }

  .badge{
    display:inline-flex; align-items:center;
    padding:5px 10px; border-radius:999px;
    font-size:12px; font-weight:800;
  }
  .badge-unread{ background:#fff3e6; color:#b06a00; }
  .badge-read{ background:#e7f6ec; color:#1a7f37; }
  .badge-scheduled{ background:#eef3ff; color:#2a57ff; }
  .badge-sent{ background:#f1f2f6; color:#444; }
  .badge-hidden{ background:#ffe9eb; color:#b42318; }

  .pill{
    background:#f1f2f6; padding:6px 10px;
    border-radius:999px; font-size:12px; color:#333;
  }

  /* body */
  .modal-body{
    padding:14px 16px;
    overflow:auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .field{ display:flex; flex-direction:column; gap:8px; }
  .label{ font-size:12px; color:#555; font-weight:800; }
  .input, .textarea, .select{
    width:100%;
    border:1px solid #dcdce6;
    border-radius:12px;
    padding:10px 12px;
    font-size:13px;
    background:#fff;
    box-sizing:border-box;
  }
  .textarea{ resize:vertical; }
  .hint{ margin:0; font-size:12px; color:#888; }

  /* footer */
  .modal-footer{
    border-top:1px solid #eee;
    background:#fff;
    padding:12px 16px;
    gap:12px;
  }
  .footer-left{
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;margin-bottom: 14px;
  }
  .select-row{ display:flex; align-items:center; gap:8px; }
  .label-inline{ font-size:12px; font-weight:800; color:#555;white-space: nowrap;}
  .footer-right{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  /* buttons */
  .btn{
    border:1px solid #dcdce6;
    background:#fff;
    padding:10px 12px;
    border-radius:12px;
    cursor:pointer;
    font-size:13px;
  }
  .btn:hover{ background:#fafafa; }
  .btn-ghost{ background:#fafafa; }
  .btn-ghost:hover{ background:#f2f2f7; }
  .btn-primary{ background:#2a57ff; border-color:#2a57ff; color:#fff; font-weight:800; }
  .btn-primary:hover{ filter:brightness(0.95); }
  .danger{ color:#d92d20; }
</style>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('alarmModal');
    const openBtn = document.getElementById('openAlarmModalBtn');

    const statusSelect = document.getElementById('statusSelect');
    const prioritySelect = document.getElementById('prioritySelect');

    const statusBadge = document.getElementById('alarmStatusBadge');
    const priorityPill = document.getElementById('alarmPriorityPill');

    const markReadBtn = document.getElementById('markReadBtn');
    const deleteBtn = document.getElementById('deleteBtn');

    // Only add event listener if openBtn exists
    if (openBtn) {
      openBtn.addEventListener('click', openModal);
    }

    function openModal(e){
      if (e) e.preventDefault();
      modal.hidden = false;
      document.body.style.overflow = 'hidden';
    }
    function closeModal(e){
      if (e) e.preventDefault();
      modal.hidden = true;
      document.body.style.overflow = '';
      openBtn?.focus();
    }

    // Open / Close triggers
    // openBtn.addEventListener('click', openModal);
    // modal.addEventListener('click', (e) => {
    //   if (e.target === modal) closeModal(e); // backdrop click
    //   // const close = e.target.closest('[data-close-modal]');
    //   if (close) closeModal(e);
    // });
    // document.addEventListener('keydown', (e) => {
    //   if (!modal.hidden && e.key === 'Escape') closeModal(e);
    // });

    // Badge mapping
    function applyStatusUI(val){
      statusBadge.className = 'badge';
      if (val === 'unread') { statusBadge.textContent = '미확인'; statusBadge.classList.add('badge-unread'); }
      if (val === 'read') { statusBadge.textContent = '확인'; statusBadge.classList.add('badge-read'); }
      if (val === 'scheduled') { statusBadge.textContent = '예약'; statusBadge.classList.add('badge-scheduled'); }
      if (val === 'sent') { statusBadge.textContent = '발송완료'; statusBadge.classList.add('badge-sent'); }
      if (val === 'hidden') { statusBadge.textContent = '숨김'; statusBadge.classList.add('badge-hidden'); }
    }
    function applyPriorityUI(val){
      if (val === 'high') priorityPill.textContent = '중요도: 높음';
      if (val === 'normal') priorityPill.textContent = '중요도: 보통';
      if (val === 'low') priorityPill.textContent = '중요도: 낮음';
    }

    statusSelect.addEventListener('change', () => applyStatusUI(statusSelect.value));
    prioritySelect.addEventListener('change', () => applyPriorityUI(prioritySelect.value));

    // 확인 처리 / 삭제는 서버로 실제 submit 한다 (th:formaction). 데모 리스너 제거.

    // 이 화면은 목록에서 window.open 팝업(520x600)으로 뜬다. 그대로 submit 하면
    // 서버 리다이렉트(목록 전체 페이지)가 팝업 안에 렌더된다 — 팝업일 때는 fetch 로
    // 제출하고 성공 시 부모 목록을 새로고침한 뒤 팝업을 닫는다.
    const popupForm = document.querySelector('form.modal');
    if (window.opener && popupForm) {
      popupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitter = e.submitter;
        const action = (submitter && submitter.formAction) || popupForm.action;
        const fd = new FormData(popupForm);
        if (submitter && submitter.name) fd.append(submitter.name, submitter.value);
        try {
          const res = await fetch(action, { method: 'POST', body: fd });
          if (res.ok || res.redirected) {
            window.opener.location.reload();
            window.close();
          } else {
            alert('처리에 실패했습니다. (' + res.status + ')');
          }
        } catch (err) {
          alert('처리 중 오류가 발생했습니다.');
        }
      });
    }

    // init
    applyStatusUI(statusSelect.value);
    applyPriorityUI(prioritySelect.value);
  });
</script>
