<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/i-common-style.css">
    <link rel="stylesheet" href="/static/css/i-sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">

    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 과정 상세</title>
    <style>
        /* .main-content 가 overflow:hidden 이라 래퍼가 flex:1 + overflow-y:auto 를 가져야 본문이 스크롤된다 */
        .form-wrap { max-width:900px; padding:20px; flex:1; min-height:0; overflow-y:auto; }
        .form-section { background:#fff; margin-bottom:20px; border:1px solid var(--gray-200); padding:20px 24px 26px; border-radius:8px; display:flex; flex-direction:column; gap:16px; }
        .section-title { font-size:18px; font-weight:700; color:var(--gray-800); }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        .form-label { display:block; font-size:13px; font-weight:600; color:var(--gray-500); margin-bottom:4px; }
        .meta-value { font-size:14px; color:var(--gray-800); }
        .status-badge { display:inline-block; padding:4px 12px; border-radius:12px; background:#e7f1ff; color:#1c6dd0; font-size:13px; font-weight:600; }
        .subject-block { border:1px solid var(--gray-200); border-radius:8px; padding:12px 16px; margin-bottom:10px; }
        .subject-head { display:flex; justify-content:space-between; align-items:center; font-weight:700; }
        .session-row { font-size:13px; color:var(--gray-600); padding:4px 0 4px 12px; }
        .empty-hint { color:var(--gray-500); font-size:13px; }
        .top-actions { display:flex; justify-content:flex-start; margin-bottom:12px; }
    </style>
</head>
<body>
    <header th:replace="~{fragments/instructor :: header('담당 과정 &gt; 과정 상세')}"></header>
    <th:block th:replace="~{fragments/instructor :: sidebar('courses')}"/>

    <main class="main-content">
        <div class="form-wrap">
            <div th:replace="${sampleData} ? ~{fragments/instructor :: sampleNotice} : ~{}"></div>
            <div class="top-actions">
                <button type="button" class="btn btn-secondary" onclick="location.href='/instructor/courses'">← 목록</button>
            </div>
            <div class="section-header"><h2 th:text="${course.courseName}">과정명</h2></div>

            <!-- 기본 정보 (읽기 전용) -->
            <div class="form-section">
                <h3 class="section-title">기본 정보</h3>
                <div class="form-row">
                    <div><label class="form-label">과정 코드</label><div class="meta-value" th:text="${course.courseCode}">-</div></div>
                    <div><label class="form-label">기수</label><div class="meta-value" th:text="${course.cohort} ?: '-'">-</div></div>
                </div>
                <div class="form-row">
                    <div><label class="form-label">카테고리</label><div class="meta-value" th:text="${course.category} ?: '-'">-</div></div>
                    <div><label class="form-label">상태</label><div class="meta-value"><span class="status-badge" th:text="${course.status.label}">상태</span></div></div>
                </div>
                <div class="form-row">
                    <div><label class="form-label">기간</label><div class="meta-value" th:text="|${course.startDate} ~ ${course.endDate}|">-</div></div>
                    <div><label class="form-label">정원</label><div class="meta-value" th:text="|${course.capacity}명|">-</div></div>
                </div>
                <div>
                    <label class="form-label">과정 소개</label>
                    <div class="meta-value" th:text="${course.description} ?: '-'">-</div>
                </div>
            </div>

            <!-- 과목 / 차시 구성 (읽기 전용) -->
            <div class="form-section">
                <h3 class="section-title">과목 · 차시 구성</h3>
                <p th:if="${#lists.isEmpty(subjects)}" class="empty-hint">등록된 과목이 없습니다.</p>

                <div class="subject-block" th:each="subject : ${subjects}">
                    <div class="subject-head">
                        <span th:text="|${subject.orderNo}. ${subject.name}|">과목명</span>
                        <span class="empty-hint" th:text="|${#lists.size(subject.sessions)}차시|">0차시</span>
                    </div>
                    <p th:if="${subject.sessions.isEmpty()}" class="empty-hint" style="padding-left:12px;">차시가 없습니다.</p>
                    <!-- 'session' 은 Thymeleaf 3.1 예약어 — 루프 변수로 쓰면 렌더 중 예외로 응답이 잘린다. lesson 사용. -->
                    <div class="session-row" th:each="lesson : ${subject.sessions}">
                        <span th:text="|${lesson.seq}차시 · ${lesson.name}|">차시</span>
                        <span th:if="${lesson.lessonDate}" th:text="| · ${lesson.lessonDate}|"></span>
                        <span th:if="${lesson.learningMinutes}" th:text="| · ${lesson.learningMinutes}분|"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
