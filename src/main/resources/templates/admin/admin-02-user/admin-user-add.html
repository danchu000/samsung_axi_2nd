<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 관리자 등록</title>
    <style>
        .form-section { flex: 1; padding: 20px; overflow-y: auto; }
        .info-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px;
            padding: 24px; margin-bottom: 20px; max-width: 720px; }
        .form-row { display: flex; align-items: center; margin-bottom: 14px; }
        .form-row > label { width: 130px; font-weight: 600; font-size: 14px; color: var(--color-font-gray); }
        .form-row .field { flex: 1; }
        .form-row input[type=text], .form-row input[type=email], .form-row input[type=date],
        .form-row input[type=password] {
            width: 100%; max-width: 340px; padding: 8px 10px; border: 1px solid var(--gray-300);
            border-radius: 4px; font-size: 14px; color: var(--color-font-gray); box-sizing: border-box; }
        .radio-group { display: flex; gap: 18px; }
        .radio-group label { display: flex; align-items: center; gap: 5px; font-size: 14px; cursor: pointer; }
        .field-error { color: var(--color-danger); font-size: 12px; margin-top: 4px; display: block; }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    </style>
</head>
<body>
    <header th:replace="~{fragments/admin :: header('사용자 관리 > 관리자 등록')}"></header>
    <th:block th:replace="~{fragments/admin :: sidebar('user-admin')}"/>

    <main class="main-content">
        <section class="form-section">
            <div class="section-header"><h2>관리자 등록</h2></div>

            <form class="info-card" th:action="@{/admin/admins}" th:object="${form}" method="post">
                <div class="form-row">
                    <label>아이디</label>
                    <div class="field">
                        <input type="text" th:field="*{loginId}" placeholder="로그인 아이디">
                        <span class="field-error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></span>
                    </div>
                </div>
                <div class="form-row">
                    <label>초기 비밀번호</label>
                    <div class="field">
                        <input type="password" th:field="*{password}" placeholder="초기 비밀번호">
                        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>
                </div>
                <div class="form-row">
                    <label>이름</label>
                    <div class="field">
                        <input type="text" th:field="*{name}">
                        <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                    </div>
                </div>
                <div class="form-row">
                    <label>이메일</label>
                    <div class="field">
                        <input type="email" th:field="*{email}">
                        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>
                </div>
                <div class="form-row">
                    <label>연락처</label>
                    <div class="field"><input type="text" th:field="*{phone}" placeholder="010-0000-0000"></div>
                </div>
                <div class="form-row">
                    <label>생년월일</label>
                    <div class="field"><input type="date" th:field="*{birthDate}"></div>
                </div>
                <div class="form-row">
                    <label>성별</label>
                    <div class="field radio-group">
                        <label><input type="radio" th:field="*{gender}" value="male"><span>남</span></label>
                        <label><input type="radio" th:field="*{gender}" value="female"><span>여</span></label>
                    </div>
                </div>
                <div class="form-row">
                    <label>학력</label>
                    <div class="field"><input type="text" th:field="*{education}" placeholder="예) 4년제 대학 졸업"></div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-back" onclick="location.href='/admin/admins'">취소</button>
                    <button type="submit" class="btn btn-primary">등록하기</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
