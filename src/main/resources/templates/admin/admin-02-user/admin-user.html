<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 관리자 관리</title>
    <style>
        .manager-list-section { flex: 1; padding: 20px; overflow-y: auto; }
        .manager-table { width: 100%; border-collapse: collapse; background-color: white; }
        .manager-table thead { background-color: var(--color-light-gray); }
        .manager-table th { padding: 12px 15px; text-align: center; font-weight: 600;
            font-size: 14px; color: var(--color-font-gray); border-bottom: 2px solid #ddd; }
        .manager-table td { padding: 12px 15px; font-size: 14px; color: var(--color-font-gray);
            border-bottom: 1px solid #f0f0f0; text-align: center; }
        .manager-table tbody tr.row-inactive td { color: #aaa; }
        .empty-row td { padding: 40px 15px; color: var(--color-font-gray-light); }
        .flash { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        .flash-success { background: #e8f5e9; color: #2e7d32; }
        .flash-error { background: #fdecea; color: #c62828; }
        .status-badge { padding: 3px 10px; border-radius: 12px; font-size: 13px; }
        .status-active { background: #e8f5e9; color: #2e7d32; }
        .status-other { background: #eee; color: #666; }
        .row-actions { display: inline-flex; gap: 6px; }
        .row-actions form { display: inline; }
    </style>
</head>
<body>
    <header th:replace="~{fragments/admin :: header('사용자 관리 > 관리자 관리')}"></header>
    <th:block th:replace="~{fragments/admin :: sidebar('user-admin')}"/>

    <main class="main-content">
        <section class="manager-list-section">
            <div class="section-header">
                <h2>관리자 관리</h2>
                <div class="header-buttons">
                    <button class="btn btn-secondary" onclick="location.href='/admin/admins/new'">관리자 등록</button>
                </div>
            </div>

            <div class="flash flash-success" th:if="${message}" th:text="${message}"></div>
            <div class="flash flash-error" th:if="${error}" th:text="${error}"></div>

            <p style="font-size: 14px; color: var(--color-font-gray); margin: 8px 0 16px;">
                총 <strong th:text="${#lists.size(admins)}">0</strong>명 ·
                활성 관리자는 최소 1명이 유지되어야 하며, 마지막 활성 관리자는 비활성화할 수 없습니다.
            </p>

            <div class="manager-list-section-table">
                <table class="manager-table">
                    <thead>
                        <tr>
                            <th>이름</th>
                            <th>아이디</th>
                            <th>이메일</th>
                            <th>연락처</th>
                            <th>생년월일</th>
                            <th>계정상태</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="admin : ${admins}"
                            th:classappend="${admin.status.name() != 'ACTIVE'} ? 'row-inactive'">
                            <td th:text="${admin.name}">홍길동</td>
                            <td th:text="${admin.loginId}">admin</td>
                            <td th:text="${admin.email} ?: '-'">-</td>
                            <td th:text="${admin.phone} ?: '-'">-</td>
                            <td th:text="${admin.birthDate} ?: '-'">-</td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${admin.status.name() == 'ACTIVE'} ? 'status-active' : 'status-other'"
                                      th:text="${admin.status.label}">활성</span>
                            </td>
                            <td>
                                <div class="row-actions">
                                    <button class="btn-small btn-secondary"
                                            th:onclick="|location.href='/admin/admins/${admin.id}/edit'|">수정</button>
                                    <form th:if="${admin.status.name() == 'ACTIVE'}"
                                          th:action="@{/admin/admins/{id}/deactivate(id=${admin.id})}" method="post"
                                          onsubmit="return confirm('이 관리자를 비활성화하시겠습니까?');">
                                        <button type="submit" class="btn-small btn-danger">비활성화</button>
                                    </form>
                                    <form th:unless="${admin.status.name() == 'ACTIVE'}"
                                          th:action="@{/admin/admins/{id}/activate(id=${admin.id})}" method="post">
                                        <button type="submit" class="btn-small btn-primary">활성화</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr class="empty-row" th:if="${#lists.isEmpty(admins)}">
                            <td colspan="7">등록된 관리자가 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
