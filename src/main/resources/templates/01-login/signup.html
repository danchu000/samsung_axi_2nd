<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/font-style.css">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <title>Samsung Academy LXP - 회원가입</title>
</head>
<style>
    body.login-bg {
        background: url('/static/img/login-bg.jpg') no-repeat center center fixed;
        background-size: cover;
        height: 100vh;
        min-height: 100vh;
        /* 100vw 는 세로 스크롤바 폭만큼 가로로 넘친다 — 100% 로 둔다 */
        width: 100%;
        overflow-x: hidden;
        overflow-y: hidden;
    }
    .lxp {
        font-family: 'SamsungSans', sans-serif;
        font-weight: 700;
        /* 1600px 이상에서는 기존 9rem 그대로, 그 아래에서만 줄어든다 */
        font-size: clamp(3rem, 9vw, 9rem);
        text-align: start;
        opacity: 0.8;
        line-height: 2.5;
    }
    .left-side { position: absolute; bottom: 5%; left: 5%; }
    .left-side .left-list {
        list-style: none; padding: 0; margin: 0;
        font-size: clamp(1.75rem, 7.5vw, 7.5rem); line-height: 0.93; opacity: 0.8;
    }
    .right-side {
        color: var(--gray-900); width: 30%; min-width: 360px; height: 100%; overflow-y: auto;
        background: rgba(255,255,255,0.18);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-radius: 8px; border: 0.5px solid rgba(255,255,255,0.3);
        position: absolute; top: 50%; right: 0%;
        transform: translateY(-50%);
        z-index: 10;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .right-side #logo { display: block; width: 12rem; margin: 0 auto 3rem auto; }
    .signup-type-box {
        display: flex; flex-direction: column; gap: 1.2rem;
        width: 260px; font-family: "Paperlogy", sans-serif;
    }
    .signup-type-box h2 {
        /* Paperlogy 는 Thin/Light/Medium 3종뿐이라 600 이면 가짜 볼드가 합성된다. 실제 있는 500 사용. */
        text-align: center; font-weight: 500; font-size: 1.4rem; margin: 0 0 0.5rem;
    }
    .type-btn {
        width: 100%; padding: 1.1rem 0; font-size: 1.05rem;
        border-radius: 6px; border: 1px solid #000; cursor: pointer;
        background: #fff; color: #000; transition: all 0.2s;
    }
    .type-btn:hover { background: #000; color: #fff; }
    .type-btn .desc { display: block; font-size: 0.8rem; opacity: 0.7; margin-top: 4px; }
    .back-link {
        text-align: center; cursor: pointer; font-size: 0.9rem; margin-top: 0.5rem;
        color: var(--gray-800);
    }
    .back-link:hover { color: var(--color-deep-primary); }

    /* =====================================================================
       반응형 — login.html 과 같은 원칙. common-style.css 의 전역 body 선언은 건드리지 않고
       body.login-bg 스코프에서만 덮어쓴다.
       ===================================================================== */

    @media (max-width: 1440px) {
        .right-side { width: 34%; }
        .left-side { bottom: 4%; left: 4%; }
    }

    /* ~1024px : 좌우 2단 → 세로 스택 */
    @media (max-width: 1024px) {
        body.login-bg { height: auto; min-height: 100vh; overflow-y: auto; }
        main { display: flex; flex-direction: column; min-height: 100vh; }
        .left-side { position: static; padding: 2.5rem 1.5rem 0; }
        .lxp { line-height: 1.15; }
        .right-side {
            position: static; transform: none;
            width: 100%; min-width: 0; height: auto;
            margin-top: 2rem; padding: 2.5rem 1.5rem;
            border-radius: 0; overflow-y: visible;
        }
    }

    /* ~768px : 폼 전폭(좌우 24px) + 가독성 오버레이 */
    @media (max-width: 768px) {
        body.login-bg::before {
            content: ""; position: fixed; inset: 0;
            background: rgba(255, 255, 255, 0.45);
            z-index: 0; pointer-events: none;
        }
        main { position: relative; z-index: 1; }
        .left-side { padding: 2rem 24px 0; }
        .right-side { padding: 2rem 24px; }
        .signup-type-box { width: 100%; max-width: 320px; }
    }

    /* 세로가 짧은 노트북 */
    @media (min-width: 1025px) and (max-height: 780px) {
        .right-side #logo { width: 9rem; margin: 0 auto 1.5rem auto; }
    }
</style>
<body class="login-bg">
    <main>
        <section class="left-side">
            <h1 class="lxp">LXP</h1>
            <ul class="left-list">
                <li style="font-family:'Paperlogy';">학습을 경험으로</li>
                <li style="font-family:'SamsungSans'; font-weight:400;">SAMSUNG</li>
                <li style="font-family:'Paperlogy';">설계하다</li>
                <li style="font-family:'SamsungSans'; font-weight:400;">ACADEMY</li>
            </ul>
        </section>
        <section class="right-side">
            <div>
                <img id="logo" src="/static/img/logo.png" alt="logo">
                <div class="signup-type-box">
                    <h2>회원가입</h2>
                    <button type="button" class="type-btn" onclick="location.href='/signup/trainee'">
                        훈련생으로 가입
                        <span class="desc">교육과정 수강을 신청합니다</span>
                    </button>
                    <button type="button" class="type-btn" onclick="location.href='/signup/instructor'">
                        강사로 가입
                        <span class="desc">교육과정을 담당합니다</span>
                    </button>
                    <div class="back-link" onclick="location.href='/login'">← 로그인으로 돌아가기</div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
