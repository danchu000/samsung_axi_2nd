<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  관리자 공통 레이아웃 fragment (공동 소유 — 수정 전 상대 개발자와 공유, CLAUDE.md 참고)

  사용법 (기존 admin 페이지의 <header>...</header>, <aside>...</aside>, 토글 버튼 블록을 아래 두 줄로 교체):
    <header th:replace="~{fragments/admin :: header('사용자 관리 > 훈련생 관리')}"></header>
    <th:block th:replace="~{fragments/admin :: sidebar('user-trainee')}"/>

  sidebar() 의 active 키:
    dashboard | user-trainee | user-instructor | user-admin | contents
    | courses | schedule | eval-assignment | eval-exam | eval-monitoring
    | att-status | att-graduate | att-survey | support-tutoring | support-response
    | notice | alarm

  링크는 아직 정적 HTML 경로(/templates/...)를 유지한다.
  각 도메인이 컨트롤러로 전환될 때 이 파일에서만 URL 을 바꾸면 전 페이지에 반영된다.
-->
<body>

<!-- ===== 상단 헤더 ===== -->
<header class="header" th:fragment="header(title)">
    <h1 th:text="${title}">페이지 제목</h1>
    <div class="icon-container">
        <div class="icon-box" onclick="location.href='/templates/admin/admin-07-notice/admin-alarm.html'"><img src="/static/icons/bell.svg" alt="alert icon" style="width: 28px;"></div>
        <div class="icon-box" onclick="location.href='/templates/admin/my-info.html'"><img src="/static/icons/user.svg" alt="user icon" style="width: 30px;"></div>
        <div class="icon-box"><img src="/static/icons/setting.svg" alt="setting icon" style="width: 25px;"></div>
    </div>
</header>

<!-- ===== 왼쪽 사이드바 (+ 토글 버튼) — th:block 이라 aside 와 토글 버튼이 형제로 삽입된다 ===== -->
<th:block th:fragment="sidebar(active)">
<aside class="sidebar">
    <div class="logo-box">
        <img id="sidebarLogo" src="/static/img/logo-white.png" alt="logo" style="width: 130px;">
    </div>

    <nav class="menu">
        <ul>
            <li data-page="/templates/admin/index.html" onclick="handleMenuClick(this, '/templates/admin/index.html')">
                <img src="/static/icons/01-dashboard.svg" alt="dashboard icon" style="width: 26px; margin-left:-2px; margin-right: 8px; vertical-align: middle; padding-bottom: 4px;">
                <span class="menu-text" th:classappend="${active == 'dashboard'} ? 'active_menu'">대시보드</span>
            </li>
            <li data-page="/templates/admin/admin-02-user/admin-user-trainee.html" onclick="handleMenuClick(this, '/templates/admin/admin-02-user/admin-user-trainee.html')">
                <img src="/static/icons/02-user.svg" alt="user icon" style="width: 28px; margin-right: 8px; vertical-align: middle; padding-bottom: 4px;">
                <span class="menu-text" th:classappend="${#strings.startsWith(active, 'user-')} ? 'active_menu'">사용자 관리</span>
                <ul>
                    <li class="submenu" th:classappend="${active == 'user-approval'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/admin/users/pending'">가입 승인</li>
                    <li class="submenu" th:classappend="${active == 'user-trainee'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-02-user/admin-user-trainee.html'">훈련생 관리</li>
                    <li class="submenu" th:classappend="${active == 'user-instructor'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-02-user/admin-user-instructor.html'">강사 관리</li>
                    <li class="submenu" th:classappend="${active == 'user-admin'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-02-user/admin-user.html'">관리자 관리</li>
                </ul>
            </li>
            <li data-page="/templates/admin/admin-04-evaluation/admin-evaluation-question-bank.html" onclick="handleMenuClick(this, '/templates/admin/admin-04-evaluation/admin-evaluation-question-bank.html')">
                <img src="/static/icons/03-description.svg" alt="evaluation icon" style="width: 26px; margin-left:0px; margin-right: 7px; vertical-align: middle; padding-bottom: 4px;">
                <span class="menu-text" th:classappend="${active == 'contents'} ? 'active_menu'">콘텐츠 관리</span>
            </li>
            <li data-page="/templates/admin/admin-03-courses/admin-course-edu.html" onclick="handleMenuClick(this, '/templates/admin/admin-03-courses/admin-courses-edu.html')">
                <img src="/static/icons/03-course.svg" alt="course icon" style="width: 25px; margin-right: 8px; vertical-align: middle; padding-bottom: 4px;">
                <span class="menu-text" th:classappend="${active == 'courses' or active == 'schedule'} ? 'active_menu'">과정/운영 관리</span>
                <ul>
                    <li class="submenu" th:classappend="${active == 'courses'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-03-courses/admin-courses-edu.html'">과정 관리</li>
                    <li class="submenu" th:classappend="${active == 'schedule'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-03-courses/admin-courses-schedule.html'">일정 관리</li>
                </ul>
            </li>
            <li data-page="/templates/admin/admin-04-evaluation/admin-evaluation-assignment.html" onclick="handleMenuClick(this, '/templates/admin/admin-04-evaluation/admin-evaluation-assignment.html')">
                <img src="/static/icons/04-evaluation.svg" alt="evaluation icon" style="width: 30px; margin-left:-4px; margin-right: 7px; vertical-align: middle; padding-bottom: 4px;">
                <span class="menu-text" th:classappend="${#strings.startsWith(active, 'eval-')} ? 'active_menu'">평가 관리</span>
                <ul>
                    <li class="submenu" th:classappend="${active == 'eval-assignment'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-04-evaluation/admin-evaluation-assignment.html'">과제 채점</li>
                    <li class="submenu" th:classappend="${active == 'eval-exam'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-04-evaluation/admin-evaluation-result.html'">시험 채점</li>
                    <li class="submenu" th:classappend="${active == 'eval-monitoring'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-04-evaluation/admin-evaluation-monitoring.html'">평가 모니터링</li>
                </ul>
            </li>
            <li data-page="/templates/admin/admin-05-attendance/admin-attendance.html" onclick="handleMenuClick(this, '/templates/admin/admin-05-attendance/admin-attendance.html')">
                <img src="/static/icons/05-attendance.svg" alt="attendance icon" style="width: 28px; margin-right: 8px; vertical-align: middle; padding-bottom: 4px;">
                <span class="menu-text" th:classappend="${#strings.startsWith(active, 'att-')} ? 'active_menu'">출결/이수 관리</span>
                <ul>
                    <li class="submenu" th:classappend="${active == 'att-status'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-05-attendance/admin-attendance.html'">출결현황</li>
                    <li class="submenu" th:classappend="${active == 'att-graduate'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-05-attendance/admin-attendance-graduate.html'">이수 관리</li>
                    <li class="submenu" th:classappend="${active == 'att-survey'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-05-attendance/admin-attendance-survey.html'">설문조사 관리</li>
                </ul>
            </li>
            <li data-page="/templates/admin/admin-06-support/admin-support-tutoring.html" onclick="handleMenuClick(this, '/templates/admin/admin-06-support/admin-support-tutoring.html')">
                <img src="/static/icons/06-support.svg" alt="support icon" style="width: 25px; margin-right: 8px; vertical-align: middle; padding-bottom: 4px;">
                <span class="menu-text" th:classappend="${#strings.startsWith(active, 'support-')} ? 'active_menu'">학습 지원</span>
                <ul>
                    <li class="submenu" th:classappend="${active == 'support-tutoring'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-06-support/admin-support-tutoring.html'">튜터링/Q&amp;A</li>
                    <li class="submenu" th:classappend="${active == 'support-response'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-06-support/admin-support-response.html'">응답현황</li>
                </ul>
            </li>
            <li data-page="/templates/admin/admin-07-notice/admin-notice.html" onclick="handleMenuClick(this, '/templates/admin/admin-07-notice/admin-notice.html')" class="white-icon">
                <img src="/static/icons/bell.svg" alt="notice icon" style="width: 26px; margin-right: 8px; vertical-align: middle; padding-bottom: 4px;">
                <span class="menu-text" th:classappend="${active == 'notice' or active == 'alarm'} ? 'active_menu'">공지/알림</span>
                <ul>
                    <li class="submenu" th:classappend="${active == 'notice'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-07-notice/admin-notice.html'">공지 관리</li>
                    <li class="submenu" th:classappend="${active == 'alarm'} ? 'active_menu'" onclick="event.stopPropagation(); location.href='/templates/admin/admin-07-notice/admin-alarm.html'">알림 관리</li>
                </ul>
            </li>
        </ul>
    </nav>

    <!-- 로그아웃: Spring Security 는 POST /logout -->
    <form th:action="@{/logout}" method="post" style="display: contents;">
        <button type="submit" class="logout" style="background: none; border: none; cursor: pointer;">로그아웃
            <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="CurrentColor">
                <path d="M186.67-120q-27 0-46.84-19.83Q120-159.67 120-186.67v-586.66q0-27 19.83-46.84Q159.67-840 186.67-840h292.66v66.67H186.67v586.66h292.66V-120H186.67Zm470.66-176.67-47-48 102-102H360v-66.66h351l-102-102 47-48 184 184-182.67 182.66Z"/>
            </svg>
        </button>
    </form>

</aside>

<!-- 토글 버튼 (사이드바와 한 세트) -->
<div class="toggle-btn" onclick="toggleSidebar()">◀</div>
</th:block>

</body>
</html>
