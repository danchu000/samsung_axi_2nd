<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/chatbot.css">
  <script src="/static/js/chatbot.js" defer></script>
	<link rel="stylesheet" href="/static/css/basic-form-trainee.css">
	<link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/trainee/continue-learning.css">
    <script src="/static/js/trainee/continue-learning.js" defer></script>

	<title>Samsung Academy LXP</title>
</head>
<style>
    /* 원형 진도율 그래프 */
    .progress-circle {
        width: 100%;
        height: 100%;
        display: inline-block;
        vertical-align: middle;
    }
    .progress-circle-text {
        font-size: 12px;
        font-weight: 700;
        fill: var(--color-primary);
        dominant-baseline: middle;
        text-anchor: middle;
    }
    /* 아코디언 스타일 */
    .accordion {
        border: 1px solid var(--gray-200);
        border-radius: 8px;
        margin-bottom: 8px;
        background: #fff;
        overflow: hidden;
    }
    .accordion-header {
        padding: 20px;
        background: #f5f6fa;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--gray-200);
        transition: background 0.2s;
    }
    .accordion-header:hover {
        background: var(--gray-200);
    }

    .accordion-header .accordion-header-content>span {
    font-size: 20px;
    }

    .accordion-header .accordion-header-content {
        flex:1;
        display:flex;
        flex-direction:column;
        align-items:flex-start;
        gap: 10px;
    }
    .accordion-content {
        padding: 16px 20px;
        display: none;
        background: var(--gray-50);
        font-size: 15px;
        color: var(--gray-800);
    }
    .accordion.open .accordion-content {
        display: block;
    }
    .accordion-arrow {
        font-size: 18px;
        transition: transform 0.2s;
    }
    .accordion.open .accordion-arrow {
        transform: rotate(90deg);
    }
    .course-card {
        background: white;
        border: 1px solid var(--gray-200);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 16px;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .course-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
    }

    .course-category {
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        background: var(--color-primary);
        padding: 4px 8px;
        border-radius: 12px;
    }

    .course-status {
        font-size: 14px;
        color: var(--gray-600);
    }

    .course-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--gray-800);
        margin-bottom: 8px;
    }

    .course-instructor {
        font-size: 16px;
        color: var(--gray-500);
        margin-bottom: 16px;
    }

    .course-stats {
        display: flex;
        justify-content: space-between;
        margin-bottom: 16px;
        background: var(--gray-50);
        padding: 12px;
        border-radius: 8px;
    }

    .stat-item {
        text-align: center;
        width: 25%;
    }

    .stat-label {
        font-size: 12px;
        color: var(--gray-600);
        margin-bottom: 4px;
    }

    .stat-value {
        font-size: 16px;
        font-weight: 700;
        color: var(--gray-800);
    }

    .course-progress {
        margin-bottom: 16px;
    }

    .progress-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    .progress-label {
        font-size: 14px;
        color: var(--gray-600);
    }

    .progress-percentage {
        font-size: 16px;
        font-weight: 700;
        color: var(--color-primary);
    }

    .progress-bar {
        width: 100%;
        height: 8px;
        background: var(--gray-200);
        border-radius: 4px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        background: var(--color-primary);
        border-radius: 4px;
    }

    .course-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .course-period {
        font-size: 16px;
        color: var(--gray-600);
    }

    .course-button {
        background: var(--color-primary);
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s;
    }

    .course-button:hover {
        background: var(--color-primary-hover);
    }

    
</style>
<!-- ********************************************************************************************************* -->
<body>
    <header th:replace="~{fragments/trainee :: header('my-course')}"></header>
    <!-- 메인 컨텐츠 ********************************************************************************************************* -->
	<main>
		<section class="main-content-top">
			<div class="main-wrap flex-between">
				<h2>나의 과정 > 이어서 학습</h2>
                <button class="btn btn-primary">바로 학습하기</button>
			</div>
		</section>
		<section class="main-content">
            <div class="main-wrap">
                <div id="continue-course-card"></div>
                <section class="subject-container">
                    <!-- JS로 동적 생성 -->
                </section>
            </div>
		</section>
        <!-- 플로팅 메뉴 (AI 챗봇) -->
        <div class="floating-chatbot-btn" id="floatingChatbotBtn">
            <img src="/static/img/chatbot.png" alt="AI 헬피 챗봇">
            <span class="chatbot-hint">AI 헬피 챗봇</span>
        </div>

        <!-- Floating Chatbot Window -->
        <div class="floating-chatbot-window" id="floatingChatbotWindow" style="display:none;">
            <div class="chatbot-header">
                <span>AI 헬피 챗봇</span>
                <button class="chatbot-close-btn" id="chatbotCloseBtn" title="닫기">×</button>
            </div>
            <div class="chatbot-messages" id="chatbotMessages">
                <div class="chatbot-msg chatbot-msg-bot">안녕하세요! 무엇을 도와드릴까요?</div>
            </div>
            <div class="chatbot-badge-row" style="padding-left: 15px; display:flex; gap:7px; flex-wrap:wrap;background-color: #f7faff;">
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">출결 확인</span>
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">과제 마감</span>
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">시험 일정</span>
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">Q&A 문의</span>
            </div>
            <div class="chatbot-input-area">
                <input type="text" id="chatbotInput" class="chatbot-input" placeholder="메시지를 입력하세요..." autocomplete="off">
                <button id="chatbotSendBtn" class="chatbot-send-btn">전송</button>
            </div>
        </div>
	</main>
<!-- 푸터 ********************************************************************************************************* -->
<footer th:replace="~{fragments/trainee :: footer}"></footer>
<style>
    /* ===== simple footer ===== */
.simple-footer{

  padding:14px 18px;
  border-top:1px solid var(--gray-200);
  background:#fff;
  position: relative;
  bottom: 0;
  width: 100%;
  box-sizing: border-box;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  font-size:12px;
  color:var(--gray-500);
  font-weight:700;
}

.footer-link{
  color:var(--gray-500);
  text-decoration:none;
}
.footer-link:hover{
  text-decoration:underline;
}

.footer-dot{
  margin:0 6px;
  color:var(--gray-300);
}

@media (max-width:640px){
  .footer-inner{
    flex-direction:column;
    gap:6px;
  }
}

</style>

	
</body>
</html>
