<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/graduate.css">
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 이수 관리</title>
    <style>
        .toolbar { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px; }
        .toolbar label { display:block; font-size:13px; font-weight:600; color:#777; margin-bottom:4px; }
        .toolbar select { padding:8px 12px; border:1px solid #ddd; border-radius:8px; min-width:280px; }
        .flash-msg { background:#e7f6ec; color:#1b7a3d; border:1px solid #b6e0c4; padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:14px; }
        .criteria-box { background:#fff; border:1px solid var(--color-line-gray,#e5e5e5); border-radius:8px; padding:18px 20px; margin-bottom:20px; }
        .criteria-box h3 { font-size:16px; font-weight:700; margin-bottom:12px; }
        .criteria-form { display:flex; gap:18px; align-items:flex-end; flex-wrap:wrap; }
        .criteria-form label { display:block; font-size:13px; color:#777; margin-bottom:4px; }
        .criteria-form input[type=number] { width:90px; padding:8px 10px; border:1px solid #ddd; border-radius:6px; }
        .criteria-form input[type=text] { width:260px; padding:8px 10px; border:1px solid #ddd; border-radius:6px; }
        .action-row { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
        table.grad-table { border-collapse:collapse; width:100%; font-size:13px; }
        table.grad-table th, table.grad-table td { border-bottom:1px solid #eee; padding:10px 12px; text-align:center; }
        table.grad-table th { background:#fafafa; color:#555; font-weight:600; }
        .badge { display:inline-block; padding:3px 10px; border-radius:10px; font-size:12px; font-weight:600; }
        .res-PASS { background:#d4edda; color:#155724; }
        .res-FAIL { background:#f8d7da; color:#721c24; }
        .res-PENDING { background:#e2e3e5; color:#383d41; }
        .cs-CONFIRMED { background:#cfe2ff; color:#084298; }
        .cs-EXPECTED { background:#fff3cd; color:#856404; }
        .cs-PENDING { background:#e2e3e5; color:#383d41; }
        .empty-hint { color:#999; font-size:14px; padding:24px 0; }
        .inline-form { display:inline; }
        .status-form { display:inline-flex; gap:4px; align-items:center; }
        .status-form select { padding:2px 6px; font-size:12px; border:1px solid #ddd; border-radius:6px; }
    </style>
</head>
<body data-user-role="admin">
    <header th:replace="~{fragments/admin :: header('출결/이수 관리 > 이수 관리')}"></header>
    <th:block th:replace="~{fragments/admin :: sidebar('att-graduate')}"/>

    <main class="main-content">
        <section class="main-content-inner">
            <div class="section-header">
                <h2>이수 관리</h2>
            </div>

            <p class="flash-msg" th:if="${message}" th:text="${message}"></p>

            <!-- 과정 선택 -->
            <form class="toolbar" method="get" th:action="@{/admin/completion}">
                <div>
                    <label for="courseSelect">과정 선택</label>
                    <select id="courseSelect" name="courseId" onchange="this.form.submit()">
                        <option th:each="c : ${courses}" th:value="${c.id}"
                                th:selected="${selectedCourse != null and c.id == selectedCourse.id}"
                                th:text="|${c.courseName} (${c.courseCode}${c.cohort != null ? ' / ' + c.cohort : ''})|">과정</option>
                    </select>
                </div>
            </form>

            <div th:if="${selectedCourse != null}">
                <!-- 이수 기준 설정 -->
                <div class="criteria-box">
                    <h3>이수 기준 설정</h3>
                    <form class="criteria-form" method="post" th:action="@{/admin/completion/criteria}">
                        <input type="hidden" name="courseId" th:value="${selectedCourse.id}">
                        <div>
                            <label>최소 진도율(%)</label>
                            <input type="number" name="minProgressRate" min="0" max="100"
                                   th:value="${criteria.minProgressRate}">
                        </div>
                        <div>
                            <label>최소 출석률(%)</label>
                            <input type="number" name="minAttendanceRate" min="0" max="100"
                                   th:value="${criteria.minAttendanceRate}">
                        </div>
                        <div>
                            <label>성적 요건 반영</label>
                            <label style="font-weight:400;color:#333;">
                                <input type="checkbox" name="requireGradePass" value="true"
                                       th:checked="${criteria.requireGradePass}">
                                평가(성적) 이수 요건 포함
                            </label>
                        </div>
                        <div>
                            <label>비고</label>
                            <input type="text" name="note" th:value="${criteria.note}">
                        </div>
                        <button type="submit" class="btn btn-primary">기준 저장</button>
                    </form>
                    <p class="empty-hint" style="padding:8px 0 0;">
                        성적 도메인 통합 전에는 성적 요건을 끄고(진도+출결 기준) 판정하세요. 진도율은 콘텐츠/진도 트랙 통합 후 실제 값이 반영됩니다.
                    </p>
                </div>

                <!-- 자동 판정 실행 -->
                <div class="action-row">
                    <form class="inline-form" method="post" th:action="@{/admin/completion/evaluate}">
                        <input type="hidden" name="courseId" th:value="${selectedCourse.id}">
                        <button type="submit" class="btn btn-primary">이수 자동 판정 실행</button>
                    </form>
                    <span class="empty-hint" style="padding:0;">기준 대비 진도율·출석률(·성적)로 이수/미이수를 판정합니다.</span>
                </div>

                <!-- 이수 현황 -->
                <div class="attendance-info-section">
                    <p class="empty-hint" th:if="${completions == null or completions.isEmpty()}">
                        판정된 이수 정보가 없습니다. 이수 기준을 설정하고 자동 판정을 실행하세요.
                    </p>
                    <table class="grad-table" th:unless="${completions == null or completions.isEmpty()}">
                        <thead>
                            <tr>
                                <th>번호</th>
                                <th>훈련생명</th>
                                <th>생년월일</th>
                                <th>과정명/기수</th>
                                <th>진도율(%)</th>
                                <th>출석률(%)</th>
                                <th>이수상태</th>
                                <th>이수확정상태</th>
                                <th>확정일자</th>
                                <th>이수증</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row, i : ${completions}">
                                <td th:text="${i.count}">1</td>
                                <td th:text="${row.traineeName}">훈련생</td>
                                <td th:text="${row.birthDate} ?: '-'">-</td>
                                <td th:text="${row.courseLabel}">과정</td>
                                <td th:text="${row.progressRate}">0</td>
                                <td th:text="${row.attendanceRate}">0</td>
                                <td><span class="badge" th:classappend="'res-' + ${row.result}" th:text="${row.resultLabel}">상태</span></td>
                                <td>
                                    <form class="status-form" method="post"
                                          th:action="@{/admin/completion/{id}/status(id=${row.id})}">
                                        <input type="hidden" name="courseId" th:value="${selectedCourse.id}">
                                        <select name="status" onchange="this.form.submit()">
                                            <option th:each="s : ${confirmStatuses}" th:value="${s}"
                                                    th:selected="${s.name() == row.confirmStatus}"
                                                    th:text="${s.label}">상태</option>
                                        </select>
                                    </form>
                                </td>
                                <td th:text="${row.confirmedAt != null ? #temporals.format(row.confirmedAt, 'yyyy-MM-dd') : '-'}">-</td>
                                <td>
                                    <form th:if="${row.confirmStatus != 'CONFIRMED' and row.result == 'PASS'}"
                                          class="inline-form" method="post"
                                          th:action="@{/admin/completion/{id}/confirm(id=${row.id})}">
                                        <input type="hidden" name="courseId" th:value="${selectedCourse.id}">
                                        <button type="submit" class="btn btn-gray">확정</button>
                                    </form>
                                    <a th:if="${row.certificateIssuable}" class="btn btn-secondary"
                                       th:href="@{/admin/completion/{id}/certificate(id=${row.id})}"
                                       target="_blank">이수증 출력</a>
                                    <span th:if="${row.confirmStatus != 'CONFIRMED' and row.result != 'PASS'}"
                                          class="empty-hint" style="padding:0;">-</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <p class="empty-hint" th:if="${selectedCourse == null}">등록된 과정이 없습니다.</p>
        </section>
    </main>
</body>
</html>
