<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/i-common-style.css">
    <link rel="stylesheet" href="/static/css/i-sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/pagination.css">
    <link rel="stylesheet" href="/static/css/notices.css">
    <!-- notices.js 는 더미 배열을 렌더한다. 서버 전환하며 제거. -->
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 강사</title>
    <style>
        /* 추가적인 페이지별 스타일은 여기에 작성 */
    </style>
</head>
<body data-user-role="instructor">
    <!-- 상단 헤더 -->
    <header th:replace="~{fragments/instructor :: header('공지사항')}"></header>

<!-- 왼쪽 사이드바 -->
    <th:block th:replace="~{fragments/instructor :: sidebar('notices')}"/>   
    
    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <!-- 훈련생 관리 -->
        <section class="main-content-inner">
            <div th:replace="${sampleData} ? ~{fragments/instructor :: sampleNotice} : ~{}"></div>

            <!-- 필터 영역 -->
            <form class="filter-section" method="get" th:action="@{/instructor/notice}">
                <div class="filter-row">
                    <div>
                        <label>등록일</label>
                        <select id="dateFilter">
                            <option value="">전체</option>
                            <option value="today">오늘</option>
                            <option value="this-week">이번 주</option>
                            <option value="this-month">이번 달</option>
                            <option value="custom">직접 선택</option>
                        </select>
                    </div>
                    <div id="customDateRange" style="display: none;">
                        <input type="date" id="startDate">
                        <span style="margin: 0 4px;">~</span>
                        <input type="date" id="endDate">
                    </div>
                    <div class="filter-item">
                        <label>검색</label>
                        <input type="text" id="searchInput" name="keyword" th:value="${keyword}" placeholder="공지사항 제목, 작성자, 내용으로 검색">
                    </div>
                    <button class="btn btn-secondary" type="submit">
                        검색하기
                    </button>
                    <!-- 강사의 공지 등록은 관리자 화면(/admin/notice)을 공유한다 (SecurityConfig: /admin/notice/** → ADMIN,INSTRUCTOR) -->
                    <a class="btn btn-primary" th:href="@{/admin/notice/new}" style="width: 130px; height: 38px;">
                        <span>+</span>
                        <span>공지사항 등록</span>
                    </a>
                </div>
            </form>
            <section class="notice-board-section">
                <table class="notice-table">
                    <colgroup>
                        <col style="width: 5%;">
                        <col style="width: 10%;">
                        <col style="width: 40%;">
                        <col style="width: 10%;">
                        <col style="width: 12%;">
                        <col style="width: 12%;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>번호</th>
                            <th>카테고리</th>
                            <th>제목</th>
                            <th>작성자</th>
                            <th>작성일</th>
                            <th>수정일</th>
                            <th>조회수</th>
                        </tr>
                    </thead>
                    <tbody id="noticeTableBody">
                        <tr th:each="row : ${rows}">
                            <td th:text="${row.id}">1</td>
                            <td th:text="${row.category}">일반</td>
                            <td><a th:href="@{/instructor/notice/{id}(id=${row.id})}" th:text="${row.title}">제목</a></td>
                            <td th:text="${row.author}">관리자</td>
                            <td th:text="${row.date}">2026-01-01</td>
                            <td th:text="${row.editDate}">2026-01-01</td>
                            <td th:text="${row.views}">0</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(rows)}"><td colspan="7">등록된 공지가 없습니다.</td></tr>
                    </tbody>
                </table>
                <!-- 페이지네이션 -->
                <div class="pagination">
                    <div class="page-info">
                        <!-- 결과가 없으면 페이지 수를 말하지 않는다 (admin-alarm.html 과 같은 이유) -->
                        <span th:if="${totalPages > 0 and !#lists.isEmpty(rows)}">
                            <span id="currentPageInfo" th:text="${currentPage}">1</span> / <span id="totalPagesInfo" th:text="${totalPages}">1</span> 페이지
                        </span>
                        <span th:if="${#lists.isEmpty(rows)}">결과가 없습니다</span>
                    </div>
                    <!-- 서버 페이징: pagination.js 의 changePage() 는 클라이언트 배열 전용이라 링크로 대체 -->
                    <!-- 페이지가 하나뿐이면 버튼을 그리지 않는다. 누를 수 없는 "1" 만 남으면 고장으로 보인다 -->
                    <div class="pagination-controls" th:if="${totalPages > 1}">
                        <a id="prevPage" class="btn" th:classappend="${currentPage <= 1} ? 'disabled'"
                           th:href="@{/instructor/notice(page=${currentPage - 1},keyword=${keyword})}">이전</a>
                        <div id="pageNumbers">
                            <a th:each="p : ${#numbers.sequence(1, totalPages)}"
                               th:href="@{/instructor/notice(page=${p},keyword=${keyword})}"
                               th:text="${p}" th:classappend="${p == currentPage} ? 'active'">1</a>
                        </div>
                        <a id="nextPage" class="btn" th:classappend="${currentPage >= totalPages} ? 'disabled'"
                           th:href="@{/instructor/notice(page=${currentPage + 1},keyword=${keyword})}">다음</a>
                    </div>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
