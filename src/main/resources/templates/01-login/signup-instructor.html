<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/font-style.css">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <title>Samsung Academy LXP - 강사 회원가입</title>
</head>
<style>
    body.login-bg {
        background: url('/static/img/login-bg.jpg') no-repeat center center fixed;
        background-size: cover; min-height: 100vh; width: 100vw;
        /* common-style.css 의 body { height:100vh; overflow:hidden } 해제 — 긴 가입 폼 스크롤 허용 */
        height: auto; overflow-y: auto;
    }
    .signup-card {
        width: 480px; max-width: 92vw; margin: 4vh auto;
        background: rgba(255,255,255,0.92);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        border-radius: 10px; border: 0.5px solid rgba(255,255,255,0.3);
        padding: 2.5rem 2.5rem 2rem; font-family: "Paperlogy", sans-serif;
    }
    .signup-card img.logo { display: block; width: 9rem; margin: 0 auto 1.5rem; }
    /* Paperlogy 는 Thin/Light/Medium 3종뿐이라 600 이면 가짜 볼드가 합성된다. 실제 있는 500 사용. */
    .signup-card h2 { text-align: center; font-size: 1.4rem; font-weight: 500; margin: 0 0 1.5rem; }
    .field { margin-bottom: 1.1rem; }
    .field > label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.35rem; color: #333; }
    .field .req { color: #d33; margin-left: 2px; }
    .field input[type=text], .field input[type=password], .field input[type=email],
    .field input[type=date], .field select {
        width: 100%; padding: 9px 12px; border: 1px solid #999; border-radius: 4px;
        font-size: 0.95rem; box-sizing: border-box; font-family: inherit;
    }
    .field input:focus, .field select:focus {
        border-color: var(--color-primary); outline: none;
        box-shadow: 0 0 0 2px rgba(0, 105, 255, 0.1);
    }
    .radio-group { display: flex; gap: 1.5rem; align-items: center; }
    .radio-group label { display: flex; align-items: center; gap: 5px; font-size: 0.95rem; cursor: pointer; }
    .field-error { color: #d33; font-size: 0.8rem; margin-top: 0.3rem; }
    .consent-box { border-top: 1px solid #ddd; margin-top: 1.5rem; padding-top: 1.2rem; }
    .consent-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 0.7rem; font-size: 0.9rem; }
    .consent-row input { margin-top: 3px; }
    .form-buttons { display: flex; gap: 10px; margin-top: 1.8rem; }
    .form-buttons button {
        flex: 1; padding: 11px 0; font-size: 1rem; border-radius: 5px; cursor: pointer; border: 1px solid #000;
    }
    .btn-submit { background: #000; color: #fff; }
    .btn-submit:hover { background: var(--color-deep-primary); border-color: var(--color-deep-primary); }
    .btn-back { background: #fff; color: #000; }
    .btn-back:hover { background: #f0f0f0; }
</style>
<body class="login-bg">
    <form class="signup-card" th:action="@{/signup/instructor}" th:object="${signupForm}" method="post">
        <img class="logo" src="/static/img/logo.png" alt="logo">
        <h2>강사 회원가입</h2>

        <div class="field">
            <label>아이디<span class="req">*</span></label>
            <input type="text" th:field="*{loginId}" placeholder="영문·숫자 4~20자" autocomplete="username">
            <div class="field-error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></div>
        </div>
        <div class="field">
            <label>비밀번호<span class="req">*</span></label>
            <input type="password" th:field="*{password}" placeholder="8자 이상" autocomplete="new-password">
            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="field">
            <label>비밀번호 확인<span class="req">*</span></label>
            <input type="password" th:field="*{passwordConfirm}" autocomplete="new-password">
            <div class="field-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></div>
            <div class="field-error" th:if="${#fields.hasErrors('passwordMatched')}" th:errors="*{passwordMatched}"></div>
        </div>
        <div class="field">
            <label>이름<span class="req">*</span></label>
            <input type="text" th:field="*{name}" placeholder="이름을 입력하세요">
            <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="field">
            <label>이메일<span class="req">*</span></label>
            <input type="email" th:field="*{email}" placeholder="sample@example.com">
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="field">
            <label>연락처<span class="req">*</span></label>
            <input type="text" th:field="*{phone}" placeholder="010-1234-5678">
            <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>
        <div class="field">
            <label>생년월일<span class="req">*</span></label>
            <input type="date" th:field="*{birthDate}">
            <div class="field-error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
        </div>
        <div class="field">
            <label>성별</label>
            <div class="radio-group">
                <label><input type="radio" th:field="*{gender}" value="male"> 남</label>
                <label><input type="radio" th:field="*{gender}" value="female"> 여</label>
            </div>
        </div>
        <div class="field">
            <label>최종학력</label>
            <select th:field="*{education}">
                <option value="">-- 선택 --</option>
                <option value="highschool">고등학교 졸업</option>
                <option value="junior_college_graduate">전문대 졸업</option>
                <option value="university_enrolled">4년제 대학 재학</option>
                <option value="university_graduate">4년제 대학 졸업</option>
                <option value="graduate_graduate">대학원 졸업</option>
            </select>
        </div>

        <div class="consent-box">
            <div class="consent-row">
                <input type="checkbox" th:field="*{privacyConsent}" id="privacyConsent">
                <label for="privacyConsent">[필수] 개인정보 수집·이용에 동의합니다.</label>
            </div>
            <div class="field-error" th:if="${#fields.hasErrors('privacyConsent')}" th:errors="*{privacyConsent}"></div>
            <div class="consent-row">
                <input type="checkbox" th:field="*{thirdPartyConsent}" id="thirdPartyConsent">
                <label for="thirdPartyConsent">[필수] 개인정보 제3자 제공에 동의합니다.</label>
            </div>
            <div class="field-error" th:if="${#fields.hasErrors('thirdPartyConsent')}" th:errors="*{thirdPartyConsent}"></div>
        </div>

        <div class="form-buttons">
            <button type="button" class="btn-back" onclick="location.href='/signup'">되돌아가기</button>
            <button type="submit" class="btn-submit">회원가입하기</button>
        </div>
    </form>
</body>
</html>
