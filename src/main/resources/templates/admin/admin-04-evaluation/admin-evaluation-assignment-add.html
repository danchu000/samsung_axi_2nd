<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <!-- AI 학습진단에서 넘어온 경우 값을 미리 채운다 (?aiTask=... 없으면 아무 일도 안 함) -->
    <link rel="stylesheet" href="/static/css/ai-common.css">
    <script src="/static/js/ai-assign-prefill.js" defer></script>
    
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>
    <style>
        /* 추가적인 페이지별 스타일은 여기에 작성 */
    </style>
</head>
<body>
    <!-- 상단 헤더 -->
    <header th:replace="~{fragments/admin :: header('평가 관리 > 과제 채점 > 과제 배정')}"></header>

    <!-- 왼쪽 사이드바 (+ 토글 버튼) -->
    <th:block th:replace="~{fragments/admin :: sidebar('eval-assignment')}"></th:block>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <section class="main-content-inner" style="max-width:900px;">

            <!--
              배정 폼. 신규는 POST /admin/evaluation/assignments,
              수정은 POST /admin/evaluation/assignments/{id} 로 같은 화면을 재사용한다.
              th:action 이므로 CSRF 히든필드는 Thymeleaf 가 자동으로 넣는다.
            -->
            <form th:object="${form}" method="post"
                  th:action="${form.id == null}
                             ? @{/admin/evaluation/assignments}
                             : @{/admin/evaluation/assignments/{id}(id=${form.id})}">

            <!-- 서비스가 던진 검증 오류(기준 배점 합계 불일치, 중복 배정 등)는 전역 오류로 붙는다. -->
            <div th:if="${#fields.hasGlobalErrors()}"
                 style="margin-bottom:16px;padding:12px 14px;border-radius:8px;background:var(--color-danger-bg);color:var(--color-danger);">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">오류</div>
            </div>

            <!-- Step 1: 과정 선택 -->
            <div class="step-box">
                <div class="step-indicator">Step 1</div>
                <div class="step-title">과정 선택</div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label required" for="courseSelect">과정</label>
                        <select class="form-select" id="courseSelect" th:field="*{courseId}" required>
                            <option value="">과정 선택</option>
                            <option th:each="c : ${courseOptions}"
                                    th:value="${c.id}" th:text="${c.label()}">과정</option>
                        </select>
                        <div class="form-help" style="color:var(--color-danger);"
                             th:if="${#fields.hasErrors('courseId')}" th:errors="*{courseId}"></div>
                    </div>
                </div>
            </div>

            <!-- Step 2: 콘텐츠 은행에서 과제 선택 -->
            <div class="step-box">
                <div class="step-indicator">Step 2</div>
                <div class="step-title">콘텐츠 은행에서 과제 선택</div>
                <div class="filter-row">
                    <div>
                        <label>제목</label>
                        <input type="text" class="form-input" id="filterTitle" placeholder="과제명 검색">
                    </div>
                    <div>
                        <label>난이도</label>
                        <select class="form-select" id="filterDifficulty">
                            <option value="">전체</option>
                            <option value="easy">easy</option>
                            <option value="medium">medium</option>
                            <option value="hard">hard</option>
                        </select>
                    </div>
                    <div>
                        <label>카테고리</label>
                        <select class="form-select" id="filterCategory">
                            <option value="">전체</option>
                            <option value="KDT">KDT</option>
                            <option value="고교위탁">고교위탁</option>
                        </select>
                    </div>
                    <div>
                        <label>상태</label>
                        <select class="form-select" id="filterStatus">
                            <option value="">전체</option>
                            <option value="Active">활성화</option>
                            <option value="Archived">비활성화</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-secondary" id="searchBtn">검색</button>
                </div>
                <table class="assignment-table" style="width:100%; border-collapse:collapse; margin-top:10px;">
                    <thead>
                        <tr>
                            <th>제목</th>
                            <th>난이도</th>
                            <th>카테고리</th>
                            <th>상태</th>
                            <th>선택</th>
                        </tr>
                    </thead>
                    <!-- 예전에는 JS 더미로 그렸다. 지금은 서버(Assignment 정의)에서 내려온다. -->
                    <tbody id="assignmentTableBody">
                        <tr th:each="a : ${assignmentOptions}"
                            th:attr="data-title=${a.title},data-difficulty=${a.difficulty},data-category=${a.category},data-status=${a.status}"
                            th:classappend="${form.assignmentId != null and #strings.toString(form.assignmentId) == a.id} ? 'selected-row'">
                            <td th:text="${a.title}">제목</td>
                            <td th:text="${a.difficulty}">난이도</td>
                            <td th:text="${a.category}">카테고리</td>
                            <td>
                                <span th:class="${a.status == 'Active'}
                                                 ? 'status-badge status-in-progress'
                                                 : 'status-badge status-disabled'"
                                      th:text="${a.status == 'Active'} ? '활성화' : '비활성화'">상태</span>
                            </td>
                            <td>
                                <label style="cursor:pointer;">
                                    <input type="radio" th:field="*{assignmentId}" th:value="${a.id}"
                                           th:attr="data-score=${a.maxScore},data-type=${a.defaultSubmissionType}"
                                           class="assignment-pick">
                                    선택
                                </label>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(assignmentOptions)}">
                            <td colspan="5" style="color:var(--gray-500);">등록된 과제가 없습니다. 아래에서 먼저 과제를 등록하세요.</td>
                        </tr>
                    </tbody>
                </table>
                <div class="form-help" style="color:var(--color-danger);"
                     th:if="${#fields.hasErrors('assignmentId')}" th:errors="*{assignmentId}"></div>
            </div>

            <!-- Step 3: 운영 설정 -->
            <div class="step-box">
                <div class="step-indicator">Step 3</div>
                <div class="step-title">과제 운영 설정</div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label required" for="startDate">시작일</label>
                        <input type="date" class="form-input" id="startDate" th:field="*{startDate}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label required" for="endDate">종료일</label>
                        <input type="date" class="form-input" id="endDate" th:field="*{endDate}" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="allowResubmit">재제출 허용</label>
                        <select class="form-select" id="allowResubmit" th:field="*{allowResubmit}">
                            <option value="false">허용 안함</option>
                            <option value="true">허용</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="maxResubmit">최대 재제출 횟수</label>
                        <input type="number" class="form-input" id="maxResubmit" min="0"
                               th:field="*{maxResubmit}" placeholder="1">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="allowLate">늦은 제출 허용</label>
                        <select class="form-select" id="allowLate" th:field="*{allowLate}">
                            <option value="false">허용 안함</option>
                            <option value="true">허용</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label required" for="score">배점</label>
                        <input type="number" class="form-input" id="score" min="1" th:field="*{score}" required>
                        <div class="form-help" style="color:var(--color-danger);"
                             th:if="${#fields.hasErrors('score')}" th:errors="*{score}"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="passScore">합격 기준(점)</label>
                        <input type="number" class="form-input" id="passScore" min="0" th:field="*{passScore}">
                        <div class="form-help">비우면 배점의 60%를 합격 기준으로 본다.</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="statusSelect">공개 상태</label>
                        <select class="form-select" id="statusSelect" th:field="*{status}">
                            <option value="DRAFT">비공개(작성중)</option>
                            <option value="SCHEDULED">공개 예정</option>
                            <option value="OPEN">진행중</option>
                            <option value="CLOSED">마감</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Step 4: 평가방식 -->
            <div class="step-box">
                <div class="step-indicator">Step 4</div>
                <div class="step-title">평가방식</div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="autoGrading">자동 채점 여부</label>
                        <select class="form-select" id="autoGrading" th:field="*{autoGrading}">
                            <option value="false">아니오</option>
                            <option value="true">예</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label required" for="grader">채점자</label>
                        <select class="form-select" id="grader" th:field="*{graderId}" required>
                            <option value="">채점자 선택</option>
                            <option th:each="i : ${instructorOptions}"
                                    th:value="${i.id}"
                                    th:text="${i.name} + ' (' + ${i.loginId} + ')'">강사</option>
                        </select>
                        <div class="form-help" style="color:var(--color-danger);"
                             th:if="${#fields.hasErrors('graderId')}" th:errors="*{graderId}"></div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:2;">
                        <label class="form-label" for="criteriaList">평가 기준</label>
                        <div id="criteriaList">
                            <!-- 저장된 기준이 있으면 서버에서 그려주고, 없으면 JS 가 빈 행 1개를 만든다. -->
                            <div class="criteria-item" style="display:flex; gap:8px; margin-bottom:6px;"
                                 th:each="content, st : *{criteriaContents}">
                                <input type="text" class="form-input" name="criteriaContents"
                                       th:value="${content}" placeholder="예: 코드의 정확성" style="flex:1;">
                                <input type="number" class="form-input" name="criteriaScores" min="0"
                                       th:value="${form.criteriaScores.size() > st.index} ? ${form.criteriaScores[st.index]} : 0"
                                       placeholder="배점" style="width:110px;">
                                <button type="button" class="btn btn-gray btn-sm remove-criteria">삭제</button>
                            </div>
                        </div>
                        <button type="button" class="btn btn-secondary btn-sm" id="addCriteriaBtn" style="margin-top:6px;">+ 평가 기준 추가</button>
                        <div class="form-help">각 평가 기준과 배점을 입력하세요. <b>배점 합계는 위 "배점"과 같아야 합니다.</b> 기준을 비워두면 총점 채점입니다.</div>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-back" onclick="window.history.back()">취소</button>
                <button type="submit" class="btn btn-save" id="submitBtn">저장하기</button>
            </div>
            </form>

            <!--
              콘텐츠 은행에 정의가 하나도 없으면 배정 자체를 못 하므로 같은 화면에서 만들 수 있게 했다.
              (새 화면을 만들지 않는다는 규칙에 따라 배정 화면 안에 넣었다. 폼 중첩은 불가라 형제로 둔다.)
            -->
            <div class="step-box" style="margin-top:32px;">
                <div class="step-indicator">콘텐츠 은행</div>
                <div class="step-title">새 과제 등록</div>
                <form th:object="${assignmentForm}" method="post"
                      th:action="@{/admin/evaluation/assignments/definitions}">
                    <div class="form-row">
                        <div class="form-group" style="flex:2;">
                            <label class="form-label required" for="newAssignmentTitle">과제명</label>
                            <input type="text" class="form-input" id="newAssignmentTitle" th:field="*{title}">
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="newAssignmentType">제출 유형</label>
                            <select class="form-select" id="newAssignmentType" th:field="*{defaultSubmissionType}">
                                <option value="DOCUMENT">문서 제출</option>
                                <option value="LINK">링크 제출</option>
                                <option value="TEXT">텍스트 입력</option>
                                <option value="DOCUMENT_TEXT">문서+텍스트</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label required" for="newAssignmentScore">기본 배점</label>
                            <input type="number" class="form-input" id="newAssignmentScore" min="1" th:field="*{maxScore}">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="newAssignmentCategory">카테고리</label>
                            <select class="form-select" id="newAssignmentCategory" th:field="*{category}">
                                <option value="KDT">KDT</option>
                                <option value="고교위탁">고교위탁</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="newAssignmentDifficulty">난이도</label>
                            <select class="form-select" id="newAssignmentDifficulty" th:field="*{difficulty}">
                                <option value="easy">easy</option>
                                <option value="medium">medium</option>
                                <option value="hard">hard</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group" style="flex:2;">
                            <label class="form-label" for="newAssignmentDesc">과제 설명</label>
                            <textarea class="form-input" id="newAssignmentDesc" rows="3" th:field="*{description}"></textarea>
                        </div>
                    </div>
                    <div class="button-group" style="justify-content:flex-end;">
                        <button type="submit" class="btn btn-secondary" id="createDefinitionBtn">콘텐츠 은행에 등록</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <style>
        .step-title { font-size: 20px; font-weight: 700; margin-bottom: 18px; color: var(--color-primary); }
        .step-box { background: #fff; border-radius: 10px; border: 1px solid var(--gray-200); padding: 28px 32px 32px 32px; margin-bottom: 32px; }
        .form-row { display: flex; gap: 24px; margin-bottom: 18px; }
        .form-group { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 15px; font-weight: 600; color: var(--gray-800); margin-bottom: 2px; }
        .form-label.required::after { content: '*'; color: var(--color-danger); margin-left: 4px; }
        .form-input, .form-select { padding: 10px 14px; border: 1px solid var(--gray-300); border-radius: 7px; font-size: 15px; }
        .form-input:focus, .form-select:focus { border-color: var(--color-primary); outline: none; }
        .step-indicator { font-size: 15px; color: var(--gray-500); margin-bottom: 8px; }
        .assignment-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .assignment-table th, .assignment-table td { border: 1px solid var(--gray-200); padding: 10px; text-align: center; }
        .assignment-table th { background: var(--gray-50); font-weight: 600; }
        .assignment-table tbody tr:hover { background: #f5faff; cursor: pointer; }
        .button-group { display: flex; justify-content: space-between; gap: 16px; margin-top: 32px; }
        .step-box + .step-box { margin-top: 0; }
        .filter-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
        .filter-row > div { display: flex; align-items: center; gap: 6px; }
        .filter-row label { white-space: nowrap; }
        .filter-row input[type="text"] { min-width: 180px; flex: 1 1 0; }
        .selected-row { background: #e6f0ff !important; }
    </style>
    <script>
    /* ===== 서버 연동 (개발자 B) =====
       - Step 2 후보 테이블은 서버(th:each)가 그린다. 여기 JS 는 필터(행 숨김)만 담당한다.
       - 평가 기준 행은 name="criteriaContents" / "criteriaScores" 로 제출된다
         (같은 순서로 짝지어 서버 CourseAssignmentForm 이 받는다).
    */
    document.addEventListener('DOMContentLoaded', function() {
        // ===== 평가 기준 동적 추가/삭제 =====
        const criteriaList = document.getElementById('criteriaList');
        const addBtn = document.getElementById('addCriteriaBtn');

        function createCriteriaRow() {
            const div = document.createElement('div');
            div.className = 'criteria-item';
            div.style.display = 'flex';
            div.style.gap = '8px';
            div.style.marginBottom = '6px';
            div.innerHTML =
                '<input type="text" class="form-input" name="criteriaContents" placeholder="예: 코드의 정확성" style="flex:1;">' +
                '<input type="number" class="form-input" name="criteriaScores" min="0" placeholder="배점" style="width:110px;">' +
                '<button type="button" class="btn btn-gray btn-sm remove-criteria">삭제</button>';
            return div;
        }
        if (criteriaList && !criteriaList.querySelector('.criteria-item')) {
            criteriaList.appendChild(createCriteriaRow());
        }
        if (addBtn) {
            addBtn.addEventListener('click', function() {
                criteriaList.appendChild(createCriteriaRow());
            });
        }
        if (criteriaList) {
            criteriaList.addEventListener('click', function(e) {
                if (e.target.classList.contains('remove-criteria')) {
                    if (criteriaList.children.length > 1) {
                        e.target.closest('.criteria-item').remove();
                    }
                }
            });
        }

        // ===== Step 2 후보 목록 필터 (서버가 그린 행을 숨김/표시) =====
        const tbody = document.getElementById('assignmentTableBody');
        function applyFilters() {
            if (!tbody) return;
            const title = (document.getElementById('filterTitle').value || '').trim().toLowerCase();
            const difficulty = document.getElementById('filterDifficulty').value;
            const category = document.getElementById('filterCategory').value;
            const status = document.getElementById('filterStatus').value;

            tbody.querySelectorAll('tr[data-title]').forEach(function(tr) {
                let show = true;
                if (title && !(tr.dataset.title || '').toLowerCase().includes(title)) show = false;
                if (difficulty && tr.dataset.difficulty !== difficulty) show = false;
                if (category && tr.dataset.category !== category) show = false;
                if (status && tr.dataset.status !== status) show = false;
                tr.style.display = show ? '' : 'none';
            });
        }
        const searchBtn = document.getElementById('searchBtn');
        if (searchBtn) searchBtn.addEventListener('click', applyFilters);
        const filterTitle = document.getElementById('filterTitle');
        if (filterTitle) {
            filterTitle.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); applyFilters(); }
            });
        }

        // ===== 과제 선택 시: 선택 행 강조 + 배점을 정의의 기본값으로 채워준다 =====
        if (tbody) {
            tbody.addEventListener('change', function(e) {
                if (!e.target.classList.contains('assignment-pick')) return;
                tbody.querySelectorAll('tr').forEach(function(tr) { tr.classList.remove('selected-row'); });
                e.target.closest('tr').classList.add('selected-row');

                const scoreInput = document.getElementById('score');
                if (scoreInput && !scoreInput.value) {
                    scoreInput.value = e.target.dataset.score || '';
                }
            });
        }
    });
    </script>
</body>
</html>
