<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">

    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>
    <style>
        /* 추가적인 페이지별 스타일은 여기에 작성 */
        .form-error {
            margin-bottom: 18px;
            padding: 12px 16px;
            border-radius: 6px;
            background: #FDECEA;
            color: #C62828;
            font-size: 14px;
            line-height: 1.6;
        }
        .field-error { color: #C62828; font-size: 13px; }
        .check-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 24px;
        }
        .check-grid label { font-size: 15px; }
    </style>
</head>
<body data-user-role="admin">
    <!-- 상단 헤더 -->
    <header th:replace="~{fragments/admin :: header('평가 관리 &gt; 시험 관리 &gt; 시험 만들기')}"></header>

    <!-- 왼쪽 사이드바 -->
    <th:block th:replace="~{fragments/admin :: sidebar('eval-exam')}"></th:block>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <section class="main-content-inner">
            <div class="test-create-container" style="max-width:800px;background:#fff;border-radius:12px;padding:36px 32px 32px 32px;border: 1px solid var(--color-line-gray);">
                <div class="section-title" style="font-size:22px;font-weight:700;margin-bottom:18px;color:#1a1a1a;">시험 만들기</div>

                <form id="testForm" method="post" th:action="@{/admin/evaluation/exams}" th:object="${form}">
                    <!-- 서버 검증 실패 메시지 (배점 합계, 합격점수 등). #fields 는 th:object 안에서만 쓸 수 있다. -->
                    <div class="form-error" th:if="${#fields.hasGlobalErrors()}">
                        <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                    </div>
                    <div style="display:flex;gap:24px;margin-bottom:18px;">
                        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
                            <label style="font-size:15px;font-weight:600;color:#333;" for="testName">시험명</label>
                            <input type="text" class="form-input" id="testName" name="examName" required th:value="*{examName}">
                            <span class="field-error" th:if="${#fields.hasErrors('examName')}" th:errors="*{examName}"></span>
                        </div>
                        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
                            <label style="font-size:15px;font-weight:600;color:#333;" for="testType">유형</label>
                            <select class="form-select" id="testType" name="examType">
                                <option value="단위시험" th:selected="*{examType == '단위시험'}">단위시험</option>
                                <option value="중간고사" th:selected="*{examType == '중간고사'}">중간고사</option>
                                <option value="기말고사" th:selected="*{examType == '기말고사'}">기말고사</option>
                            </select>
                        </div>
                    </div>

                    <!-- 과정/과목/차시/강사 (A 소유 데이터 — 읽기만 한다) -->
                    <div style="display:flex;gap:24px;margin-bottom:18px;">
                        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
                            <label style="font-size:15px;font-weight:600;color:#333;" for="courseId">과정</label>
                            <select class="form-select" id="courseId" name="courseId" required>
                                <option value="">과정 선택*</option>
                                <option th:each="c : ${courseOptions}" th:value="${c.value}" th:text="${c.label}"
                                        th:selected="${form.courseId != null and #strings.toString(form.courseId) == c.value}"></option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('courseId')}" th:errors="*{courseId}"></span>
                        </div>
                        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
                            <label style="font-size:15px;font-weight:600;color:#333;" for="instructorId">출제 강사</label>
                            <select class="form-select" id="instructorId" name="instructorId">
                                <option value="">선택 안 함</option>
                                <option th:each="i : ${instructorOptions}" th:value="${i.value}" th:text="${i.label}"
                                        th:selected="${form.instructorId != null and #strings.toString(form.instructorId) == i.value}"></option>
                            </select>
                        </div>
                    </div>
                    <div style="font-size:13px;color:#888;margin-bottom:18px;">
                        과목·차시 연계는 시험 저장 후 수정 화면에서 선택할 수 있습니다 (선택한 과정에 속한 목록만 표시).
                    </div>

                    <!-- 응시 기간 (내역서: 응시 가능 기간) -->
                    <div style="display:flex;gap:24px;margin-bottom:18px;">
                        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
                            <label style="font-size:15px;font-weight:600;color:#333;" for="windowStart">응시 시작일시</label>
                            <input type="datetime-local" class="form-input" id="windowStart" name="windowStart" required
                                   th:value="${form.windowStart != null} ? ${#temporals.format(form.windowStart, 'yyyy-MM-dd''T''HH:mm')} : ''">
                            <span class="field-error" th:if="${#fields.hasErrors('windowStart')}" th:errors="*{windowStart}"></span>
                        </div>
                        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
                            <label style="font-size:15px;font-weight:600;color:#333;" for="windowEnd">응시 종료일시</label>
                            <input type="datetime-local" class="form-input" id="windowEnd" name="windowEnd" required
                                   th:value="${form.windowEnd != null} ? ${#temporals.format(form.windowEnd, 'yyyy-MM-dd''T''HH:mm')} : ''">
                            <span class="field-error" th:if="${#fields.hasErrors('windowEnd')}" th:errors="*{windowEnd}"></span>
                        </div>
                    </div>

                    <div style="display:flex;gap:24px;margin-bottom:18px;">
                        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
                            <label style="font-size:15px;font-weight:600;color:#333;" for="timeLimit">제한시간 (분)</label>
                            <input type="number" class="form-input" id="timeLimit" name="timeLimitMin" min="1" th:value="*{timeLimitMin}">
                            <span class="field-error" th:if="${#fields.hasErrors('timeLimitMin')}" th:errors="*{timeLimitMin}"></span>
                        </div>
                        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
                            <label style="font-size:15px;font-weight:600;color:#333;" for="passScore">합격점수</label>
                            <input type="number" class="form-input" id="passScore" name="passScore" min="0" th:value="*{passScore}">
                            <span class="field-error" th:if="${#fields.hasErrors('passScore')}" th:errors="*{passScore}"></span>
                        </div>
                        <div style="flex:1;display:flex;align-items:center;gap:8px;margin-top:28px;">
                            <input type="hidden" name="_randomOrder" value="on">
                            <input type="checkbox" id="randomOrder" name="randomOrder" th:checked="*{randomOrder}">
                            <label for="randomOrder" style="font-size:15px;">랜덤출제 사용</label>
                        </div>
                    </div>

                    <!-- 수동 문제 추가 영역 (랜덤출제 미사용 시 표시) -->
                    <div style="border-top:1.5px solid #e0e0e0;margin:32px 0 24px 0;"></div>
                    <!-- 시험 구성(수동 문제 추가) 영역 -->
                    <div id="manualQuestionArea" style="margin-bottom:24px;">
                        <div style="display:flex;align-items:center;gap:16px; margin-bottom:10px;">
                            <span style="font-size:16px;font-weight:600;">시험 구성</span>
                                <button type="button" class="btn btn-add" id="addManualQuestionBtn">문제 추가</button>
                                <!-- 문제 검색 모달 -->
                                <div id="questionModal" class="modal" style="display:none;position:fixed;z-index:9999;left:0;top:0;width:100vw;height:100vh;background:rgba(0,0,0,0.25);align-items:center;justify-content:center;">
                                    <div class="modal-content" style="background:#fff;padding:32px 28px 24px 28px;border-radius:12px;max-width:800px;width:95vw;box-shadow:0 2px 16px rgba(0,0,0,0.12);position:relative;">
                                        <span class="close" id="closeQuestionModal" style="position:absolute;top:18px;right:22px;font-size:22px;cursor:pointer;">&times;</span>
                                        <h2 style="font-size:20px;font-weight:700;margin-bottom:18px;">문제 검색</h2>
                                        <form id="questionSearchForm" style="margin-bottom:18px;display:flex;flex-direction:column;gap:12px;">
                                            <div style="display:flex;gap:12px;">
                                                <select id="category1" style="flex:1;padding:6px 10px;font-size:15px;">
                                                    <option value="">대분류 선택</option>
                                                </select>
                                                <select id="category2" style="flex:1;padding:6px 10px;font-size:15px;">
                                                    <option value="">중분류 선택</option>
                                                </select>
                                                <select id="category3" style="flex:1;padding:6px 10px;font-size:15px;">
                                                    <option value="">소분류 선택</option>
                                                </select>
                                            </div>
                                            <div style="display:flex;gap:12px;align-items: center;">
                                                <input type="text" id="searchTitle" placeholder="제목" style="flex:1;padding:6px 10px;font-size:15px;">
                                                <button type="submit" class="btn btn-search">검색</button>
                                            </div>
                                        </form>
                                        <div id="questionList" style="min-height:120px;margin-bottom:18px;"></div>
                                        <div id="questionPagination" style="display:flex;justify-content:center;gap:6px;"></div>
                                    </div>
                                </div>
                        </div>
                        <div id="manualQuestionList">
                            <!-- 수동 추가된 문제 리스트가 여기에 표시됩니다. -->
                        </div>
                    </div>

                    <div id="ruleSection">
                        <div class="section-title" style="font-size:18px;margin-bottom:10px;">문제 출제 규칙</div>
                        <div class="rule-list" id="ruleList" style="margin-bottom:12px;"></div>
                        <button type="button" class="btn btn-add" id="addRuleBtn">+ 규칙 추가</button>
                        <div style="font-size:13px;color:#888;margin-top:8px;">
                            규칙은 조건만 저장됩니다. 실제 출제 문항은 저장 후 수정 화면의
                            <b>[규칙으로 문항 확정]</b> 버튼으로 확정하세요 (응시 문항 재현 요건).
                        </div>
                        <!-- 규칙 추가 모달 -->
                        <div id="addRuleModal" class="modal" style="display:none;position:fixed;z-index:9999;left:var(--sidebar-width);top:0;width:100vw;height:100vh;background:rgba(0,0,0,0.25);align-items:center;justify-content:center;">
                            <div class="modal-content" style="background:#fff;padding:32px 28px 24px 28px;border-radius:12px;max-width:800px;width:95vw;box-shadow:0 2px 16px rgba(0,0,0,0.12);position:relative;">
                                <span class="close" id="closeAddRuleModal" style="position:absolute;top:18px;right:22px;font-size:22px;cursor:pointer;">&times;</span>
                                <h2 style="font-size:20px;font-weight:700;margin-bottom:18px;">규칙 추가</h2>
                                <!-- 시험 폼 안에 폼을 중첩할 수 없으므로 div 로 두고 JS 가 hidden input 을 만든다 -->
                                <div id="addRuleForm" style="display:flex;flex-direction:column;gap:14px;">
                                    <label>대분류</label>
                                    <select id="addRuleSubject" class="form-input">
                                        <option value="">대분류 선택*</option>
                                    </select>
                                    <label>중분류</label>
                                    <select id="addRuleTopic" class="form-input">
                                        <option value="">중분류 선택</option>
                                    </select>
                                    <label>소분류</label>
                                    <select id="addRuleSubtopic" class="form-input">
                                        <option value="">소분류 선택</option>
                                    </select>
                                    <div>
                                        <label>난이도</label>
                                        <div style="display:flex;gap:8px;">
                                            <select id="addRuleDifficultyLevel1" class="form-input">
                                                <option value="">난이도 선택</option>
                                                <option value="EASY">Easy</option>
                                                <option value="MEDIUM">Medium</option>
                                                <option value="HARD">Hard</option>
                                            </select>
                                            <input type="number" id="addRuleDifficultyCount1" class="form-input" min="0" placeholder="개수">
                                            <select id="addRuleDifficultyLevel2" class="form-input">
                                                <option value="">난이도 선택</option>
                                                <option value="EASY">Easy</option>
                                                <option value="MEDIUM">Medium</option>
                                                <option value="HARD">Hard</option>
                                            </select>
                                            <input type="number" id="addRuleDifficultyCount2" class="form-input" min="0" placeholder="개수">
                                            <select id="addRuleDifficultyLevel3" class="form-input">
                                                <option value="">난이도 선택</option>
                                                <option value="EASY">Easy</option>
                                                <option value="MEDIUM">Medium</option>
                                                <option value="HARD">Hard</option>
                                            </select>
                                            <input type="number" id="addRuleDifficultyCount3" class="form-input" min="0" placeholder="개수">
                                        </div>
                                    </div>
                                    <div>
                                        <label>태그</label>
                                        <input type="text" id="addRuleTags" class="form-input" placeholder="예: iteration">
                                    </div>
                                    <div>
                                        <label>총 문항수</label>
                                        <input type="number" id="addRuleCount" class="form-input" min="1" disabled>
                                    </div>
                                    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px;">
                                        <button type="button" class="btn btn-gray" id="cancelAddRule">취소</button>
                                        <button type="button" class="btn btn-save" id="submitAddRule">추가</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div style="border-top:1.5px solid #e0e0e0;margin:32px 0 24px 0;"></div>
                    <div style="display:flex;align-items:center;gap:18px;font-size:16px;margin-bottom:8px;">
                        <span>👉 현재 총 문항 수: <span id="currentCount">0</span> / <span id="maxCount">0</span></span>
                        <span id="countWarning" style="color:#e67e22;font-size:15px;"></span>
                    </div>

                    <div style="border-top:1.5px solid #e0e0e0;margin:32px 0 24px 0;"></div>
                    <!-- 배점: 자동채점 + 수동채점 = 총점 (서버에서 다시 검증한다) -->
                    <div style="margin-bottom:18px;">
                        <div class="section-title" style="font-size:18px;margin-bottom:10px;">배점</div>
                        <div style="display:flex;align-items:flex-end;gap:18px;">
                            <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
                                <label for="autoScore">자동채점 배점</label>
                                <input type="number" class="form-input" id="autoScore" name="autoScore" min="0" th:value="*{autoScore}">
                            </div>
                            <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
                                <label for="manualScore">수동채점 배점</label>
                                <input type="number" class="form-input" id="manualScore" name="manualScore" min="0" th:value="*{manualScore}">
                            </div>
                            <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
                                <label for="totalScore">총점</label>
                                <input type="number" class="form-input" id="totalScore" name="totalScore" min="1" th:value="*{totalScore}">
                            </div>
                        </div>
                        <div style="font-size:13px;color:#888;margin-top:6px;">
                            자동채점 배점 + 수동채점 배점 = 총점 이어야 하며, 합격점수는 총점을 넘을 수 없습니다.
                        </div>
                    </div>

                    <div style="border-top:1.5px solid #e0e0e0;margin:32px 0 24px 0;"></div>
                    <!-- 응시/보안 설정 (내역서 증빙 요건) -->
                    <div style="margin-bottom:18px;">
                        <div class="section-title" style="font-size:18px;margin-bottom:10px;">응시 · 보안 설정</div>
                        <div class="check-grid">
                            <div>
                                <input type="hidden" name="_requireIdentityVerification" value="on">
                                <input type="checkbox" id="requireIdentityVerification" name="requireIdentityVerification"
                                       th:checked="*{requireIdentityVerification}">
                                <label for="requireIdentityVerification">입장 시 본인인증 (내역서 필수 요건)</label>
                            </div>
                            <div>
                                <input type="hidden" name="_proctorEnabled" value="on">
                                <input type="checkbox" id="proctorEnabled" name="proctorEnabled" th:checked="*{proctorEnabled}">
                                <label for="proctorEnabled">시험 감독(모니터링) 사용</label>
                            </div>
                            <div>
                                <input type="hidden" name="_requireWebcam" value="on">
                                <input type="checkbox" id="requireWebcam" name="requireWebcam" th:checked="*{requireWebcam}">
                                <label for="requireWebcam">웹캠 필수</label>
                            </div>
                            <div>
                                <input type="hidden" name="_blockTabSwitch" value="on">
                                <input type="checkbox" id="blockTabSwitch" name="blockTabSwitch" th:checked="*{blockTabSwitch}">
                                <label for="blockTabSwitch">탭 전환 차단</label>
                            </div>
                            <div>
                                <input type="hidden" name="_blockCopyPaste" value="on">
                                <input type="checkbox" id="blockCopyPaste" name="blockCopyPaste" th:checked="*{blockCopyPaste}">
                                <label for="blockCopyPaste">복사/붙여넣기 차단</label>
                            </div>
                            <div>
                                <input type="hidden" name="_retakeAllowed" value="on">
                                <input type="checkbox" id="retakeAllowed" name="retakeAllowed" th:checked="*{retakeAllowed}">
                                <label for="retakeAllowed">재응시 허용</label>
                                <input type="number" class="form-input" id="maxAttempts" name="maxAttempts" min="1"
                                       style="width:70px;margin-left:8px;" th:value="*{maxAttempts}">
                                <span style="font-size:14px;">회</span>
                            </div>
                        </div>
                    </div>

                    <div style="border-top:1.5px solid #e0e0e0;margin:32px 0 24px 0;"></div>
                    <div style="display:flex;gap:24px;margin-bottom:18px;">
                        <div style="flex:2;display:flex;flex-direction:column;gap:6px;">
                            <label style="font-size:15px;font-weight:600;color:#333;" for="note">응시 안내 문구</label>
                            <textarea class="form-input" id="note" name="note" rows="3" th:text="*{note}"></textarea>
                        </div>
                        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
                            <label style="font-size:15px;font-weight:600;color:#333;" for="status">상태</label>
                            <select class="form-select" id="status" name="status">
                                <option value="임시저장" th:selected="*{status == '임시저장'}">임시저장</option>
                                <option value="예정" th:selected="*{status == '예정'}">예정</option>
                                <option value="진행중" th:selected="*{status == '진행중'}">진행중</option>
                                <option value="종료" th:selected="*{status == '종료'}">종료</option>
                                <option value="보관" th:selected="*{status == '보관'}">보관</option>
                            </select>
                        </div>
                    </div>

                    <div style="border-top:1.5px solid #e0e0e0;margin:32px 0 24px 0;"></div>

                    <!-- 수동 문제/규칙이 hidden input 으로 들어가는 자리 -->
                    <div id="hiddenInputs"></div>

                    <div style="display:flex;gap:16px;justify-content:flex-end;margin-top:30px;">
                        <button type="button" class="btn btn-gray"
                                th:onclick="|location.href='@{/admin/evaluation/exams}'|">목록</button>
                        <button type="submit" class="btn btn-save">저장</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script th:inline="javascript">
        /* 서버가 내려준 문제은행(사용중) 목록. 모달의 클라이언트 필터가 이 배열을 쓴다. */
        window._questionPool = /*[[${questionPool}]]*/ [];
        /* 수정 화면에서 넘어온 기존 값 (등록 화면은 비어 있다) */
        window._selectedQuestions = /*[[${examQuestions}]]*/ [];
        window._savedRules = /*[[${form.rules}]]*/ [];
    </script>
    <script src="/static/js/exam-form.js" defer></script>
</body>
</html>
