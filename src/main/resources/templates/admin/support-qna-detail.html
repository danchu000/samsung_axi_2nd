<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Q&A 상세</title></head><body><main><a th:href="@{/admin/support/qna}">목록</a><h1 th:text="${detail.title}"></h1><pre th:text="${detail.content}"></pre><article th:each="answer : ${detail.answers}"><strong th:text="${answer.responderName}"></strong><pre th:text="${answer.content}"></pre></article><form method="post" th:action="@{/admin/support/qna/{id}/answer(id=${detail.id})}"><textarea name="content" required></textarea><button>답변 등록</button></form><form method="post" th:action="@{/admin/support/qna/{id}/close(id=${detail.id})}"><button>종료</button></form></main></body></html>
