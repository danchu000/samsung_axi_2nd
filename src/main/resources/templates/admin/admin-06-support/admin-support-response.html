<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    
    <script src="/static/js/tutoring.js" defer></script>
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>

</head>
<body data-user-role="admin">
    <!-- 상단 헤더 -->
    <header th:replace="~{fragments/admin :: header('학습 지원 &gt; 응답현황')}"></header>

    <!-- 왼쪽 사이드바 -->
    <th:block th:replace="~{fragments/admin :: sidebar('support-response')}"></th:block>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <!-- 훈련생 관리 -->
        <section class="main-content-inner">
            <!-- 필터 영역 -->
            <div class="filter-section">
                <div class="filter-row">
                    <div>
                        <label>구분</label>
                        <select id="typeFilter">
                            <option value="">전체</option>
                            <option value="QnA">QnA</option>
                            <option value="튜터링">튜터링</option>
                        </select>
                    </div>
                    <div>
                        <label>유형</label>
                        <select id="categoryFilter">
                            <option value="">전체</option>
                            <option value="수업">수업</option>
                            <option value="진도">진도</option>
                        </select>
                    </div>
                    <div>
                        <label>상태</label>
                        <select id="statusFilter">
                            <option value="">전체</option>
                            <option value="미답변">미답변</option>
                            <option value="진행중">진행중</option>
                        </select>
                    </div>
                    <div>
                        <label>과정</label>
                        <select id="courseSessionFilter">
                            <option value="">전체</option>
                            <option value="AI 분석 / 3차시">AI 분석 / 3차시</option>
                            <option value="AI 기초 / 2차시">AI 기초 / 2차시</option>
                        </select>
                    </div>
                    <div>
                        <label>요청자</label>
                        <input type="text" id="requesterFilter" placeholder="요청자명 입력">
                    </div>
                    <div>
                        <label>담당자</label>
                        <select id="managerFilter">
                            <option value="">전체</option>
                            <option value="미배정">미배정</option>
                            <option value="홍길동">홍길동</option>
                        </select>
                    </div>
                    <button class="btn btn-secondary" onclick="filterResponseTable()">
                        검색하기
                    </button>
                </div>
            </div>

            <!-- 정렬 -->
            <div class="sort-section" style="margin: 10px 0 18px 0; display: flex; align-items: center; gap: 10px;">
                <label for="sortSelect" style="font-weight:500;">정렬 기준</label>
                <select id="sortSelect" style="height:32px; min-width:120px;">
                    <option value="status">상태순</option>
                    <option value="elapsed">경과시간순</option>
                </select>
                <button id="sortOrderBtn" type="button" aria-label="정렬 순서 변경" style="background:#f5f5f5; border:1px solid #ccc; border-radius:4px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer;">
                    <span id="sortOrderIcon" style="font-size:16px;">▲</span>
                </button>
            </div>
            

            <!-- 테이블 영역 -->
            <table class=" history-table">
                <thead>
                    <tr>
                    <th>구분</th>
                    <th>유형</th>
                    <th>상태</th>
                    <th>과정</th>
                    <th>요청자</th>
                    <th>담당자</th>
                    <th>경과시간</th>
                    <th>관리</th>
                    </tr>
                </thead>

                <tbody>
                    <!-- 동적 생성 영역 -->
                    <tbody id="responseTableBody"></tbody>
                </tbody>
            </table>

        </section>
    </main>

    <!--
      기존 static/js/tutoring.js 의 하드코딩 더미(responseData) 를 서버 데이터로 교체한다.
      값은 전부 문자열로 내린다 (CLAUDE.md: Thymeleaf 인라인 JS 는 String 으로).
    -->
    <script th:inline="javascript">
        window._serverResponseRows = /*[[${rows}]]*/ [];
    </script>
</body>
</html>
