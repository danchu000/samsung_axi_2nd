<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>
    <style>
            
        /* ===== Admin Dashboard Layout ===== */
        .dashboard-wrap {
        display: flex;
        flex-direction: column;
        gap: 16px;
        }

        .dash-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid var(--color-line-gray);
        border-radius: 10px;
        }
        .dash-header h2 {
        margin: 0;
        font-size: 20px;
        
        color: #222;
        }
        .dash-header p {
        margin: 6px 0 0 0;
        font-size: 13px;
        color: #777;
        }
        .dash-date {
        font-size: 13px;
        color: #666;
        white-space: nowrap;
        }

        /* KPI row (5 cards) */
        .kpi-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        }
        .kpi-card {
        background: #fff;
        border: 1px solid var(--color-line-gray);
        border-radius: 12px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 120px;
        }
        .kpi-title {
        font-size: 14px;
        color: #333;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        }
        .kpi-main {
        display: flex;
        flex-direction: column;
        gap: 6px;
        }
        .kpi-main .big {
        font-size: 18px;
        
        color: #222;
        line-height: 1.1;
        }
        .kpi-main .sub {
        font-size: 12px;
        color: #777;
        line-height: 1.4;
        }
        .kpi-actions {
        margin-top: auto;
        display: flex;
        justify-content: flex-end;
        }

        /* 2-col sections */
        .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        }

        .panel {
        background: #fff;
        border: 1px solid var(--color-line-gray);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 160px;
        }
        .panel-header {
        padding: 14px 16px;
        background: #fafafa;
        border-bottom: 1px solid var(--color-line-gray);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        }
        .panel-header h3 {
        margin: 0;
        font-size: 15px;
        
        color: #333;
        }
        .panel-body {
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        }

        /* alert list */
        .alert-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        }
        .alert-item {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid #eee;
        border-radius: 10px;
        padding: 12px;
        }
        .alert-left {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
        flex: 1;
        }
        .alert-title {
        font-size: 13px;
        
        color: #222;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        }
        .alert-meta {
        font-size: 12px;
        color: #777;
        }

        /* charts placeholder */
        .chart-box {
            width: 100%;
            height: 100%;
        border-radius: 12px;
        min-height: 170px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        justify-content: center;
        align-items: center;
        color: #888;
        text-align: center;
        }
        .chart-box strong {
        color: #555;
        font-size: 13px;
        }
        .chart-filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        }
        .chip {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--color-line-gray);
        background: #fff;
        cursor: pointer;
        font-size: 12px;
        color: #666;
        
        }
        .chip.active {
        background: var(--color-primary);
        border-color: var(--color-primary);
        color: #fff;
        }

        /* mini table (div-grid) */
        .mini-table {
        border: 1px solid #eee;
        border-radius: 10px;
        overflow: hidden;
        }
        .mini-head,
        .mini-row {
        display: grid;
        gap: 12px;
        align-items: center;
        padding: 12px;
        }
        .mini-head {
        background: #f5f5f5;
        font-size: 12px;
        
        color: #666;
        }
        .mini-row {
        border-top: 1px solid #eee;
        font-size: 13px;
        color: #333;
        }
        .mini-row:hover {
        background: #fafafa;
        }
        .text-strong {  color: #222; }
        .muted { color: #777; font-size: 12px; }
        .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 12px;
        
        white-space: nowrap;
        background: #f5f5f5;
        color: #666;
        }
        .badge.warn { background: #FFF3E0; color: #F57C00; }
        .badge.ok { background: #E8F5E9; color: #388E3C; }
        .badge.info { background: #E3F2FD; color: #1976D2; }
        .btn-sm {
        padding: 6px 10px !important;
        font-size: 12px !important;
        border-radius: 8px !important;
        white-space: nowrap;
        }

        /* footer notice list */
        .note-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        }
        .note-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid #eee;
        border-radius: 10px;
        padding: 12px;
        }
        .note-title {
        font-size: 13px;
        
        color: #222;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        }

        /* responsive */
        @media (max-width: 1400px) {
        .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (max-width: 1100px) {
        .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .two-col { grid-template-columns: 1fr; }
        }
        @media (max-width: 720px) {
        .kpi-grid { grid-template-columns: 1fr; }
        .dash-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <header th:replace="~{fragments/admin :: header('대시보드')}"></header>
    <th:block th:replace="~{fragments/admin :: sidebar('dashboard')}"/>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <section class="main-content-inner">
        <div class="dashboard-wrap">

            <!-- header -->
            <div class="dash-header">
            <div>
                <h2>운영 현황 요약</h2>
                <p>운영 리스크, 핵심 지표, TOP 현황을 한 화면에서 확인합니다.</p>
            </div>
            <div class="dash-date" id="todayText">오늘: -</div>

            <!-- KPI -->
            <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-title">👥 사용자</div>

                <div class="big" id="kpiUsersMain">-</div>

                <div class="kpi-actions">

                <div class="kpi-main">
                <div class="big" id="kpiCoursesMain">-</div>
                <div class="sub" id="kpiCoursesSub">-</div>
                </div>
                <div class="kpi-actions">
                <button class="btn btn-gray btn-sm" type="button" onclick="location.href='/admin/courses'">과정관리</button>

            <div class="kpi-card">
                <div class="kpi-title">🧾 평가 진행</div>

                <div class="sub" id="kpiEvalSub">-</div>

                <div class="sub" id="kpiAttendSub">-</div>

                <div class="kpi-actions">

                </div>
            </div>

            <div class="kpi-card">
                <div class="kpi-title">💬 응답현황</div>
                <div class="kpi-main">

                <div class="sub" id="kpiSupportSub">-</div>
                </div>
                <div class="kpi-actions">
                <button class="btn btn-gray btn-sm" type="button" onclick="location.href='/admin/support/response'">응답현황</button>
                </div>
            </div>
            </div>

            <!-- Alerts + Trend -->
            <div class="two-col">
            <div class="panel">
                <div class="panel-header">
                <h3>🚨 운영 알림 / 리스크</h3>
                <button class="btn btn-gray btn-sm" type="button" onclick="location.href='/admin/notice/alarms'">전체보기</button>
                </div>
                <div class="panel-body">
                <div class="alert-list" id="riskList"></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                <h3>📈 과제 해결 추이</h3>
                <div class="chart-filters">
                    <button class="chip active" data-range="7d" type="button">7일</button>
                    <button class="chip" data-range="30d" type="button">30일</button>
                    <button class="chip" data-range="custom" type="button">사용자정의</button>
                </div>
                </div>
                <div class="panel-body">
                <div class="chart-box" id="trendBox">
                    <strong>(차트 영역)</strong>
                    <div>출석률/제출률/이수율/문의량 추이를 표시</div>

            <!-- Courses + Evaluations -->
            <div class="two-col">

                </div>
                <div class="panel-body">

                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                <h3>🧾 평가 현황 (시험/과제)</h3>
                <button class="btn btn-gray btn-sm" type="button" onclick="location.href='/admin/evaluation/grading'">평가관리</button>
                </div>

                <div class="mini-table" id="evalTable"></div>
                </div>

            <!-- Attendance/Completion + Support -->

                <button class="btn btn-gray btn-sm" type="button" onclick="location.href='/admin/attendance'">출결/이수</button>
                </div>

                <div class="mini-table" id="completionTable"></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                <h3>💬 응답현황 (튜터링/QnA) (TOP)</h3>
                <button class="btn btn-gray btn-sm" type="button" onclick="location.href='/admin/support/response'">응답현황</button>
                </div>
                <div class="panel-body">
                <div class="mini-table" id="supportTable"></div>
                </div>

            <!-- Notices -->
            <div class="panel">

                <h3>📌 공지 / 시스템 알림</h3>
                <div style="display:flex; gap:8px;">
                <button class="btn btn-gray btn-sm" type="button" onclick="location.href='/admin/notice'">공지관리</button>
                <button class="btn btn-gray btn-sm" type="button" onclick="location.href='/admin/notice/alarms'">알림관리</button>

    </main>

    <script>
    // ===== Dummy Data (Thymeleaf 변환 대비) =====
        const adminDashboardData = {
        today: "2026.01.26 (월)",
        kpi: {
            users: { trainees: 320, instructors: 18, admins: 6 },
            courses: { inProgress: 12, upcoming: 3, ended: 5 },
            evals: { inProgress: 4, upcoming: 2, ended: 7 },
            attendance: { pendingConfirm: 18, confirmed: 42, certificates: 12 },
            support: { unanswered: 9, inProgress: 6, slaRisk: 3 }
        },
        risks: [
            { title: "[출결] 미확정 18명", meta: "기한 임박 6명", href: "/admin/attendance" },
            { title: "[평가] 오늘 종료되는 시험 1건", meta: "종료 전 점검 필요", href: "/admin/evaluation/grading" },
            { title: "[감독] 이상행위 신고 2건", meta: "영상 확인 필요", href: "/admin/evaluation/monitoring" },
            { title: "[응답] SLA 24h 초과 3건", meta: "긴급 응대 필요", href: "/admin/support/response" }
        ],
        courseTop: [
            { name: "풀스택 웹 개발 (React & Node.js)", round: "4기", period: "01.05~03.10", attendanceRate: "92%", target: "28명", status: "진행중" },
            { name: "데이터 사이언스 기초", round: "1기", period: "01.10~02.28", attendanceRate: "88%", target: "24명", status: "진행중" },
            { name: "클라우드 아키텍처", round: "2기", period: "01.01~02.20", attendanceRate: "85%", target: "30명", status: "진행중" }
        ],
        evalTop: [
            { name: "JavaScript 기초 중간 평가", course: "풀스택", status: "진행중", submitted: "18/27", grading: "3대기" },
            { name: "React 과제 1", course: "풀스택", status: "종료", submitted: "25/27", grading: "8대기" },
            { name: "Python 기본 문법 테스트", course: "DS", status: "예정", submitted: "-", grading: "-" }
        ],
        completionTop: [
            { course: "풀스택", trainee: "홍길동", rate: "72%", final: "미이수", confirm: "확정대기" },
            { course: "DS", trainee: "김영희", rate: "78%", final: "이수", confirm: "확정대기" },
            { course: "클라우드", trainee: "박철수", rate: "69%", final: "미이수", confirm: "확정대기" }
        ],
        supportTop: [
            { type: "튜터링", status: "미응답", course: "풀스택", requester: "홍길동", elapsed: "02:13" },
            { type: "QnA", status: "진행중", course: "DS", requester: "김영희", elapsed: "05:42" },
            { type: "튜터링", status: "SLA위험", course: "풀스택", requester: "박철수", elapsed: "26:10" }
        ],
        notices: [
            { title: "평가 운영 정책 변경 안내", href: "/admin/notice" },
            { title: "출결 기준 업데이트", href: "/admin/notice" },
            { title: "시스템 점검 예정 (01.30 02:00~03:00)", href: "/admin/notice" }
        ]
        };

        // ===== Helpers =====
        const $ = (id) => document.getElementById(id);

        // --- 더미 데이터 및 색상 분류 함수 (전역) ---
        function generateDummyCodingData(count = 70) {
            // 고정 시드 random 함수 (간단 구현)
            let seed = 42;
            function random() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            }
            // 0.5~8.0 시간, 1~40 문제, 학생명 더미
            const coding_hours = [];
            const solved_problems = [];
            const students = [];
            for (let i = 0; i < count; i++) {
                coding_hours.push(Math.round((random() * (8 - 0.5) + 0.5) * 10) / 10);
                solved_problems.push(Math.floor(random() * 40) + 1);
                // 더미 학생명: 홍길동1, 홍길동2, ...
                students.push(`홍길동${i+1}`);
            }
            // 단계별 색상 분류
            const colors = solved_problems.map(y => {
                if (y <= 10) return "#B1CFEF"; // 1단계
                if (y <= 20) return "#8AAEE0"; // 2단계
                if (y <= 30) return "#638ECB"; // 3단계
                return "#395886"; // 4단계
            });
            return { coding_hours, solved_problems, colors, students };
        }

        function setKpi() {
        $("todayText").textContent = `${adminDashboardData.today}`;

        const u = adminDashboardData.kpi.users;
        $("kpiUsersMain").textContent = `훈련생 ${u.trainees}명`;
        $("kpiUsersSub").textContent = `강사 ${u.instructors}명 · 관리자 ${u.admins}명`;

        const c = adminDashboardData.kpi.courses;
        $("kpiCoursesMain").textContent = `진행중 ${c.inProgress}개`;
        $("kpiCoursesSub").textContent = `예정 ${c.upcoming}개 · 종료 ${c.ended}개`;

        const e = adminDashboardData.kpi.evals;
        $("kpiEvalMain").textContent = `진행중 ${e.inProgress}건`;
        $("kpiEvalSub").textContent = `예정 ${e.upcoming}건 · 종료 ${e.ended}건`;

        const a = adminDashboardData.kpi.attendance;
        $("kpiAttendMain").textContent = `미확정 ${a.pendingConfirm}명`;
        $("kpiAttendSub").textContent = `이수확정 ${a.confirmed}명 · 이수증 ${a.certificates}건`;

        const s = adminDashboardData.kpi.support;
        $("kpiSupportMain").textContent = `미응답 ${s.unanswered}건`;
        $("kpiSupportSub").textContent = `진행중 ${s.inProgress}건 · SLA위험 ${s.slaRisk}건`;
        }

        function renderRisks() {
        const wrap = $("riskList");
        wrap.innerHTML = "";
        adminDashboardData.risks.forEach(r => {
            const div = document.createElement("div");
            div.className = "alert-item";
            div.innerHTML = `
            <div class="alert-left">
                <div class="alert-title">${r.title}</div>
                <div class="alert-meta">${r.meta}</div>
            </div>
            <div>
                <button class="btn btn-primary btn-sm" type="button" onclick="location.href='${r.href}'">바로가기</button>
            </div>
            `;
            wrap.appendChild(div);
        });
        }

        function renderMiniTable(containerId, columns, rows) {
        const wrap = $(containerId);
        wrap.innerHTML = "";

        const head = document.createElement("div");
        head.className = "mini-head";
        head.style.gridTemplateColumns = columns.map(() => "1fr").join(" ");
        head.innerHTML = columns.map(c => `<div>${c}</div>`).join("");
        wrap.appendChild(head);

        rows.forEach(row => {
            const r = document.createElement("div");
            r.className = "mini-row";
            r.style.gridTemplateColumns = columns.map(() => "1fr").join(" ");
            r.innerHTML = row.join("");
            wrap.appendChild(r);
        });
        }

        function renderTables() {
        // 과정 운영 TOP
        renderMiniTable(
            "courseTable",
            ["과정명", "기수", "기간", "출석률", "이수대상", "상태"],
            adminDashboardData.courseTop.map(x => ([
            `<div class="text-strong" title="${x.name}">${x.name}</div>`,
            `<div>${x.round}</div>`,
            `<div class="muted">${x.period}</div>`,
            `<div>${x.attendanceRate}</div>`,
            `<div>${x.target}</div>`,
            `<div><span class="badge info">${x.status}</span></div>`
            ]))
        );

        // 평가 TOP
        renderMiniTable(
            "evalTable",
            ["평가명", "과정", "상태", "제출", "채점", "관리"],

        // trendBox 영역에 산점도 차트 그리기
        function drawTrendChart(range) {
            const trendBox = $("trendBox");
            // 기존 내용 제거
            trendBox.innerHTML = "";
            // 캔버스 생성 (부모에 더 꽉 차게)
            const canvas = document.createElement("canvas");
            // 실제 픽셀 크기 (고해상도 대응)
            canvas.width = 600;
            canvas.height = 260;
            // CSS 크기 (부모에 맞춤)
            canvas.style.width = "100%";
            canvas.style.height = "260px";
            canvas.style.borderRadius = "12px";
            trendBox.appendChild(canvas);
            // 캡션
            const caption = document.createElement("div");
            caption.style.marginTop = "8px";
            caption.style.fontSize = "13px";
            caption.style.color = "#555";
            caption.textContent =
                range === "7d" ? "최근 7일 기준" :
                range === "30d" ? "최근 30일 기준" :
                "사용자 정의 기간";
            trendBox.appendChild(caption);
    
            // 데이터 생성 (range별 데이터 개수만 다르게)
            let count = 70;
            if (range === "7d") count = 40;
            else if (range === "30d") count = 70;
            else count = 100;
            const { coding_hours, solved_problems, colors, students } = generateDummyCodingData(count);
    
            // 산점도 그리기
            const ctx = canvas.getContext("2d");
            // x: coding_hours(0.5~8), y: solved_problems(1~40)
            const xMin = 0.5, xMax = 8, yMin = 1, yMax = 40;
            // padding
            const pad = 30;
            const w = canvas.width, h = canvas.height;
            // 점 위치 저장용
            const points = [];
            // grid
            ctx.strokeStyle = "#ccc";
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                // x grid
                let x = pad + ((w - 2 * pad) * i / 4);
                ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, h - pad); ctx.stroke();
            }
            for (let i = 0; i <= 4; i++) {
                // y grid
                let y = h - pad - ((h - 2 * pad) * i / 4);
                ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - pad, y); ctx.stroke();
            }
            // 점 찍기 및 위치 저장
            for (let i = 0; i < coding_hours.length; i++) {
                const xVal = coding_hours[i];
                const yVal = solved_problems[i];
                const color = colors[i];
                // 좌표 변환
                const x = pad + ((xVal - xMin) / (xMax - xMin)) * (w - 2 * pad);
                const y = h - pad - ((yVal - yMin) / (yMax - yMin)) * (h - 2 * pad);
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, 2 * Math.PI);
                ctx.fillStyle = color;
                ctx.globalAlpha = 0.85;
                ctx.fill();
                ctx.globalAlpha = 1.0;
                points.push({ x, y, r: 7, name: students[i], hour: xVal, solved: yVal });
            }
                    // 툴팁 div 생성 및 스타일
                    let tooltip = document.getElementById("chartTooltip");
                    if (!tooltip) {
                        tooltip = document.createElement("div");
                        tooltip.id = "chartTooltip";
                        tooltip.style.position = "fixed";
                        tooltip.style.pointerEvents = "none";
                        tooltip.style.background = "rgba(30,40,60,0.97)";
                        tooltip.style.color = "#fff";
                        tooltip.style.padding = "7px 13px";
                        tooltip.style.borderRadius = "7px";
                        tooltip.style.fontSize = "13px";
                        tooltip.style.zIndex = 9999;
                        tooltip.style.boxShadow = "0 2px 8px rgba(0,0,0,0.18)";
                        tooltip.style.display = "none";
                        document.body.appendChild(tooltip);
                    }
                    // 마우스 이벤트
                    canvas.onmousemove = function(e) {
                        const rect = canvas.getBoundingClientRect();
                        const mx = e.clientX - rect.left;
                        const my = e.clientY - rect.top;
                        let found = null;
                        for (let p of points) {
                            const dx = mx * (w / rect.width) - p.x;
                            const dy = my * (h / rect.height) - p.y;
                            if (dx * dx + dy * dy < p.r * p.r) {
                                found = p;
                                break;
                            }
                        }
                        if (found) {
                            tooltip.style.display = "block";
                            tooltip.innerHTML = `<b>${found.name}</b><br>코딩시간: ${found.hour}h<br>푼 문제: ${found.solved}개`;
                            tooltip.style.left = (e.clientX + 12) + "px";
                            tooltip.style.top = (e.clientY - 10) + "px";
                        } else {
                            tooltip.style.display = "none";
                        }
                    };
                    canvas.onmouseleave = function() {
                        tooltip.style.display = "none";
                    };
            // 축 라벨
            ctx.fillStyle = "#333";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("코딩 시간 (시간)", w / 2, h - 5);
            ctx.save();
            ctx.translate(12, h / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.textAlign = "center";
            ctx.fillText("푼 문제 수", 0, 0);
            ctx.restore();
            // 타이틀
            ctx.font = "bold 13px sans-serif";
            ctx.fillStyle = "#222";
            ctx.textAlign = "center";
            ctx.fillText("코딩 시간 대비 문제 해결 분포 (더미)", w / 2, 20);
        }
        function renderNotices() {
        const wrap = $("noticeList");
        wrap.innerHTML = "";
        adminDashboardData.notices.forEach(n => {
            const item = document.createElement("div");
            item.className = "note-item";
            item.innerHTML = `
            <div class="note-title" title="${n.title}">${n.title}</div>
            <button class="btn btn-gray btn-sm" type="button" onclick="location.href='${n.href}'">보기</button>
            `;
            wrap.appendChild(item);
        });
        }

        function bindTrendChips() {
        const chips = document.querySelectorAll(".chip");
        chips.forEach(chip => {
            chip.addEventListener("click", () => {
                chips.forEach(c => c.classList.remove("active"));
                chip.classList.add("active");
                const range = chip.dataset.range;
                drawTrendChart(range);
            });
        });
    }

        setKpi();
        renderRisks();
        renderTables();
        renderNotices();
        bindTrendChips();
        // 최초 차트도 그리기
        drawTrendChart("7d");
    });
