<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>튜터링 상세</title></head><body><main><a th:href="@{/trainee/qna/tutoring}">목록</a><h1 th:text="${detail.title}"></h1><p th:text="${detail.statusLabel}"></p><section><article th:each="message : ${detail.messages}"><strong th:text="${message.senderName}"></strong> <time th:text="${message.sentAt}"></time><pre th:text="${message.content}"></pre></article></section><form th:if="${!detail.closed}" method="post" th:action="@{/trainee/qna/tutoring/{id}/messages(id=${detail.id})}"><textarea name="content" required></textarea><button>보내기</button></form></main></body></html>
