<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/trainees.css">

    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 훈련생 관리</title>
    <style>
        .status-select { padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
        .flash { padding: 12px 16px; border-radius: 6px; margin: 0 20px 12px; font-size: 14px; }
        .flash-success { background: #e8f5e9; color: #2e7d32; }
        .row-actions { display: inline-flex; gap: 6px; align-items: center; }
        .row-actions form { display: inline; margin: 0; }
        #userSearch { width: 100%; padding: 10px 15px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; outline: none; }
    </style>
</head>
<body>
    <header th:replace="~{fragments/admin :: header('사용자 관리 > 훈련생 관리')}"></header>
    <th:block th:replace="~{fragments/admin :: sidebar('user-trainee')}"/>

    <main class="main-content">
        <div class="flash flash-success" th:if="${message}" th:text="${message}"></div>

        <!-- 훈련생 목록 -->
        <section class="trainee-list-section">
            <div class="section-header">
                <h2>훈련생 관리 <small th:text="'(' + ${#lists.size(users)} + '명)'">(0명)</small></h2>
            </div>

            <div class="trainee-list-section-search" style="margin-bottom:16px;">
                <input type="search" id="userSearch" placeholder="이름 또는 아이디로 검색"
                       onkeyup="filterUsers()">
            </div>

            <div class="trainee-list-section-table">
                <table class="trainee-table">
                    <thead>
                        <tr>
                            <th>이름</th>
                            <th>아이디</th>
                            <th>이메일</th>
                            <th>연락처</th>
                            <th>최근접속</th>
                            <th>가입일</th>
                            <th>계정상태</th>
                            <th>처리</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr th:each="u : ${users}"
                            th:classappend="${selected != null and selected.id == u.id} ? 'selected'"
                            th:onclick="|location.href='/admin/users/trainees?selected=${u.id}'|"
                            style="cursor:pointer;">
                            <td class="cell-name" th:text="${u.name}">홍길동</td>
                            <td th:text="${u.loginId}">gildong</td>
                            <td th:text="${u.email}">-</td>
                            <td th:text="${u.phone}">-</td>
                            <td th:text="${u.lastLoginAt != null ? #temporals.format(u.lastLoginAt, 'yyyy-MM-dd') : '-'}">-</td>
                            <td th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'yyyy-MM-dd') : '-'}">-</td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${u.status.name() == 'ACTIVE'} ? 'status-in-progress' : (${u.status.name() == 'PENDING'} ? 'status-pending' : 'status-disabled')"
                                      th:text="${u.status.label}">활성</span>
                            </td>
                            <td onclick="event.stopPropagation()">
                                <div class="row-actions">
                                    <form th:action="@{/admin/users/{id}/status(id=${u.id})}" method="post">
                                        <input type="hidden" name="from" value="/admin/users/trainees"/>
                                        <select name="status" class="status-select" onchange="this.form.submit()">
                                            <option value="ACTIVE" th:selected="${u.status.name()=='ACTIVE'}">활성화</option>
                                            <option value="SUSPENDED" th:selected="${u.status.name()=='SUSPENDED'}">정지</option>
                                        </select>
                                    </form>
                                    <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                                          onsubmit="return confirm('이 계정을 삭제하시겠습니까?');">
                                        <input type="hidden" name="from" value="/admin/users/trainees"/>
                                        <button type="submit" class="btn-small btn-danger">삭제</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="8" style="padding:40px; text-align:center; color:#999;">등록된 훈련생이 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 훈련생 상세정보 -->
        <section class="trainee-detail-section">
            <div class="section-header">
                <h2>훈련생 상세정보</h2>
            </div>

            <div th:if="${selected == null}" style="padding:40px; color:#999;">
                왼쪽 목록에서 훈련생을 선택하면 상세 정보가 표시됩니다.
            </div>

            <div th:if="${selected != null}" class="trainee-detail-basicinfo">
                <div class="trainee-photo">
                    <img th:src="${selected.profileImageUrl != null ? selected.profileImageUrl : '/avatar/' + selected.id + '.svg'}"
                         alt="프로필 사진">
                </div>
                <div class="trainee-basic-info">
                    <div class="info-row">
                        <span class="label">이름</span>
                        <span class="value" th:text="${selected.name}">이름</span>
                        <div class="info-row-badges">
                            <span class="badge-label">계정상태</span>
                            <span class="status-badge status-in-progress" th:text="${selected.status.label}">활성</span>
                        </div>
                    </div>
                    <div class="info-row"><span class="label">아이디</span><span class="value" th:text="${selected.loginId}">-</span></div>
                    <div class="info-row"><span class="label">생년월일</span><span class="value" th:text="${selected.birthDate ?: '-'}">-</span></div>
                    <div class="info-row"><span class="label">성별</span><span class="value" th:text="${selected.gender ?: '-'}">-</span></div>
                    <div class="info-row"><span class="label">이메일</span><span class="value" th:text="${selected.email ?: '-'}">-</span></div>
                    <div class="info-row"><span class="label">연락처</span><span class="value" th:text="${selected.phone ?: '-'}">-</span></div>
                    <div class="info-row"><span class="label">최종학력</span><span class="value" th:text="${selected.education ?: '-'}">-</span></div>
                    <div class="info-row"><span class="label">가입일</span><span class="value" th:text="${selected.createdAt != null ? #temporals.format(selected.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</span></div>
                    <div class="info-row"><span class="label">최근접속일</span><span class="value" th:text="${selected.lastLoginAt != null ? #temporals.format(selected.lastLoginAt, 'yyyy-MM-dd HH:mm') : '-'}">-</span></div>
                </div>
            </div>
            <div th:if="${selected != null}" class="edit-button-container" style="margin-top:20px;">
                <a th:href="@{/admin/users/{id}/access-history(id=${selected.id})}" class="btn btn-secondary">접속 이력</a>
                <a th:href="@{/admin/users/{id}/edit(id=${selected.id})}" class="btn btn-edit">수정하기</a>
            </div>
        </section>
    </main>

    <script>
        function filterUsers() {
            const q = document.getElementById('userSearch').value.toLowerCase();
            document.querySelectorAll('#userTableBody tr').forEach(function (tr) {
                const nameCell = tr.querySelector('.cell-name');
                if (!nameCell) return; // empty-state row
                const text = tr.textContent.toLowerCase();
                tr.style.display = text.includes(q) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
