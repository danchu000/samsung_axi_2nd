<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/pagination.css">
    <link rel="stylesheet" href="/static/css/assignments.css">
    
    <script src="/static/js/assignments.js" defer></script>
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <script src="/static/js/pagination.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>

</head>
<body data-user-role="admin">
    <!-- 상단 헤더 -->
    <header th:replace="~{fragments/admin :: header('평가 관리 > 과제 채점')}"></header>

    <!-- 왼쪽 사이드바 (+ 토글 버튼) -->
    <th:block th:replace="~{fragments/admin :: sidebar('eval-assignment')}"></th:block>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <!-- 과제 채점 -->
        <section class="main-content-inner">
            <!-- 필터 영역 -->
            <div class="filter-section">
                <div class="filter-row">
                    <div>
                        <label>과정명</label>
                        <!-- 이 셀렉트는 클라이언트 필터(assignments.js filterList)가 행의 .course-name
                             텍스트와 비교하므로 value 는 반드시 과정"명" 이어야 한다. id 는 그대로 둔다. -->
                        <select id="courseFilter">
                            <option value="">전체</option>
                            <option th:each="c : ${courseOptions}"
                                    th:value="${c.courseName}" th:text="${c.label()}">과정명</option>
                        </select>
                    </div>
                    <div>
                        <label>상태</label>
                        <select id="statusFilter">
                            <option value="">전체</option>
                            <option value="waiting">평가예정</option>
                            <option value="completed">채점완료</option>
                            <option value="pending">채점예정</option>
                        </select>
                    </div>
                    <div>
                        <label>강사명</label>
                        <!-- 강사 필터도 이름 비교(===)라 value 는 강사명이다. -->
                        <select id="instructorFilter">
                            <option value="">전체</option>
                            <option th:each="i : ${instructorOptions}"
                                    th:value="${i.name}" th:text="${i.name}">강사명</option>
                        </select>
                    </div>
                    <div>
                        <label>등록일</label>
                        <select id="dateFilter">
                            <option value="">전체</option>
                            <option value="today">오늘</option>
                            <option value="this-week">이번 주</option>
                            <option value="this-month">이번 달</option>
                            <option value="custom">직접 선택</option>
                        </select>
                    </div>
                    <div id="customDateRange" style="display: none;">
                        <input type="date" id="startDate">
                        <span style="margin: 0 4px;">~</span>
                        <input type="date" id="endDate">
                    </div>
                    <div class="filter-item">
                        <label>검색</label>
                        <input type="text" id="searchInput" placeholder="과정명, 과제명, 강사명으로 검색">
                    </div>
                    <button type="button" class="btn btn-secondary"
                            onclick="window._assignmentList && window._assignmentList.filter()">
                        검색하기
                    </button>
                    <button type="button" class="btn btn-primary" style="width:130px; height:38px;"
                            th:onclick="|location.href='@{/admin/evaluation/assignments/new}'|">
                        + 과제 배정
                    </button>
                </div>
            </div>

            <!-- 과제 목록 -->
            <div class="assignment-list">
                <div class="assignment-header">
                    <div><input type="checkbox" id="selectAllAssignments"></div>
                    <div>번호</div>
                    <div>과정명</div>
                    <div>과제명</div>
                    <div>강사명</div>
                    <div>과제/시험</div>
                    <div>제출 시작일</div>
                    <div>제출 마감일</div>
                    <div>제출 현황</div>
                    <div>상태</div>
                    <div></div>
                </div>

                <div id="assignmentListItems"></div>
            </div>
            <!-- Bulk action buttons -->
            <div class="bulk-action-area" style="display:flex; gap:10px; margin:16px 0 0 0;">
                <button class="btn btn-gray btn-sm" id="bulkDeleteBtn" data-user-role="admin">선택 삭제</button>
                <button class="btn btn-gray btn-sm" id="bulkDisableBtn">선택한 과제 비활성화</button>
            </div>

            <!-- 페이지네이션 -->
            <div class="pagination">
                <div class="page-info">
                    <span id="currentPageInfo">1</span> / <span id="totalPagesInfo">1</span> 페이지
                    <span class="total-count" th:if="${page != null}"
                          th:text="'(총 ' + ${page.totalCount} + '건)'">(총 0건)</span>
                </div>
                <div class="pagination-controls">
                    <button id="prevPage" onclick="changePage(-1)" disabled>이전</button>
                    <div id="pageNumbers"></div>
                    <button id="nextPage" onclick="changePage(1)">다음</button>
                </div>
            </div>
        </section>
    </main>

    <!-- ===== 서버 연동 (개발자 B) ===== -->
    <!-- 일괄 액션용 POST 폼. th:action 이면 Thymeleaf 가 CSRF 히든필드를 자동으로 넣는다. -->
    <form id="bulkForm" method="post" th:action="@{/admin/evaluation/assignments/close}" style="display:none;"></form>

    <!--
      assignments.js 는 defer 라 파싱 이후에 실행된다. 이 인라인 스크립트는 파싱 중에 먼저
      실행되므로, assignments.js 가 window._serverAssignmentRows 를 읽는 시점에는 이미 채워져 있다.
    -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        window._serverAssignmentRows = /*[[${rows}]]*/ [];
        // 서버 페이징 정보 — server-pagination.js 가 이 값으로 페이지 링크를 그린다 (문제은행과 같은 방식)
        window._serverPage = /*[[${page}]]*/ null;
        window._assignmentBulkUrls = {
            close:  /*[[@{/admin/evaluation/assignments/close}]]*/ '',
            remove: /*[[@{/admin/evaluation/assignments/delete}]]*/ ''
        };
        /*]]>*/
    </script>
    <script src="/static/js/server-pagination.js" defer></script>

    <div th:if="${message}" class="toast-message" th:text="${message}"
         style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:6px;z-index:9999;"></div>
</body>
</html>
