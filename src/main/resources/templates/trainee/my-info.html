<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/basic-form-trainee.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <title>Samsung Academy LXP - 내 정보</title>
    <style>
        .myinfo-wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .info-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 24px; }
        .info-card h3 { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 16px; }
        .form-row { display: flex; align-items: center; margin-bottom: 14px; }
        .form-row > label { width: 130px; font-weight: 600; font-size: 14px; color: #444; }
        .form-row .field { flex: 1; }
        .form-row input[type=text], .form-row input[type=email], .form-row input[type=date],
        .form-row input[type=password] {
            width: 100%; max-width: 340px; padding: 8px 10px; border: 1px solid #ccc;
            border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .form-row input[readonly] { background: #f5f5f5; }
        .radio-group { display: flex; gap: 18px; }
        .radio-group label { display: flex; align-items: center; gap: 5px; font-size: 14px; cursor: pointer; }
        .field-error { color: #c62828; font-size: 12px; margin-top: 4px; display: block; }
        .form-actions { text-align: right; margin-top: 8px; }
        .flash { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        .flash-success { background: #e8f5e9; color: #2e7d32; }
        .flash-error { background: #fdecea; color: #c62828; }
        .status-badge { padding: 3px 10px; border-radius: 12px; font-size: 13px; }
        .status-active { background: #e8f5e9; color: #2e7d32; }
        .status-other { background: #eee; color: #666; }
    </style>
</head>
<body>
    <header th:replace="~{fragments/trainee :: header('my-info')}"></header>

    <main class="page" aria-label="내 정보">
        <section class="main-content-top">
            <div class="main-wrap"><h2>내 정보</h2></div>
        </section>

        <section class="main-content">
            <div class="main-wrap myinfo-wrap">
                <div class="flash flash-success" th:if="${message}" th:text="${message}"></div>
                <div class="flash flash-error" th:if="${pwError}" th:text="${pwError}"></div>

                <!-- 프로필 조회/수정 -->
                <form class="info-card" th:action="@{/trainee/my-info}" th:object="${form}" method="post">
                    <h3>기본 정보</h3>
                    <div class="form-row">
                        <label>아이디</label>
                        <div class="field"><input type="text" th:value="${user.loginId}" readonly></div>
                    </div>
                    <div class="form-row">
                        <label>계정상태</label>
                        <div class="field">
                            <span class="status-badge"
                                  th:classappend="${user.status.name() == 'ACTIVE'} ? 'status-active' : 'status-other'"
                                  th:text="${user.status.label}">활성</span>
                        </div>
                    </div>
                    <div class="form-row">
                        <label>이름</label>
                        <div class="field">
                            <input type="text" th:field="*{name}">
                            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                        </div>
                    </div>
                    <div class="form-row">
                        <label>이메일</label>
                        <div class="field">
                            <input type="email" th:field="*{email}">
                            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                        </div>
                    </div>
                    <div class="form-row">
                        <label>연락처</label>
                        <div class="field"><input type="text" th:field="*{phone}" placeholder="010-0000-0000"></div>
                    </div>
                    <div class="form-row">
                        <label>생년월일</label>
                        <div class="field"><input type="date" th:field="*{birthDate}"></div>
                    </div>
                    <div class="form-row">
                        <label>성별</label>
                        <div class="field radio-group">
                            <label><input type="radio" th:field="*{gender}" value="male"><span>남</span></label>
                            <label><input type="radio" th:field="*{gender}" value="female"><span>여</span></label>
                        </div>
                    </div>
                    <div class="form-row">
                        <label>학력</label>
                        <div class="field"><input type="text" th:field="*{education}" placeholder="예) 4년제 대학 졸업"></div>
                    </div>
                    <div class="form-row">
                        <label>최근접속</label>
                        <div class="field">
                            <span th:text="${user.lastLoginAt != null ? #temporals.format(user.lastLoginAt, 'yyyy-MM-dd HH:mm') : '기록 없음'}">-</span>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">저장하기</button>
                    </div>
                </form>

                <!-- 비밀번호 변경 -->
                <form class="info-card" th:action="@{/trainee/my-info/password}" th:object="${pwForm}" method="post">
                    <h3>비밀번호 변경</h3>
                    <div class="form-row">
                        <label>현재 비밀번호</label>
                        <div class="field">
                            <input type="password" th:field="*{currentPassword}">
                            <span class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
                        </div>
                    </div>
                    <div class="form-row">
                        <label>새 비밀번호</label>
                        <div class="field">
                            <input type="password" th:field="*{newPassword}">
                            <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
                        </div>
                    </div>
                    <div class="form-row">
                        <label>새 비밀번호 확인</label>
                        <div class="field">
                            <input type="password" th:field="*{confirmPassword}">
                            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-secondary">비밀번호 변경</button>
                    </div>
                </form>

                <p style="font-size:13px; color:#888; text-align:center;">
                    계정 상태·역할 변경 및 탈퇴 문의는 담당 관리자에게 문의해 주세요.
                </p>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/trainee :: footer}"></footer>
</body>
</html>
