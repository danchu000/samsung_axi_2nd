<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/result-grading.css">

    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>
    <style>
        /* 추가적인 페이지별 스타일은 여기에 작성 */
        .grade-tabs { display:flex; gap:8px; margin:18px 0 12px; border-bottom:1px solid #e0e4ea; }
        .grade-tab { padding:10px 16px; cursor:pointer; border:0; background:none; font-size:14px; color:#666; }
        .grade-tab.active { color:#1976D2; font-weight:700; border-bottom:2px solid #1976D2; }
        .grade-panel[hidden] { display:none; }
        .grade-table { width:100%; border-collapse:collapse; font-size:13px; }
        .grade-table th, .grade-table td { border-bottom:1px solid #eee; padding:10px 8px; text-align:left; }
        .grade-table th { background:#fafafa; font-weight:600; color:#444; }
        .grade-empty { padding:28px; text-align:center; color:#888; }</style>
</head>
<body>
    <header th:replace="~{fragments/admin :: header('평가 관리 > 시험 채점 > 성적 목록')}"></header>

    <th:block th:replace="~{fragments/admin :: sidebar('eval-exam')}"/>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <!-- 시험 성적 목록 -->
        <section class="main-content-inner">
            <div class="section-header" style="display:flex; justify-content:space-between; align-items:center;">
                <h2 th:text="|${summary.examName} — 성적 목록|">성적 목록</h2>
                <div style="display:flex; gap:8px;">
                    <a class="btn btn-gray btn-sm" th:href="@{|/admin/evaluation/grading/exams/${summary.examId}|}" href="#">채점 화면으로</a>
                    <a class="btn btn-secondary btn-sm" th:href="${summary.csvUrl}" href="#">성적 다운로드 (CSV)</a>
                </div>
            </div>

            <!-- 현황 요약 -->
            <div class="exam-info-card">
                <div class="exam-info-row">
                    <div class="exam-info-item">
                        <div class="exam-info-label">과정명</div>
                        <div class="exam-info-value" th:text="${summary.courseName}">-</div>
                    </div>
                    <div class="exam-info-item">
                        <div class="exam-info-label">합격 기준</div>
                        <div class="exam-info-value" th:text="|${summary.passScore} / ${summary.maxScore}점|">-</div>
                    </div>
                    <div class="exam-info-item">
                        <div class="exam-info-label">응시</div>
                        <div class="exam-info-value" th:text="|${summary.total}명|">-</div>
                    </div>
                    <div class="exam-info-item">
                        <div class="exam-info-label">채점완료</div>
                        <div class="exam-info-value" th:text="|${summary.graded}명|">-</div>
                    </div>
                    <div class="exam-info-item">
                        <div class="exam-info-label">확정</div>
                        <div class="exam-info-value" th:text="|${summary.confirmed}명|">-</div>
                    </div>
                </div>
            </div>

            <div class="grade-tabs">
                <button type="button" class="grade-tab active" data-panel="gradePanel">성적</button>
                <button type="button" class="grade-tab" data-panel="historyPanel">변경 이력</button>
            </div>

            <!-- 성적 -->
            <div class="grade-panel" id="gradePanel">
                <table class="grade-table">
                    <thead>
                    <tr>
                        <th style="width:48px;">No</th>
                        <th>이름</th>
                        <th>아이디</th>
                        <th>자동</th>
                        <th>수동</th>
                        <th>총점</th>
                        <th>합격</th>
                        <th>상태</th>
                        <th>채점자</th>
                        <th>확정일시</th>
                        <th>정정</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${rows}">
                        <td th:text="${row.no}">1</td>
                        <td th:text="${row.userName}">이훈련</td>
                        <td th:text="${row.loginId}">trainee1</td>
                        <td th:text="${row.autoScore} ?: '-'">-</td>
                        <td th:text="${row.manualScore} ?: '-'">-</td>
                        <td th:text="${row.totalScore} ?: '-'">-</td>
                        <td th:text="${row.passedText}">미정</td>
                        <td th:text="${row.statusText}">확정</td>
                        <td th:text="${row.gradedBy}">-</td>
                        <td th:text="${row.confirmedAt}">-</td>
                        <td th:text="${row.historyCount} + '건'">0건</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td colspan="11" class="grade-empty">아직 채점된 성적이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- 변경 이력 (내역서 증빙 — 사유 없는 정정은 애초에 저장되지 않는다) -->
            <div class="grade-panel" id="historyPanel" hidden>
                <table class="grade-table">
                    <thead>
                    <tr>
                        <th style="width:150px;">변경일시</th>
                        <th>대상</th>
                        <th>변경자</th>
                        <th>점수</th>
                        <th>결과</th>
                        <th>사유</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="h : ${histories}">
                        <td th:text="${h.date}">-</td>
                        <td th:text="${h.userName}">-</td>
                        <td th:text="${h.instructor}">-</td>
                        <td th:text="${h.score}">-</td>
                        <td th:text="${h.result}">-</td>
                        <td th:text="${h.reason}">-</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(histories)}">
                        <td colspan="6" class="grade-empty">성적 정정 이력이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.grade-tab').forEach(function (tab) {
                tab.addEventListener('click', function () {
                    document.querySelectorAll('.grade-tab').forEach(function (t) { t.classList.remove('active'); });
                    this.classList.add('active');
                    document.querySelectorAll('.grade-panel').forEach(function (p) {
                        p.hidden = p.id !== tab.dataset.panel;
                    });
                });
            });
        });
    </script>
</body>
</html>
