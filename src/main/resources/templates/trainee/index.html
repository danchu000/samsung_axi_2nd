<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/basic-form-trainee.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/trainee/index.css">
    <link rel="stylesheet" href="/static/css/chatbot.css">
    <script src="/static/js/chatbot.js" defer></script>
    <script src="/static/js/trainee/index.js" defer></script>
    <title>Samsung Academy LXP</title>
</head>
<!-- ********************************************************************************************************* -->
<body>
    <header th:replace="~{fragments/trainee :: header('my-course')}"></header>
    <!-- 메인 컨텐츠 ********************************************************************************************************* -->
    <main>

        <section class="main-container">
            <div class="main-content main-wrap">
                <!-- 학생 메인(홈) 페이지 -->
                <div class="home-page">

                <!-- 상단 요약 -->
                <div class="hero">
                    <div class="hero-left">
                    <h2 class="hero-title">안녕하세요, <span id="hpUserName">훈련생</span>님 👋</h2>
                    <p class="hero-sub" id="hpTodayText">오늘: -</p>

                    <div class="hero-stats" id="hpStats">
                        <!-- JS render -->
                    </div>
                    </div>

                    <div class="hero-right">
                    <div class="quick-actions">
                        <button type="button" class="btn btn-gray" data-go="learning">내 학습</button>
                        <button type="button" class="btn btn-gray" data-go="attendance">출결/이수관리</button>
                        <button type="button" class="btn btn-gray" data-go="examTask">시험/과제</button>
                        <button type="button" class="btn btn-gray" data-go="survey">설문조사</button>
                    </div>
                    <p class="qa-hint">자주 가는 메뉴를 바로 열 수 있어요.</p>
                    </div>
                </div>

                <!-- 오늘 할 일 -->
                <div class="section-double">
                  <div class="card section" style="flex:1.3;">
                      <div class="section-head">
                      <div>
                          <h3 class="section-title">오늘 할 일</h3>
                          <p class="section-desc">마감/진행 중인 항목을 우선으로 보여줘요.</p>
                      </div>
                      <button type="button" class="btn btn-gray" id="hpRefresh">새로고침</button>
                      </div>
  
                      <div class="todo-list" id="hpTodoList"></div>
                      <div class="empty-state" id="hpTodoEmpty" style="display:none;">
                      <p class="empty-title">오늘 할 일이 없어요.</p>
                      <p class="empty-desc">좋아요! 여유롭게 학습을 이어가세요.</p>
                      </div>
                  </div>

                  <!-- 출석체크 확인 페이지 -->
                  <div class="card section" style="flex:1;" id="heart-area">
                    <img src="/static/img/trainee.png" alt="cheerup">
                  </div>
                </div>

                <!-- 진행중 과정 -->
                <div class="card section">
                    <div class="section-head">
                    <div>
                        <h3 class="section-title">진행중 과정</h3>
                        <p class="section-desc">현재 학습 중인 과정을 한눈에 확인해요.</p>
                    </div>
                    </div>

                    <div class="course-grid" id="hpCourseGrid"></div>
                    <div class="empty-state" id="hpCourseEmpty" style="display:none;">
                    <p class="empty-title">진행중인 과정이 없어요.</p>
                    <p class="empty-desc">과정이 배정되면 여기에 표시돼요.</p>
                    </div>
                </div>

                <!-- 공지사항 미리보기 -->
                <!-- 공지사항 (심플) -->
                  <div style="width:100%; display:grid; grid-template-columns: 2.1fr 1fr 1fr 1fr 1fr; gap:12px; align-items:center;">
                      <img src="/static/img/01.png" alt="공지1" style="border-radius:10px; width:100%; height:auto; min-width:60px; object-fit:cover;">
                      <img src="/static/img/02.png" alt="공지2" style="border-radius:10px; width:100%; height:auto; min-width:60px; object-fit:cover;">
                      <img src="/static/img/03.png" alt="공지3" style="border-radius:10px; width:100%; height:auto; min-width:60px; object-fit:cover;">
                      <img src="/static/img/04.png" alt="공지4" style="border-radius:10px; width:100%; height:auto; min-width:60px; object-fit:cover;">
                      <img src="/static/img/05.png" alt="공지5" style="border-radius:10px; width:100%; height:auto; min-width:60px; object-fit:cover;">
                  </div>


                </div>


            </div>
        </section>
        <!-- 플로팅 메뉴 (AI 챗봇) -->
        <div class="floating-chatbot-btn" id="floatingChatbotBtn">
            <img src="/static/img/chatbot.png" alt="AI 헬피 챗봇">
            <span class="chatbot-hint">AI 헬피 챗봇</span>
        </div>

        <!-- Floating Chatbot Window -->
        <div class="floating-chatbot-window" id="floatingChatbotWindow" style="display:none;">
            <div class="chatbot-header">
                <span>AI 헬피 챗봇</span>
                <button class="chatbot-close-btn" id="chatbotCloseBtn" title="닫기">×</button>
            </div>
            <div class="chatbot-messages" id="chatbotMessages">
                <div class="chatbot-msg chatbot-msg-bot">안녕하세요! 무엇을 도와드릴까요?</div>
            </div>
            <div class="chatbot-badge-row" style="padding-left: 15px; display:flex; gap:7px; flex-wrap:wrap;background-color: #f7faff;">
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">출결 확인</span>
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">과제 마감</span>
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">시험 일정</span>
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">Q&A 문의</span>
            </div>
            <div class="chatbot-input-area">
                <input type="text" id="chatbotInput" class="chatbot-input" placeholder="메시지를 입력하세요..." autocomplete="off">
                <button id="chatbotSendBtn" class="chatbot-send-btn">전송</button>
            </div>
        </div>
      </main>
      <!-- ********************************************************************************************************* -->
        <footer th:replace="~{fragments/trainee :: footer}"></footer>

<style>
    /* ===== simple footer ===== */
.simple-footer{

  padding:14px 18px;
  border-top:1px solid #eee;
  background:#fff;
  position: relative;
  bottom: 0;
  width: 100%;
  box-sizing: border-box;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  font-size:12px;
  color:#777;
  font-weight:700;
}

.footer-link{
  color:#777;
  text-decoration:none;
}
.footer-link:hover{
  text-decoration:underline;
}

.footer-dot{
  margin:0 6px;
  color:#ccc;
}

@media (max-width:640px){
  .footer-inner{
    flex-direction:column;
    gap:6px;
  }
}

</style>

</body>
</html>
