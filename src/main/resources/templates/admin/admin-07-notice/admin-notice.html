<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/pagination.css">
    <link rel="stylesheet" href="/static/css/notices.css">
    
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <script src="/static/js/pagination.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>
</head>
<body data-user-role="admin">
    <!-- 상단 헤더 -->
    <header th:replace="~{fragments/admin :: header('공지/알림 > 공지 관리')}"></header>

    <!-- 왼쪽 사이드바 -->
    <th:block th:replace="~{fragments/admin :: sidebar('notice')}"/>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <!-- 훈련생 관리 -->
        <section class="main-content-inner">
            <!-- 필터 영역 -->
            <form class="filter-section" method="get" th:action="@{/admin/notice}">
                <div class="filter-row">
                    <div>
                        <label>카테고리</label>
                        <select id="courseFilter" name="categoryId">
                            <option value="">전체</option>
                            <option th:each="category : ${categories}" th:value="${category.id}"
                                    th:text="${category.name}" th:selected="${category.id == cond.categoryId}">카테고리</option>
                        </select>
                    </div>
                    <div>
                        <label>등록일</label>
                        <select id="dateFilter" name="dateFilter">
                            <option value="">전체</option>
                            <option value="today">오늘</option>
                            <option value="this-week">이번 주</option>
                            <option value="this-month">이번 달</option>
                            <option value="custom">직접 선택</option>
                        </select>
                    </div>
                    <div id="customDateRange" style="display: none;">
                        <input type="date" id="startDate">
                        <span style="margin: 0 4px;">~</span>
                        <input type="date" id="endDate">
                    </div>
                    <div class="filter-item">
                        <label>검색</label>
                        <input type="text" id="searchInput" name="keyword" th:value="${cond.keyword}" placeholder="공지사항 제목, 작성자, 내용으로 검색">
                    </div>
                    <button class="btn btn-secondary" type="submit">
                        검색하기
                    </button>
                    <a class="btn btn-primary" th:href="@{/admin/notice/new}" style="width: 130px; height: 38px;">
                        <span>+</span>
                        <span>공지사항 등록</span>
                    </a>
                </div>
            </form>
            <section class="notice-board-section">
                <table class="notice-table">
                    <colgroup>
                        <col style="width: 5%;">
                        <col style="width: 10%;">
                        <col style="width: 40%;">
                        <col style="width: 10%;">
                        <col style="width: 12%;">
                        <col style="width: 12%;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>번호</th>
                            <th>카테고리</th>
                            <th>제목</th>
                            <th>작성자</th>
                            <th>작성일</th>
                            <th>수정일</th>
                            <th>조회수</th>
                        </tr>
                    </thead>
                    <tbody id="noticeTableBody">
                        <tr th:each="row : ${rows}">
                            <td th:text="${row.id}">1</td><td th:text="${row.category}">일반</td>
                            <td><a th:href="@{/admin/notice/{id}(id=${row.id})}" th:text="${row.title}">제목</a></td>
                            <td th:text="${row.author}">관리자</td><td th:text="${row.date}">2026-01-01</td>
                            <td th:text="${row.editDate}">2026-01-01</td><td th:text="${row.views}">0</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(rows)}"><td colspan="7">등록된 공지가 없습니다.</td></tr>
                    </tbody>
                </table>
                <!-- 페이지네이션 -->
                <div class="pagination">
                    <div class="page-info">
                        <span id="currentPageInfo" th:text="${currentPage}">1</span> / <span id="totalPagesInfo" th:text="${totalPages}">1</span> 페이지
                        (총 <span th:text="${totalCount}">0</span>건)
                    </div>
                    <!-- 서버 페이징이라 pagination.js 의 changePage()(클라이언트 배열 전용)를 링크로 대체했다. -->
                    <div class="pagination-controls">
                        <a id="prevPage" th:classappend="${currentPage <= 1} ? 'disabled'"
                           th:href="@{/admin/notice(page=${currentPage - 1},categoryId=${cond.categoryId},keyword=${cond.keyword})}">이전</a>
                        <div id="pageNumbers">
                            <a th:each="p : ${#numbers.sequence(1, totalPages)}"
                               th:href="@{/admin/notice(page=${p},categoryId=${cond.categoryId},keyword=${cond.keyword})}"
                               th:text="${p}" th:classappend="${p == currentPage} ? 'active'">1</a>
                        </div>
                        <a id="nextPage" th:classappend="${currentPage >= totalPages} ? 'disabled'"
                           th:href="@{/admin/notice(page=${currentPage + 1},categoryId=${cond.categoryId},keyword=${cond.keyword})}">다음</a>
                    </div>
                </div>
            </section>
        </section>
    </main>

</body>
</html>
