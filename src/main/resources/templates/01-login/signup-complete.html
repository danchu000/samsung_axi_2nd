<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/font-style.css">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <title>Samsung Academy LXP - 회원가입 완료</title>
</head>
<style>
    body.login-bg {
        background: url('/static/img/login-bg.jpg') no-repeat center center fixed;
        background-size: cover; height: 100vh; width: 100vw; overflow: hidden;
    }
    .complete-card {
        width: 420px; max-width: 92vw;
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(255,255,255,0.92);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        border-radius: 10px; border: 0.5px solid rgba(255,255,255,0.3);
        padding: 3rem 2.5rem; text-align: center; font-family: "Paperlogy", sans-serif;
    }
    .complete-card img.logo { width: 9rem; margin: 0 auto 2rem; display: block; }
    .complete-card h2 { font-size: 1.5rem; font-weight: 600; margin: 0 0 1rem; }
    .complete-card p { color: #444; line-height: 1.7; font-size: 0.95rem; margin: 0 0 2rem; }
    .complete-card .pending-note {
        background: #f5f7fa; border: 1px solid #e0e6ef; border-radius: 6px;
        padding: 0.9rem 1rem; font-size: 0.88rem; color: #555; margin-bottom: 2rem;
    }
    .go-login-btn {
        width: 100%; padding: 12px 0; font-size: 1rem; border-radius: 5px;
        border: none; background: #000; color: #fff; cursor: pointer;
    }
    .go-login-btn:hover { background: var(--color-deep-primary); }
</style>
<body class="login-bg">
    <div class="complete-card">
        <img class="logo" src="/static/img/logo.png" alt="logo">
        <h2>회원가입이 완료되었습니다</h2>
        <p>Samsung Academy LXP 회원가입 신청이 정상적으로 접수되었습니다.</p>
        <div class="pending-note">
            가입하신 계정은 <strong>관리자 승인 대기(PENDING)</strong> 상태입니다.<br>
            관리자 승인이 완료되면 로그인하실 수 있습니다.
        </div>
        <button type="button" class="go-login-btn" onclick="location.href='/login'">로그인 화면으로</button>
    </div>
</body>
</html>
