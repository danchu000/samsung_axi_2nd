<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"
     aria-label="화면 예시용 강의 영상 정지 화면">
  <!--
    훈련생 VOD 학습(play-video) 화면의 예시 정지 화면(poster).
    SampleScreenData.SAMPLE_VIDEO_POSTER 가 가리킨다 — 재생 가능한 영상 파일을 저장소에 두지
    않으려는 것이고, 실제 콘텐츠가 등록되면 그 영상이 그대로 재생된다.
    제목을 넣지 않는다 — 예시 VOD 3건이 이 한 장을 공유하므로 특정 제목을 박으면 어긋난다.
  -->
  <defs>
    <style>
      .kr { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
      .mono { font-family: Consolas, 'D2Coding', monospace; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2231"/>
      <stop offset="100%" stop-color="#101725"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- ===== 공유 중인 에디터 창 ===== -->
  <g>
    <rect x="96" y="120" width="1120" height="660" rx="14" fill="#161d29"/>

    <!-- 창 제목 표시줄 -->
    <path d="M96 134 a14 14 0 0 1 14 -14 h1092 a14 14 0 0 1 14 14 v34 h-1120 z" fill="#222b3a"/>
    <circle cx="128" cy="151" r="7" fill="#ec6a5e"/>
    <circle cx="152" cy="151" r="7" fill="#f4bf4f"/>
    <circle cx="176" cy="151" r="7" fill="#61c554"/>
    <text class="mono" x="212" y="157" font-size="15" fill="#8b97ab">MemberService.java</text>

    <!-- 줄 번호 여백 -->
    <rect x="96" y="168" width="64" height="612" fill="#131a25"/>
    <g class="mono" font-size="16" fill="#4d596b" text-anchor="end">
      <text x="142" y="216">12</text>
      <text x="142" y="252">13</text>
      <text x="142" y="288">14</text>
      <text x="142" y="324">15</text>
      <text x="142" y="360">16</text>
      <text x="142" y="396">17</text>
      <text x="142" y="432">18</text>
      <text x="142" y="468">19</text>
      <text x="142" y="504">20</text>
      <text x="142" y="540">21</text>
      <text x="142" y="576">22</text>
      <text x="142" y="612">23</text>
      <text x="142" y="648">24</text>
      <text x="142" y="684">25</text>
      <text x="142" y="720">26</text>
    </g>

    <!-- 커서가 놓인 줄 -->
    <rect x="160" y="482" width="1056" height="30" fill="#1e2836"/>

    <!-- 코드 -->
    <g class="mono" font-size="17" fill="#c9d4e4">
      <text x="188" y="216"><tspan fill="#7f9bc4">@Service</tspan></text>
      <text x="188" y="252"><tspan fill="#7f9bc4">@RequiredArgsConstructor</tspan></text>
      <text x="188" y="288"><tspan fill="#8fd3a0">public class</tspan> <tspan fill="#e8d48b">MemberService</tspan> {</text>
      <text x="188" y="324"/>
      <text x="188" y="360">    <tspan fill="#8fd3a0">private final</tspan> <tspan fill="#e8d48b">MemberRepository</tspan> memberRepository;</text>
      <text x="188" y="396"/>
      <text x="188" y="432">    <tspan fill="#7f9bc4">@Transactional</tspan></text>
      <text x="188" y="468">    <tspan fill="#8fd3a0">public void</tspan> <tspan fill="#a8c7f0">rename</tspan>(<tspan fill="#e8d48b">Long</tspan> id, <tspan fill="#e8d48b">String</tspan> name) {</text>
      <text x="188" y="504">        Member member = memberRepository.findById(id)</text>
      <text x="188" y="540">                .orElseThrow(MemberNotFoundException::<tspan fill="#8fd3a0">new</tspan>);</text>
      <text x="188" y="576">        member.rename(name);</text>
      <text x="188" y="612">        <tspan fill="#6b7789">// 변경 감지로 UPDATE 가 자동 실행된다</tspan></text>
      <text x="188" y="648">    }</text>
      <text x="188" y="684">}</text>
    </g>
  </g>

  <!-- ===== 강사 화면 (우측 하단 오버레이) ===== -->
  <g>
    <rect x="1256" y="484" width="248" height="296" rx="12" fill="#20293a"/>
    <circle cx="1380" cy="596" r="54" fill="#33415a"/>
    <circle cx="1380" cy="576" r="21" fill="#6b83ab"/>
    <path d="M1344 632 a36 30 0 0 1 72 0 z" fill="#6b83ab"/>
    <text class="kr" x="1380" y="700" font-size="17" font-weight="700" fill="#e2e9f4" text-anchor="middle">김도현 강사</text>
    <text class="kr" x="1380" y="726" font-size="14" fill="#8b97ab" text-anchor="middle">풀스택 개발 과정</text>
  </g>

  <!-- ===== 머리말 / 꼬리말 ===== -->
  <text class="kr" x="96" y="84" font-size="24" font-weight="700" fill="#e2e9f4">
    K-디지털 트레이닝 풀스택 개발자 양성과정
  </text>
  <text class="kr" x="1504" y="84" font-size="18" fill="#8b97ab" text-anchor="end">Samsung Academy LXP</text>
  <text class="kr" x="96" y="836" font-size="16" fill="#6b7789">화면 예시용 강의 영상입니다.</text>
</svg>
